{{- if and .Values.keycloak.enabled .Values.keycloak.oidcClientSecrets.enabled -}}
{{- $oidc := .Values.keycloak.oidcClientSecrets -}}
{{- if not $oidc.clients -}}
{{- fail "keycloak.oidcClientSecrets.enabled=true exige ao menos um item em keycloak.oidcClientSecrets.clients ({envName, vaultPath, vaultKey})." -}}
{{- end -}}
# Secrets dos clients confidential do realm. Cada item vira uma key com o nome
# de envName, lida por envFrom no pod do Keycloak e no Job realm-reconcile, e
# citada como ${envName} no realm.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "keycloak-replica.oidcClientSecretsName" . }}
  labels:
    {{- include "keycloak-replica.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $oidc.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $oidc.secretStoreRef.kind }}
    name: {{ $oidc.secretStoreRef.name }}
  target:
    name: {{ include "keycloak-replica.oidcClientSecretsName" . }}
    creationPolicy: Owner
  data:
    {{- range $oidc.clients }}
    - secretKey: {{ .envName | quote }}
      remoteRef:
        key: {{ .vaultPath | quote }}
        property: {{ .vaultKey | quote }}
    {{- end }}
{{- end }}
