{{- if and .Values.keycloak.enabled .Values.keycloak.smtp.enabled -}}
{{- $smtp := .Values.keycloak.smtp -}}
# ExternalSecret do relay SMTP institucional (host, usuário e senha). Cada
# key vira variável de ambiente (envFrom) no pod do Keycloak e no Job
# realm-reconcile, e o smtpServer do realm.json as referencia via $(env:...).
# Credencial já existente no Vault, a mesma do envio de e-mail da API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "keycloak-replica.smtpSecretName" . }}
  labels:
    {{- include "keycloak-replica.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $smtp.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $smtp.secretStoreRef.kind }}
    name: {{ $smtp.secretStoreRef.name }}
  target:
    name: {{ include "keycloak-replica.smtpSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: UNIPLUS_SMTP_HOST
      remoteRef:
        key: {{ $smtp.vaultPath | quote }}
        property: {{ $smtp.hostKey | quote }}
    - secretKey: UNIPLUS_SMTP_USERNAME
      remoteRef:
        key: {{ $smtp.vaultPath | quote }}
        property: {{ $smtp.usernameKey | quote }}
    - secretKey: UNIPLUS_SMTP_PASSWORD
      remoteRef:
        key: {{ $smtp.vaultPath | quote }}
        property: {{ $smtp.passwordKey | quote }}
{{- end }}
