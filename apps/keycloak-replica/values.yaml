# Defaults do chart apps/keycloak-replica/.
# Cada environment (environments/<env>/values.yaml) sobrescreve apenas o
# necessário. Por padrão o chart fica DESABILITADO — overlays que precisam
# de Keycloak (ex.: standalone) ligam via `keycloak.enabled: true`.

# Labels padrão Uni+ aplicados em todos os recursos.
commonLabels:
  app.kubernetes.io/part-of: uniplus
  app.kubernetes.io/component: auth

# ============================================================================
# Bloco principal `keycloak.*`. O nome do bloco coincide com a key já em uso
# em environments/standalone-compact/values.yaml (`keycloak.enabled`, `keycloak.govbr`).
# ============================================================================
keycloak:
  # Liga/desliga o chart inteiro. Default false — só os ambientes que
  # precisam de Keycloak (ex.: standalone) ligam explicitamente. Em
  # lab/prod-{sp1,sp2} a federação institucional usa o Keycloak central
  # do CTIC (fora deste chart).
  enabled: false

  image:
    registry: ghcr.io
    repository: unifesspa-edu-br/uniplus-keycloak
    # Imagem composta Uni+ = Keycloak upstream + JAR cpf-matcher (SPI providers
    # institucionais). Tag scheme :<KC-VERSION>-<PATCH-PROVIDERS> publicado pelo
    # workflow release.yml de unifesspa-edu-br/uniplus-keycloak-providers.
    # Standalone usa a MESMA imagem que vai pra HML/PROD para garantir que o
    # smoke E2E valida exatamente o binário de produção (production parity).
    # Sincronizar com appVersion do Chart.yaml.
    tag: "26.6.4-0"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  replicas: 1

  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

  # `hostNetwork: true` é workaround do issue #123 (pods flannel não
  # alcançam o data-host). Após PR #125 o caminho via flannel funciona
  # — manter false por padrão e validar empiricamente em standalone.
  hostNetwork: false

  serviceAccount:
    create: true
    name: ""

  # Banco de dados (Postgres). Credenciais (username/password) chegam
  # via ExternalSecret — ver bloco `externalSecrets.db` abaixo.
  database:
    vendor: postgres
    host: ""
    port: 5432
    name: keycloak

  # Hostname público com que Keycloak se identifica em URIs OIDC. Em 26.x
  # aceita URL completa com path (recomendado quando atrás de proxy
  # servindo sob path — `KC_HOSTNAME=https://example.org/auth`).
  hostname:
    url: ""
    strict: true

  # HTTP listener interno. TLS termina no Traefik — Keycloak fala HTTP
  # em cluster. KC_HTTP_ENABLED é hardcoded como true no deployment
  # (chart só suporta HTTP-to-Traefik; cenário HTTPS-direto exigiria
  # cert+TLS no Pod, fora do escopo dessa topologia).
  http:
    httpPort: 8080
    relativePath: /auth
    proxyHeaders: xforwarded

  # Endpoints de health/metrics na management port (9000 default em 26.x).
  health:
    enabled: true
  metrics:
    enabled: true
  managementPort: 9000

  # Federação Gov.br (Login Único) — ADR-018. Não implementado no MVP
  # standalone; conferir o flag para que overrides existentes (ex.:
  # standalone setando `keycloak.govbr.enabled: false`) não quebrem schema.
  govbr:
    enabled: false

  # Realm import declarativo via `--import-realm` (idempotente em 26.x:
  # se realm existir, importação é pulada — mudanças via Admin UI são
  # preservadas em re-starts).
  realmImport:
    enabled: true
    realmName: uniplus
    # Client OIDC do portal — secret real chega via env var
    # `UNIPLUS_PORTAL_CLIENT_SECRET` (ExternalSecret), substituído no
    # JSON via placeholder `${VAR}` suportado pelo Keycloak.
    portalClient:
      clientId: uniplus-portal
      rootUrl: ""
      redirectUris: []
      webOrigins:
        - "+"

  # Realm reconcile — Job Helm hook (post-install,post-upgrade) que
  # executa keycloak-config-cli (adorsys) para reconciliar o realm
  # declarativamente em runtime, depois do --import-realm já ter sido
  # consumido. Compensa o "skip re-import" do Keycloak 26.x quando o
  # realm já existe (Story #177).
  #
  # Quando ligar:
  # - Standalone/HML/Prod onde mudanças no realm.json (novos clients,
  #   mappers, roles) precisam refletir no cluster sem `kcadm.sh` manual
  #   ou rotação de DB.
  #
  # Quando deixar OFF:
  # - Lab dev local onde o realm é descartado a cada re-bootstrap (o
  #   --import-realm já cobre).
  realmReconcile:
    enabled: false
    image:
      registry: quay.io
      repository: adorsys/keycloak-config-cli
      # Tag matching Keycloak 26.x — major.minor obrigatório (versões
      # diferentes podem falhar em migrations de schema). Versões em
      # https://quay.io/repository/adorsys/keycloak-config-cli?tab=tags
      # 6.5.0-26.5.4 é a tag mais recente disponível; KC 26.6.x ainda sem
      # tag pareada upstream. Mesma major do KC vivo (26.6.4) → admin API
      # estável (`/admin/realms/{realm}/clients/{id}/protocol-mappers/models`
      # não muda). Quando adorsys publicar `*-26.6.x`, abrir follow-up.
      tag: "6.5.0-26.5.4"
      pullPolicy: IfNotPresent
    # Tempo máximo de espera por Keycloak ficar disponível antes de
    # tentar reconciliar. Pod do KC pode estar em rolling restart após
    # upgrade — 120s cobre janela típica.
    availabilityCheckTimeout: "120s"
    # Logging do Job. INFO para diagnóstico padrão; DEBUG em
    # troubleshooting.
    logLevel: INFO
    # Lifecycle do Job. ttlSeconds remove o Job após sucesso para não
    # poluir o namespace; backoffLimit permite até N retries por falha
    # transitória; activeDeadline aborta jobs presos.
    ttlSecondsAfterFinished: 600
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ExternalSecrets — todos os secrets vivem no Vault (`secret/...`).
  # Manifests no Git contêm apenas referências.
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default
    db:
      vaultPath: secret/standalone/postgres/keycloak
      usernameKey: username
      passwordKey: password
    bootstrapAdmin:
      vaultPath: secret/standalone/keycloak/admin
      usernameKey: username
      passwordKey: password
      # uniplus-portal é public client (SPA + PKCE) — não há client_secret
      # para custodiar. Ver apps/keycloak-replica/files/uniplus-realm.json
      # (`publicClient: true`).

  # Exposição externa via Traefik IngressRoute — TLS via cert-manager.
  ingress:
    enabled: false
    entryPoint: websecure
    host: ""
    pathPrefix: /auth
    tls:
      enabled: true
      # Nome do Secret TLS consumido pelo IngressRoute. Se
      # `certManager.enabled: true`, o chart cria um `Certificate`
      # cert-manager apontando este `secretName` para o `clusterIssuer`
      # configurado, e o cert-manager preenche o Secret automaticamente.
      # Se `certManager.enabled: false`, o operador deve garantir que o
      # Secret já exista (ex.: cert manualmente emitido ou Certificate
      # criado fora deste chart).
      secretName: ""
      certManager:
        # Quando true, o chart emite um `Certificate` cert-manager.io/v1
        # com `dnsNames: [ingress.host]` apontando para `secretName`.
        enabled: false
        clusterIssuer: ""

  # NetworkPolicy. Egress liberado para data-host (Postgres) + DNS.
  # Ingress permitido a partir de Traefik (HTTP) e Prometheus (management).
  # Pod NÃO fala diretamente com Vault — ESO sintetiza os Secrets em
  # nome do operator e o Keycloak consome via envFrom.
  networkPolicy:
    enabled: true
    traefikNamespace: traefik
    monitoringNamespace: observability-prometheus
    dataHostCIDR: ""
    dataHostPort: 5432

  # ServiceMonitor — desligado até platform/observability/prometheus/
  # aterrissar (issue #26).
  serviceMonitor:
    enabled: false
    interval: 30s

  # Probes. `startupProbe` com failureThreshold alto absorve a primeira
  # inicialização (auto-build do Keycloak quando `start` sem --optimized).
  startupProbe:
    failureThreshold: 60
    periodSeconds: 10
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5

  # SecurityContext do Pod e do container. Imagem oficial
  # quay.io/keycloak/keycloak:26.6.4 roda como UID 1000.
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # Keycloak escreve em /opt/keycloak/data (cache, themes); read-only
    # rootfs exigiria mounts adicionais — out of scope deste PR.
    readOnlyRootFilesystem: false

  # Env vars adicionais (lista de `{name, value}` ou `{name, valueFrom}`).
  extraEnv: []

  # ExternalSecret consolidado de client_secrets de aplicações OIDC do realm.
  # Cada entrada de `clients` vira uma key remota → key local consumida via
  # ${ENV_NAME} no realm.json (IMPORT_VARSUBSTITUTION_ENABLED=true). Permite
  # que o realm-reconcile-job e o pod KC inicial materializem `secret`
  # automaticamente para clients confidential como `grafana`, sem precisar de
  # kcadm pós-import. O Secret K8s resultante é montado via envFrom no
  # deployment do KC e no Job realm-reconcile.
  oidcClientSecrets:
    enabled: false
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default
    # Lista de clientes OIDC a sincronizar do Vault.
    # Cada item: { envName, vaultPath, vaultKey }
    #   envName  — variável injetada no Pod (referenciada como ${envName} no realm.json)
    #   vaultPath — path no Vault (ex.: secret/standalone/keycloak/clients/grafana)
    #   vaultKey — propriedade dentro do segredo (ex.: client_secret)
    clients: []
