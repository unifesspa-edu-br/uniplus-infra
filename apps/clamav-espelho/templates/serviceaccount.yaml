{{- if and .Values.clamavEspelho.enabled .Values.clamavEspelho.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clamavEspelho.serviceAccountName" . }}
  labels:
    {{- include "clamavEspelho.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
