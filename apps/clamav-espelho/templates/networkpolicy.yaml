{{- if and .Values.clamavEspelho.enabled .Values.clamavEspelho.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clamavEspelho.fullname" . }}
  labels:
    {{- include "clamavEspelho.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clamavEspelho.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Só os pods do verificador (freshclam dos sidecars) leem a base.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.clamavEspelho.networkPolicy.clientNamespace | default "uniplus" }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.clamavEspelho.networkPolicy.clientPodSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS — kube-system/coredns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS para o CDN da base (database.clamav.net) e para o PyPI na
    # instalação do cvdupdate. Sem CIDR fixo: os endereços do CDN mudam.
    # As faixas privadas ficam de fora (inclui a rede de pods 10.42.0.0/16 e a
    # de serviços 10.43.0.0/16 do k3s, ambas dentro de 10.0.0.0/8).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.clamavEspelho.networkPolicy.egressExcept | nindent 14 }}
      ports:
        - port: {{ .Values.clamavEspelho.networkPolicy.egressPort | default 443 }}
          protocol: TCP
{{- end }}
