# Defaults do chart apps/uniplus-api-host/.
# Cada environment (environments/<env>/values.yaml) sobrescreve apenas o
# necessário. Por padrão DESABILITADO — só ambientes onde a imagem estiver
# disponível e os pré-requisitos atendidos (DB, Vault paths, OIDC issuer)
# ligam via `uniplusApiHost.enabled: true`.
#
# Composition root do monólito modular (ADR-0097 do uniplus-api) — hospeda
# os módulos internos Selecao, Ingresso, Configuracao e
# OrganizacaoInstitucional num único processo (`Unifesspa.UniPlus.Host`,
# imagem via docker/Dockerfile.host). Geo (unifesspa-geo-api) e Portal
# (uniplus-api-portal) permanecem deployables autônomos — não fazem parte
# deste chart.

commonLabels:
  app.kubernetes.io/part-of: uniplus
  app.kubernetes.io/component: api

uniplusApiHost:
  enabled: false

  image:
    registry: ghcr.io
    repository: unifesspa-edu-br/uniplus-api-host
    # Sincronizar com tag publicada em GHCR quando o pipeline
    # publish-images.yml do uniplus-api publicar a primeira release do
    # módulo `host` (job `discover` deriva a matriz de docker/Dockerfile.*
    # — hoje inclui host + portal). Até lá, environments de lab usam uma
    # imagem buildada localmente (ver README.md deste chart).
    tag: "v0.1.0"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # API stateless. Em standalone 1 réplica para reduzir uso de recursos.
  replicas: 1

  # Estratégia de atualização do Deployment: `RollingUpdate` (padrão) ou
  # `Recreate`.
  #
  # Com `migrationJob.enabled`, `RollingUpdate` volta a ser seguro: a migration
  # já rodou e passou antes de qualquer pod ser criado. `Recreate` fica para o
  # ambiente que ainda aplica migration no boot do pod e precisa evitar que a
  # versão anterior sirva um schema já alterado.
  deploymentStrategy: RollingUpdate

  # Job que aplica as migrations ANTES do rollout (ADR-0127 do uniplus-api).
  #
  # Desligado por padrão: ligar exige uma imagem que conheça
  # `UniPlus__Migrations__Mode`, e o default preserva o comportamento de quem
  # ainda não migrou para esse desenho.
  #
  # O pod continua aplicando migration no boot mesmo com o Job ligado. Não é
  # descuido: com `ApplyOutOfSyncOnly=true` no ApplicationSet, um sync seletivo
  # aplica o Deployment sem executar hooks, e um pod que não aplicasse subiria
  # contra o schema antigo. A redundância é barata — aplicar é idempotente — e
  # não deixa nenhum caminho sem schema.
  #
  # O que o Job entrega é o momento da falha: uma migration quebrada aborta o
  # sync antes de qualquer pod ser criado ou removido.
  migrationJob:
    enabled: false

    # Migration que falha não melhora com nova tentativa: o motivo costuma ser
    # schema ou dado, não instabilidade. Zero mantém o diagnóstico imediato.
    backoffLimit: 0

    # Teto de tempo do Job. Migration longa que trava seguraria o rollout
    # indefinidamente sem esse limite.
    activeDeadlineSeconds: 600

    # Menores que os do Deployment: o processo aplica schema e encerra, sem
    # servir requisição nem manter conexão de mensageria.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

  resources:
    # Processo único hospedando 4 módulos — requests/limits maiores que os
    # charts de API single-módulo (uniplus-api-portal usa 100m/256Mi).
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  serviceAccount:
    # Nome FIXO para que a role Vault Kubernetes auth (uniplus-api) — que
    # vincula bound_service_account_names — encontre esta SA independente
    # do release name gerado pelo ApplicationSet (`uniplus-api-host-<env>`).
    create: true
    name: uniplus-api-host

  # Cifragem (UniPlus:Encryption). Default Provider=local exige LocalKey via
  # env/Secret — environment override pode trocar para vault em cluster
  # onde platform/vault-transit-bootstrap está aplicado (uniplus-infra#219).
  encryption:
    provider: local
    vaultAddress: ""
    kubernetesRole: ""

  # Schema Registry (ADR-0051) — feature off quando url está vazio (default
  # no lab: Apicurio Registry não roda ainda, issue #423). Kafka também
  # fica desligado enquanto isso — ver bloco kafka abaixo.
  schemaRegistry:
    url: ""
    authType: None
    oauth:
      tokenEndpoint: ""
      clientId: ""

  aspnet:
    environment: Production
    urls: "http://+:8080"

  # === Backend Postgres — banco único `uniplus`, schema-por-módulo
  # (ADR-0097). As 7 connection strings do host (UniPlusDb, ConfiguracaoDb,
  # OrganizacaoDb, SelecaoDb, IngressoDb, PublicacoesDb, DiscentesDb —
  # renderizadas incondicionalmente pelo template) apontam todas para host/database/
  # username abaixo; cada DbContext usa seu próprio schema via
  # HasDefaultSchema. UniPlusDb é consumida pelo outbox Wolverine (schema
  # `wolverine`) e pelos health checks (AddUniPlusHealthChecks
  # connectionStringName: "UniPlusDb"). ===
  database:
    host: ""                    # ex.: 10.0.2.87
    port: 5432
    name: uniplus
    username: uniplus

  # === Backend Redis (default user) ===
  redis:
    host: ""                    # ex.: 10.0.2.87
    port: 6379
    username: default

  # === Backend Kafka ===
  # Desligado por padrão (issue #423 — sem Apicurio Registry no lab ainda,
  # e o único módulo com mensageria Kafka explícita — Selecao — exige
  # Schema Registry alcançável no boot quando Kafka está configurado).
  #
  # Kafka__BootstrapServers é SEMPRE renderizado pelo template (nunca
  # omitido) — quando enabled=false, o valor é " " (espaço), não vazio.
  # Motivo: o host consulta essa chave em dois pontos independentes
  # (Infrastructure.Core/Messaging/WolverineOutboxConfiguration.cs e
  # Selecao.API/SelecaoMessagingRegistration.cs), ambos usando
  # `string.IsNullOrWhiteSpace` — que trata " " como "vazio", desligando o
  # transporte Kafka de forma limpa sem disparar a validação fatal
  # "Kafka:BootstrapServers populado mas SchemaRegistry:Url vazio"
  # (ADR-0051). Mesma receita documentada em
  # uniplus-api/docker/docker-compose.monolito.yml. Omitir a env var por
  # completo (padrão usado nos charts uniplus-api-{selecao,portal} antigos)
  # NÃO é equivalente aqui — descoberto por bug real na Task #412 (issue
  # uniplus-infra#412, revertida): sem a env var setada, o SDK
  # Confluent.Kafka cai no default `localhost:9092` e fica em loop de
  # reconexão eterno, mantendo o /health (readiness) permanentemente
  # Unhealthy mesmo com o transporte Wolverine desligado.
  kafka:
    enabled: false
    bootstrapServers: ""        # ex.: 10.0.2.87:9092 — obrigatório quando enabled=true
    securityProtocol: SASL_SSL
    saslMechanism: SCRAM-SHA-512
    caCertPath: /etc/uniplus-kafka/ca.crt

  # === Backend MinIO S3 — bucket compartilhado com as demais APIs Uni+ ===
  storage:
    endpoint: ""                # ex.: 10.0.2.87:9000
    bucketName: uniplus-storage

  # === OIDC (Auth bearer) — só valida tokens contra o issuer/audience do
  # realm; o Host não se autentica como client M2M contra nada (Schema
  # Registry OAuth desligado enquanto Kafka estiver desligado), então não
  # precisa de um client_secret próprio no Keycloak. ===
  oidc:
    enabled: true
    issuerUri: ""               # ex.: https://standalone.portaluni.com.br/auth/realms/uniplus
    audience: uniplus

  # === CA customizada (opt-in) ===
  # Adiciona um certificado extra ao trust store do container via
  # initContainer + `update-ca-certificates` — necessário quando oidc.
  # issuerUri (ou schemaRegistry.url) aponta para um endpoint HTTPS com
  # certificado não assinado por uma CA pública (ex.: TLS autoassinado de
  # laboratório). Em produção real (Let's Encrypt via cert-manager) isso
  # nunca é necessário — deixar enabled=false.
  #
  # SSL_CERT_FILE/SSL_CERT_DIR NÃO resolvem isso: funcionam para libcurl/
  # OpenSSL (usado por `curl`), mas o runtime .NET no Linux não lê essas
  # env vars para X509Chain/HttpClient — só respeita o bundle do sistema em
  # /etc/ssl/certs/ca-certificates.crt, daí a necessidade do
  # update-ca-certificates real via initContainer (descoberto na issue #432
  # depurando "OIDC discovery respondeu 404" — na verdade uma falha de
  # validação TLS mal reportada pelo health check da aplicação).
  customCA:
    enabled: false
    certPEM: ""                 # PEM completo do certificado (não a chave privada)
    # Alternativa ao PEM versionado: Secret TLS existente no namespace da
    # aplicação. Útil para certificados autoassinados criados pelo bootstrap,
    # pois o Host sempre lê o certificado que o Traefik está servindo.
    # O sidecar refresh-custom-ca observa mudanças no volume projetado e
    # recompõe atomically /etc/ssl/certs/ca-certificates.crt; portanto a
    # rotação do Secret não depende de rollout manual do Deployment.
    existingSecretName: ""
    existingSecretKey: tls.crt

  # === CORS (obrigatório fora de Development) ===
  cors:
    allowedOrigins: []          # ex.: ["https://portal.standalone.portaluni.com.br"]

  # === ExternalSecrets (Vault → K8s Secret) ===
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default

    postgresApp:
      vaultPath: secret/standalone/postgres/uniplus
      passwordKey: password

    redisDefault:
      vaultPath: secret/standalone/redis/default
      passwordKey: password

    kafkaAdmin:
      vaultPath: secret/standalone/kafka/admin
      usernameKey: username
      passwordKey: password
      caCertKey: ca_cert

    minioRoot:
      vaultPath: secret/standalone/minio/root
      usernameKey: username
      passwordKey: password

    # Só relevante quando schemaRegistry.url + authType=OAuthBearer
    # estiverem ativos (issue #423). O Host não tem client M2M próprio
    # dedicado no realm ainda — definir aqui quando a issue #423 avançar.
    oidcClient:
      vaultPath: secret/standalone/keycloak/clients/uniplus-api-host
      clientSecretKey: client_secret

  # === Exposição externa via Traefik IngressRoute ===
  ingress:
    enabled: false
    entryPoint: websecure
    host: ""                    # ex.: api.standalone.portaluni.com.br
    # Roteamento path-based (Host + PathPrefix, sem StripPrefix) — RUNBOOKS §21.3.
    # Lista opcional de prefixos servidos no MESMO host: cada entrada gera uma rota
    # apontando pro mesmo Service (o Host multiplexa módulos + rotas transversais).
    # Vazia/ausente → rota `Host()` pura (comportamento atual; preserva
    # standalone-compact/lab). Semântica de prefixo literal do Traefik v3
    # (`/api/selecao` casa com `/api/selecao/...`); entradas duplicadas/sobrepostas
    # são permitidas (todas → mesmo Service). Ex. HML:
    #   pathPrefixes:
    #     - /api/selecao
    #     - /api/ingresso
    #     - /api/publicacoes
    #     - /api/auth        # transversal — Host é o dono
    #     - /api/profile     # transversal — Host é o dono
    #     - /openapi         # transversal — Host é o dono
    pathPrefixes: []
    tls:
      enabled: true
      secretName: ""
      certManager:
        enabled: false
        clusterIssuer: ""       # ex.: letsencrypt-prod

  # === OpenTelemetry (ADR-0018 uniplus-api + ADR-013 uniplus-infra) ===
  otel:
    enabled: true
    exporter:
      endpoint: ""              # ex.: http://otelcol.observability-otelcol.svc.cluster.local:4317
      protocol: grpc
    resource:
      serviceName: ""

  # === NetworkPolicy ===
  networkPolicy:
    enabled: true
    traefikNamespace: traefik
    monitoringNamespace: observability-prometheus
    dataHostCIDR: ""            # ex.: 10.0.2.0/24
    keycloakService: keycloak-replica-uniplus-standalone
    keycloakNamespace: uniplus
    keycloakPort: 8080
    oidcIssuerCIDR: ""          # ex.: 164.152.53.29/32
    oidcIssuerPort: 443
    schemaRegistryCIDR: ""
    schemaRegistryPort: 443
    otelCollectorNamespace: observability-otelcol
    vaultNamespace: vault
    vaultPort: 8200

  metrics:
    enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s

  # /health/live: dependency-free (sempre 200 enquanto processo respira).
  # /health: agregado readiness — os 4 módulos compartilham o banco
  # `uniplus`, então um único check de banco+infra cobre o processo.
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5

  # Container roda como `appuser` (UID 999, Debian useradd default —
  # docker/Dockerfile.host cria groupadd/useradd explícitos).
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  extraEnv: []
