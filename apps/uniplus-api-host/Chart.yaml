apiVersion: v2
name: uniplus-api-host
description: |
  API .NET 10 — composition root do monólito modular Uni+ (ADR-0097 do
  uniplus-api). Hospeda os módulos internos Selecao, Ingresso, Configuracao
  e OrganizacaoInstitucional num único processo (Unifesspa.UniPlus.Host),
  banco único `uniplus` com schema-por-módulo. Backend ASP.NET Core minimal
  API + Wolverine (CQRS/messaging, instância única para os 4 módulos) +
  Serilog. OpenAPI 3.1 isolado por módulo em /openapi/{modulo}.json. Health:
  /health (readiness agregado), /health/live (liveness).
type: application

version: 0.1.0

# Sincronizar com tag publicada em ghcr.io/unifesspa-edu-br/uniplus-api-host
# quando o pipeline publish-images.yml do uniplus-api publicar a primeira
# release do módulo `host` (ainda não publicada — ver values.yaml).
appVersion: "0.1.0"

home: https://github.com/unifesspa-edu-br/uniplus-infra
sources:
  - https://github.com/unifesspa-edu-br/uniplus-infra
  - https://github.com/unifesspa-edu-br/uniplus-api

maintainers:
  - name: CTIC UNIFESSPA
    email: jeferson.ferreira@unifesspa.edu.br

keywords:
  - uniplus
  - api
  - host
  - monolito-modular
  - dotnet
  - unifesspa

annotations:
  category: api
  licenses: MIT
