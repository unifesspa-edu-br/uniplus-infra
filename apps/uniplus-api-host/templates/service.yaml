{{- if .Values.uniplusApiHost.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uniplusApiHost.fullname" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "uniplusApiHost.selectorLabels" . | nindent 4 }}
{{- end }}
