{{- if and .Values.uniplusApiHost.enabled .Values.uniplusApiHost.ingress.enabled -}}
{{- if not .Values.uniplusApiHost.ingress.host -}}
{{- fail "uniplusApiHost.ingress.host é obrigatório quando ingress.enabled=true (ex.: api-portal.standalone.portaluni.com.br)." -}}
{{- end -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "uniplusApiHost.fullname" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.uniplusApiHost.ingress.entryPoint }}
  routes:
    - match: Host(`{{ .Values.uniplusApiHost.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "uniplusApiHost.fullname" . }}
          port: 8080
  {{- if .Values.uniplusApiHost.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.uniplusApiHost.ingress.tls.secretName | default (printf "%s-tls" (include "uniplusApiHost.fullname" .)) }}
  {{- end }}
{{- end }}
