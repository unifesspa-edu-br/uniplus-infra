{{- if .Values.uniplusApiHost.enabled -}}
{{- if not .Values.uniplusApiHost.database.host -}}
{{- fail "uniplusApiHost.database.host é obrigatório quando enabled=true. Configurar em environments/<env>/values.yaml (ex.: 10.0.2.87)." -}}
{{- end -}}
{{- if not .Values.uniplusApiHost.redis.host -}}
{{- fail "uniplusApiHost.redis.host é obrigatório quando enabled=true." -}}
{{- end -}}
{{- if not .Values.uniplusApiHost.storage.endpoint -}}
{{- fail "uniplusApiHost.storage.endpoint é obrigatório quando enabled=true (MinIO endpoint)." -}}
{{- end -}}
{{- if and .Values.uniplusApiHost.oidc.enabled (not .Values.uniplusApiHost.oidc.issuerUri) -}}
{{- fail "uniplusApiHost.oidc.issuerUri é obrigatório quando oidc.enabled=true." -}}
{{- end -}}
{{- if and .Values.uniplusApiHost.kafka.enabled (not .Values.uniplusApiHost.kafka.bootstrapServers) -}}
{{- fail "uniplusApiHost.kafka.bootstrapServers é obrigatório quando kafka.enabled=true." -}}
{{- end -}}
{{- if eq .Values.uniplusApiHost.encryption.provider "vault" -}}
  {{- if not .Values.uniplusApiHost.encryption.vaultAddress -}}
  {{- fail "uniplusApiHost.encryption.vaultAddress é obrigatório quando encryption.provider=vault. Configurar em environments/<env>/values.yaml (ex.: http://platform-vault-uniplus-standalone.vault.svc.cluster.local:8200)." -}}
  {{- end -}}
  {{- if not .Values.uniplusApiHost.encryption.kubernetesRole -}}
  {{- fail "uniplusApiHost.encryption.kubernetesRole é obrigatório quando encryption.provider=vault. A role precisa existir no Vault (uniplus-infra#219) com bound_service_account_names incluindo a SA deste chart." -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.uniplusApiHost.otel.enabled (not .Values.uniplusApiHost.otel.exporter.endpoint) -}}
{{- fail "uniplusApiHost.otel.exporter.endpoint é obrigatório quando otel.enabled=true. Configurar em environments/<env>/values.yaml apontando para o Service do OTel Collector do cluster (ex.: http://otelcol.observability-otelcol.svc.cluster.local:4317). Sem isto, o SDK .NET cai no default localhost:4317 — drops silenciosos." -}}
{{- end -}}
{{- if and .Values.uniplusApiHost.schemaRegistry.url (eq .Values.uniplusApiHost.schemaRegistry.authType "OAuthBearer") -}}
  {{- if not .Values.uniplusApiHost.schemaRegistry.oauth.tokenEndpoint -}}
  {{- fail "uniplusApiHost.schemaRegistry.oauth.tokenEndpoint é obrigatório quando schemaRegistry.url está populado e authType=OAuthBearer. ADR-0051 exige endpoint /protocol/openid-connect/token do realm Keycloak para emissão do bearer token." -}}
  {{- end -}}
  {{- if not .Values.uniplusApiHost.schemaRegistry.oauth.clientId -}}
  {{- fail "uniplusApiHost.schemaRegistry.oauth.clientId é obrigatório quando schemaRegistry.url está populado e authType=OAuthBearer. client_secret correspondente custodiado no Vault em secret/<env>/keycloak/clients/<clientId>." -}}
  {{- end -}}
{{- end -}}
{{- if not .Values.uniplusApiHost.externalSecrets.enabled -}}
{{- fail "uniplusApiHost.enabled=true requer externalSecrets.enabled=true. Deployment depende dos Secrets sintetizados pelo ESO (Postgres password, Redis, MinIO, Kafka)." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uniplusApiHost.fullname" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.uniplusApiHost.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "uniplusApiHost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uniplusApiHost.labels" . | nindent 8 }}
      {{- if .Values.uniplusApiHost.customCA.enabled }}
      annotations:
        # Sem isso, rotacionar customCA.certPEM (ex.: renovar o certificado
        # autoassinado do lab) só atualiza o ConfigMap — pods já rodando
        # mantêm o bundle antigo no emptyDir (populado uma vez pelo
        # initContainer na criação do pod, nunca re-executado depois) até
        # um restart manual. O checksum muda sempre que o cert muda,
        # forçando o rollout automático do Deployment.
        checksum/custom-ca: {{ .Values.uniplusApiHost.customCA.certPEM | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "uniplusApiHost.serviceAccountName" . }}
      # automountServiceAccountToken=true é necessário quando Provider=vault:
      # VaultTransitEncryptionService lê o JWT projetado em
      # /var/run/secrets/kubernetes.io/serviceaccount/token e autentica no
      # Vault via auth/kubernetes/login. Modo local não usa o token, mas
      # manter true não tem custo prático e mantém simetria entre providers.
      automountServiceAccountToken: true
      {{- with .Values.uniplusApiHost.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.uniplusApiHost.podSecurityContext | nindent 8 }}
      {{- if .Values.uniplusApiHost.customCA.enabled }}
      # initContainer roda update-ca-certificates real (a única forma
      # confiável de o runtime .NET confiar num certificado extra — ver
      # comentário completo em values.yaml uniplusApiHost.customCA).
      # Mesma imagem do container principal: já tem update-ca-certificates
      # (Ubuntu). Roda como root só aqui — o container principal continua
      # non-root (999), consumindo o bundle já pronto via volume compartilhado.
      initContainers:
        - name: install-custom-ca
          image: "{{ .Values.uniplusApiHost.image.registry }}/{{ .Values.uniplusApiHost.image.repository }}:{{ .Values.uniplusApiHost.image.tag }}"
          imagePullPolicy: {{ .Values.uniplusApiHost.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp /custom-ca/ca.crt /usr/local/share/ca-certificates/lab-custom-ca.crt
              update-ca-certificates
              cp -a /etc/ssl/certs/. /merged-ca-certs/
          volumeMounts:
            - name: custom-ca-source
              mountPath: /custom-ca
              readOnly: true
            - name: merged-ca-certs
              mountPath: /merged-ca-certs
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.uniplusApiHost.image.registry }}/{{ .Values.uniplusApiHost.image.repository }}:{{ .Values.uniplusApiHost.image.tag }}"
          imagePullPolicy: {{ .Values.uniplusApiHost.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.uniplusApiHost.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # === ASP.NET Core base ===
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.uniplusApiHost.aspnet.environment | quote }}
            - name: ASPNETCORE_URLS
              value: {{ .Values.uniplusApiHost.aspnet.urls | quote }}
            # === Postgres — banco único `uniplus`, schema-por-módulo (ADR-0097).
            # As 6 connection strings (UniPlusDb/ConfiguracaoDb/OrganizacaoDb/
            # SelecaoDb/IngressoDb/PublicacoesDb) apontam para o MESMO
            # host/database/role — cada DbContext usa seu próprio schema via
            # HasDefaultSchema. UniPlusDb é consumida pelo outbox Wolverine
            # (schema `wolverine`) e pelos health checks
            # (AddUniPlusHealthChecks connectionStringName). ===
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
            {{- $db := .Values.uniplusApiHost.database }}
            {{- range list "UniPlusDb" "ConfiguracaoDb" "OrganizacaoDb" "SelecaoDb" "IngressoDb" "PublicacoesDb" }}
            - name: ConnectionStrings__{{ . }}
              value: "Host={{ $db.host }};Port={{ $db.port }};Database={{ $db.name }};Username={{ $db.username }};Password=$(POSTGRES_PASSWORD)"
            {{- end }}
            # === Redis (Connection string formato StackExchange.Redis) ===
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.redisSecretName" . }}
                  key: REDIS_PASSWORD
            - name: Redis__ConnectionString
              value: "{{ .Values.uniplusApiHost.redis.host }}:{{ .Values.uniplusApiHost.redis.port }},user={{ .Values.uniplusApiHost.redis.username }},password=$(REDIS_PASSWORD)"
            # === Kafka — BootstrapServers SEMPRE setado (nunca omitido). O host
            # lê via string.IsNullOrWhiteSpace em dois pontos independentes
            # (WolverineOutboxConfiguration + SelecaoMessagingRegistration no
            # uniplus-api) — " " (espaço) é tratado como "vazio" por essa
            # checagem, desligando o transporte Kafka de forma limpa sem
            # disparar a validação fatal "Kafka:BootstrapServers populado mas
            # SchemaRegistry:Url vazio" (ADR-0051). Mesma receita documentada em
            # uniplus-api/docker/docker-compose.monolito.yml e já replicada em
            # apps/uniplus-api-portal/templates/deployment.yaml (issue #423).
            # Omitir a env var por completo (como ainda fazem os charts legados
            # uniplus-api-{selecao,ingresso}, mantidos só para standalone-compact)
            # NÃO é equivalente aqui: description completa no values.yaml.
            - name: Kafka__BootstrapServers
              value: {{ if .Values.uniplusApiHost.kafka.enabled }}{{ .Values.uniplusApiHost.kafka.bootstrapServers | quote }}{{ else }}" "{{ end }}
            {{- if .Values.uniplusApiHost.kafka.enabled }}
            - name: Kafka__SecurityProtocol
              value: {{ .Values.uniplusApiHost.kafka.securityProtocol | quote }}
            - name: Kafka__SaslMechanism
              value: {{ .Values.uniplusApiHost.kafka.saslMechanism | quote }}
            - name: Kafka__SaslUsername
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.kafkaSecretName" . }}
                  key: KAFKA_USERNAME
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.kafkaSecretName" . }}
                  key: KAFKA_PASSWORD
            - name: Kafka__SslCaLocation
              value: {{ .Values.uniplusApiHost.kafka.caCertPath | quote }}
            {{- end }}
            # === MinIO (Storage:* binding) ===
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.minioSecretName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.minioSecretName" . }}
                  key: MINIO_SECRET_KEY
            - name: Storage__Endpoint
              value: {{ .Values.uniplusApiHost.storage.endpoint | quote }}
            - name: Storage__AccessKey
              value: "$(MINIO_ACCESS_KEY)"
            - name: Storage__SecretKey
              value: "$(MINIO_SECRET_KEY)"
            - name: Storage__BucketName
              value: {{ .Values.uniplusApiHost.storage.bucketName | quote }}
            {{- if .Values.uniplusApiHost.oidc.enabled }}
            # === OIDC (Auth:* binding — bearer validation apenas; o host não
            # se autentica como client M2M contra nada — Schema Registry/Kafka
            # ficam desligados nesta leva, então não há client_secret a injetar). ===
            - name: Auth__Authority
              value: {{ .Values.uniplusApiHost.oidc.issuerUri | quote }}
            - name: Auth__Audience
              value: {{ .Values.uniplusApiHost.oidc.audience | quote }}
            {{- end }}
            # === Cifragem (UniPlus:Encryption) ===
            # Provider=local exige LocalKey via env/Secret; Provider=vault exige
            # VaultAddress + KubernetesRole bound à ServiceAccount deste Deployment.
            - name: UniPlus__Encryption__Provider
              value: {{ .Values.uniplusApiHost.encryption.provider | quote }}
            {{- if eq .Values.uniplusApiHost.encryption.provider "vault" }}
            - name: UniPlus__Encryption__VaultAddress
              value: {{ .Values.uniplusApiHost.encryption.vaultAddress | quote }}
            - name: UniPlus__Encryption__KubernetesRole
              value: {{ .Values.uniplusApiHost.encryption.kubernetesRole | quote }}
            {{- end }}
            # === Schema Registry (ADR-0051) — Apicurio Confluent-compat ===
            # url vazio = feature off (default no lab — issue #423). AuthType
            # OAuthBearer exige tokenEndpoint+clientId; client_secret vem do
            # ESO 5 (oidcSecretName).
            {{- if .Values.uniplusApiHost.schemaRegistry.url }}
            - name: SchemaRegistry__Url
              value: {{ .Values.uniplusApiHost.schemaRegistry.url | quote }}
            - name: SchemaRegistry__AuthType
              value: {{ .Values.uniplusApiHost.schemaRegistry.authType | quote }}
            {{- if eq .Values.uniplusApiHost.schemaRegistry.authType "OAuthBearer" }}
            - name: SchemaRegistry__OAuth__TokenEndpoint
              value: {{ .Values.uniplusApiHost.schemaRegistry.oauth.tokenEndpoint | quote }}
            - name: SchemaRegistry__OAuth__ClientId
              value: {{ .Values.uniplusApiHost.schemaRegistry.oauth.clientId | quote }}
            - name: SchemaRegistry__OAuth__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "uniplusApiHost.oidcSecretName" . }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}
            {{- end }}
            {{- if .Values.uniplusApiHost.otel.enabled }}
            # === OpenTelemetry (ADR-0018) ===
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.uniplusApiHost.otel.exporter.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.uniplusApiHost.otel.exporter.protocol | quote }}
            {{- if .Values.uniplusApiHost.otel.resource.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.uniplusApiHost.otel.resource.serviceName | quote }}
            {{- end }}
            {{- else }}
            - name: Observability__Enabled
              value: "false"
            {{- end }}
            {{- range $i, $origin := .Values.uniplusApiHost.cors.allowedOrigins }}
            - name: Cors__AllowedOrigins__{{ $i }}
              value: {{ $origin | quote }}
            {{- end }}
            {{- with .Values.uniplusApiHost.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.uniplusApiHost.kafka.enabled .Values.uniplusApiHost.customCA.enabled }}
          volumeMounts:
            {{- if .Values.uniplusApiHost.kafka.enabled }}
            # CA cert PEM do broker Kafka self-signed.
            - name: kafka-ca
              mountPath: /etc/uniplus-kafka/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
            {{- if .Values.uniplusApiHost.customCA.enabled }}
            # Bundle de CAs já mesclado pelo initContainer install-custom-ca
            # (sistema + certificado extra) — sobrepõe o bundle default da
            # imagem, que o container principal (non-root) não pode
            # atualizar sozinho.
            - name: merged-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: {{ .Values.uniplusApiHost.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.uniplusApiHost.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.uniplusApiHost.livenessProbe.periodSeconds }}
          # Readiness usa /health (agregado — os 4 módulos compartilham o banco
          # `uniplus`, então um único check de banco+infra cobre o processo).
          # Pod sai de Ready quando dependência está down.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.uniplusApiHost.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.uniplusApiHost.resources | nindent 12 }}
      {{- if or .Values.uniplusApiHost.kafka.enabled .Values.uniplusApiHost.customCA.enabled }}
      volumes:
        {{- if .Values.uniplusApiHost.kafka.enabled }}
        - name: kafka-ca
          secret:
            secretName: {{ include "uniplusApiHost.kafkaSecretName" . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.uniplusApiHost.customCA.enabled }}
        - name: custom-ca-source
          configMap:
            name: {{ include "uniplusApiHost.fullname" . }}-custom-ca
        - name: merged-ca-certs
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}
