{{- $e := .Values.uniplusApiHost.externalSecrets.encryptionLocal }}
{{- if and .Values.uniplusApiHost.enabled .Values.uniplusApiHost.externalSecrets.enabled $e.enabled }}
# Chave local de cifragem (provider local): lida do Vault e entregue como Secret
# que o Deployment e o Job de migration consomem em UniPlus__Encryption__LocalKey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.secretName }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.uniplusApiHost.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.uniplusApiHost.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.uniplusApiHost.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $e.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: LOCAL_KEY
      remoteRef:
        key: {{ $e.vaultPath }}
        property: {{ $e.property }}
{{- end }}
