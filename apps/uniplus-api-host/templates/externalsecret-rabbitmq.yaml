{{- $v := .Values.uniplusApiHost.verificacao }}
{{- if and .Values.uniplusApiHost.enabled $v.enabled $v.rabbitMqExterno.enabled }}
{{- $r := $v.rabbitMqExterno }}
{{- $es := .Values.uniplusApiHost.externalSecrets }}
{{- if not $r.host }}
{{- fail "uniplusApiHost.verificacao.rabbitMqExterno.host é obrigatório quando rabbitMqExterno.enabled=true (nome do broker no certificado, para a validação do AMQPS)." }}
{{- end }}
{{- range $papel, $secretName := dict "api" $v.rabbitMqSecretName "verificador" $r.verificadorSecretName }}
{{- $c := index $r $papel }}
---
# Credencial AMQPS do RabbitMQ externo ({{ $papel }}): URI completa e as partes
# avulsas, com a senha lida do Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "uniplusApiHost.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_USERNAME: {{ $c.usuario | quote }}
        RABBITMQ_PASSWORD: "{{ "{{ .password }}" }}"
        {{ $v.rabbitMqUriKey }}: "amqps://{{ $c.usuario }}:{{ "{{ .password }}" }}@{{ $r.host }}:{{ $r.port }}/{{ $r.vhost }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $c.vaultPath }}
        property: password
{{- end }}
{{- end }}
