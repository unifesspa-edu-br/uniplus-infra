{{- if and .Values.uniplusApiHost.enabled .Values.uniplusApiHost.externalSecrets.enabled -}}
{{- $es := .Values.uniplusApiHost.externalSecrets -}}
# ESO 1: Postgres app password (banco único `uniplus`, schema-por-módulo — ADR-0097).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplusApiHost.postgresSecretName" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "uniplusApiHost.postgresSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ $es.postgresApp.vaultPath }}
        property: {{ $es.postgresApp.passwordKey }}
---
# ESO 2: Redis default user password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplusApiHost.redisSecretName" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "uniplusApiHost.redisSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ $es.redisDefault.vaultPath }}
        property: {{ $es.redisDefault.passwordKey }}
---
# ESO 3: MinIO root credentials (compartilhado em standalone).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplusApiHost.minioSecretName" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "uniplusApiHost.minioSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: {{ $es.minioRoot.vaultPath }}
        property: {{ $es.minioRoot.usernameKey }}
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: {{ $es.minioRoot.vaultPath }}
        property: {{ $es.minioRoot.passwordKey }}
{{- if .Values.uniplusApiHost.kafka.enabled }}
---
# ESO 4: Kafka SCRAM admin credentials + CA cert.
# Em standalone usa SCRAM admin compartilhado (ADR-009 — em hml/prod migrar
# para SCRAM users dedicados por app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplusApiHost.kafkaSecretName" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "uniplusApiHost.kafkaSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_USERNAME
      remoteRef:
        key: {{ $es.kafkaAdmin.vaultPath }}
        property: {{ $es.kafkaAdmin.usernameKey }}
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: {{ $es.kafkaAdmin.vaultPath }}
        property: {{ $es.kafkaAdmin.passwordKey }}
    - secretKey: ca.crt
      remoteRef:
        key: {{ $es.kafkaAdmin.vaultPath }}
        property: {{ $es.kafkaAdmin.caCertKey }}
{{- end }}
{{/* ESO 5 só é necessário quando Schema Registry com OAuthBearer está ativo
     (basic/none não consumem este Secret). O Host não tem client OIDC M2M
     próprio no realm — só o cenário Schema Registry OAuth usaria este
     Secret, e fica desligado enquanto o Kafka do Host estiver desligado
     (issue #423). url vazio = feature off, mesma guarda do Deployment para
     evitar criar Secret órfão. */}}
{{- $srOAuthActive := and (ne .Values.uniplusApiHost.schemaRegistry.url "") (eq .Values.uniplusApiHost.schemaRegistry.authType "OAuthBearer") -}}
{{- if $srOAuthActive }}
---
# ESO 5: client_secret OIDC do realm uniplus, consumido pelo Deployment
# quando schemaRegistry.authType=OAuthBearer (env
# SchemaRegistry__OAuth__ClientSecret via secretKeyRef — ADR-0051).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplusApiHost.oidcSecretName" . }}
  labels:
    {{- include "uniplusApiHost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "uniplusApiHost.oidcSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ $es.oidcClient.vaultPath }}
        property: {{ $es.oidcClient.clientSecretKey }}
{{- end }}
{{- end }}
