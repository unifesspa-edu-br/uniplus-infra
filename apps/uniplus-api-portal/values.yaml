# Defaults do chart apps/uniplus-api-portal/.
# Cada environment (environments/<env>/values.yaml) sobrescreve apenas o
# necessário. Por padrão DESABILITADO — só ambientes onde a imagem GHCR
# estiver publicada e os pré-requisitos atendidos (DB, Vault paths, OIDC
# client) ligam via `uniplusApiPortal.enabled: true`.

commonLabels:
  app.kubernetes.io/part-of: uniplus
  app.kubernetes.io/component: api

uniplusApiPortal:
  enabled: false

  image:
    registry: ghcr.io
    repository: unifesspa-edu-br/uniplus-api-portal
    # Sincronizar com tag publicada em GHCR.
    tag: "v0.3.2"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # API stateless. Em standalone 1 réplica para reduzir uso de recursos.
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  serviceAccount:
    # Nome FIXO para que a role Vault Kubernetes auth (uniplus-api) — que
    # vincula bound_service_account_names — encontre esta SA independente
    # do release name gerado pelo ApplicationSet (`uniplus-api-portal-<env>`).
    # Mesmo pattern usado em platform/external-secrets/values.yaml linha 31.
    create: true
    name: uniplus-api-portal

  # Cifragem (UniPlus:Encryption). Default Provider=local exige LocalKey via
  # appsettings/Vault — environment override pode trocar para vault em cluster
  # onde platform/vault-transit-bootstrap está aplicado (uniplus-infra#219).
  # Pré-requisito quando Provider=vault: kubernetesRole deve existir no Vault
  # com bound_service_account_names incluindo serviceAccount.name acima.
  encryption:
    provider: local
    vaultAddress: ""
    kubernetesRole: ""

  # Schema Registry (ADR-0051) — feature off quando url está vazio. Em
  # ambientes de produção com Kafka habilitado, Program.cs aborta o boot
  # se url estiver vazio (publishing cross-módulo exige schema validation).
  # Auth OAuthBearer: client_secret vem do Secret K8s sintetizado pelo
  # ESO 5 (oidcSecretName) — mesmo Vault path do OIDC client da API.
  schemaRegistry:
    url: ""
    authType: None
    oauth:
      tokenEndpoint: ""
      clientId: ""

  aspnet:
    environment: Production
    urls: "http://+:8080"

  # === Backend Postgres (DB dedicada por app) ===
  database:
    host: ""                    # ex.: 10.0.2.87
    port: 5432
    name: uniplus_portal
    username: portal
    # Nome em ConnectionStrings__<Name>Db (.NET config binding).
    connectionStringName: PortalDb

  # === Backend Redis (default user) ===
  redis:
    host: ""                    # ex.: 10.0.2.87
    port: 6379
    username: default

  # === Backend Kafka (SASL_SSL + SCRAM-SHA-512, ADR-009) ===
  # Pode ser desligado em primeiro deploy se SCRAM users per-app ainda não
  # foram provisionados. Em standalone usa SCRAM admin compartilhado.
  kafka:
    enabled: true
    bootstrapServers: ""        # ex.: 10.0.2.87:9092
    securityProtocol: SASL_SSL
    saslMechanism: SCRAM-SHA-512
    # CA cert PEM mountado de Secret kafka-admin (key ca_cert).
    caCertPath: /etc/uniplus-kafka/ca.crt

  # === Backend MinIO S3 ===
  storage:
    endpoint: ""                # ex.: 10.0.2.87:9000
    bucketName: uniplus-storage

  # === OIDC (Auth bearer) ===
  oidc:
    enabled: true
    issuerUri: ""               # ex.: https://standalone.portaluni.com.br/auth/realms/uniplus
    audience: uniplus

  # === CORS (obrigatório fora de Development) ===
  # APIs validam no startup que Cors:AllowedOrigins esteja preenchido em
  # ASPNETCORE_ENVIRONMENT=Production. Lista de origins (frontend SPA, ex.:
  # https://portal.standalone.portaluni.com.br). Renderiza como env vars
  # Cors__AllowedOrigins__0=..., __1=..., etc (.NET nested config binding).
  cors:
    allowedOrigins: []          # ex.: ["https://portal.standalone.portaluni.com.br"]

  # === ExternalSecrets (Vault → K8s Secret) ===
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default

    postgresApp:
      vaultPath: secret/standalone/postgres/portal
      passwordKey: password

    redisDefault:
      vaultPath: secret/standalone/redis/default
      passwordKey: password

    kafkaAdmin:
      vaultPath: secret/standalone/kafka/admin
      usernameKey: username
      passwordKey: password
      caCertKey: ca_cert

    minioRoot:
      vaultPath: secret/standalone/minio/root
      usernameKey: username
      passwordKey: password

    oidcClient:
      vaultPath: secret/standalone/keycloak/clients/uniplus-api-portal
      clientSecretKey: client_secret

  # === Exposição externa via Traefik IngressRoute ===
  ingress:
    enabled: false
    entryPoint: websecure
    host: ""                    # ex.: api-portal.standalone.portaluni.com.br
    tls:
      enabled: true
      secretName: ""
      certManager:
        enabled: false
        clusterIssuer: ""       # ex.: letsencrypt-prod

  # === OpenTelemetry (ADR-0018 uniplus-api + ADR-013 uniplus-infra) ===
  # Exporta traces + metrics + logs via OTLP para o OTel Collector DaemonSet
  # do cluster (namespace observability-otelcol). Endpoint vazio + enabled=true
  # é rejeitado pelo guard do template — pod só sobe quando o environment
  # popular o endpoint real (release name do collector varia entre standalone
  # e demais ambientes). Sem este wiring, o SDK .NET cai no default
  # http://localhost:4317 e drops silenciosos para um sink inexistente.
  otel:
    enabled: true
    exporter:
      endpoint: ""              # ex.: http://otelcol.observability-otelcol.svc.cluster.local:4317
      protocol: grpc            # "grpc" (porta 4317) ou "http/protobuf" (porta 4318)
    resource:
      # Vazio por default — Program.cs do uniplus-api passa o nome canônico
      # de UniPlusServiceNames diretamente para AdicionarObservabilidade (ADR-0052).
      # Setar aqui só quando integração externa exigir override via env (raro).
      serviceName: ""

  # === NetworkPolicy ===
  networkPolicy:
    enabled: true
    traefikNamespace: traefik
    monitoringNamespace: observability-prometheus
    dataHostCIDR: ""            # ex.: 10.0.2.0/24
    keycloakService: keycloak-replica-uniplus-standalone
    keycloakNamespace: uniplus
    keycloakPort: 8080
    oidcIssuerCIDR: ""          # ex.: 164.152.53.29/32
    oidcIssuerPort: 443
    # CIDR adicional para Schema Registry (ADR-0051) quando o Apicurio
    # estiver em IP público distinto do OIDC issuer. Vazio = assume
    # co-locação com oidcIssuerCIDR (default standalone — ambos subdomínios
    # resolvem via Traefik no mesmo k8s-host). Em environments com IPs
    # distintos, definir aqui para liberar egress HTTPS separado.
    schemaRegistryCIDR: ""
    schemaRegistryPort: 443
    # OTel Collector DaemonSet (ADR-013) — namespace whitelist no
    # collector já inclui `uniplus` por default (ver
    # platform/observability/otelcol/values.yaml ingressNamespaces).
    # Esta config libera o egress correspondente do lado da API.
    otelCollectorNamespace: observability-otelcol
    # Vault Transit (ADR-0027) — namespace + port do servidor Vault.
    # Regra de egress é renderizada apenas quando encryption.provider=vault.
    # Em environments com Vault em outro cluster, manter encryption.provider=local
    # ou expor o Vault via Service/Ingress in-cluster proxy.
    vaultNamespace: vault
    vaultPort: 8200

  metrics:
    enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s

  # /health/live: dependency-free (sempre 200 enquanto processo respira).
  # /health: agregado readiness — falha sob transient outage de deps.
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5

  # Container roda como `appuser` (UID 999, Debian useradd default).
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  extraEnv: []
