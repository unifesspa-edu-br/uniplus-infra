# Defaults para uniplus-web.
#
# 1 chart, 3 deployments — portal/seleção/ingresso, cada um com seu
# subdomain dedicado, ConfigMap de runtime-config.json (ADR-0021 web)
# e Certificate cert-manager. Pattern simétrico aos charts api-* mas
# iterando sobre `apps.{portal,selecao,ingresso}`.
#
# Cada ambiente sobrescreve em `environments/<env>/values.yaml` o bloco
# `uniplusWeb` com `host` + `runtimeConfig` por app.

uniplusWeb:
  enabled: true

  nameOverride: ""
  fullnameOverride: ""

  # Imagem default (apps.<name>.image override por app).
  image:
    registry: ghcr.io
    repository: unifesspa-edu-br
    pullPolicy: IfNotPresent
    # tag default puxa da Chart.AppVersion. Override per-app possível em
    # apps.<name>.tag.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    create: true
    name: ""

  # Pod-level securityContext alinhado ao nginxinc/nginx-unprivileged
  # (UID 101, fsGroup 101). nginx-unprivileged escuta :8080 sem
  # CAP_NET_BIND_SERVICE.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101

  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    readOnlyRootFilesystem: false  # nginx grava em /var/cache/nginx + tmp
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  startupProbe:
    failureThreshold: 30
    periodSeconds: 2
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5

  # 3 frontends Angular como deployments separados, cada um servindo no
  # próprio subdomain. Defaults são placeholders — environments/<env>/
  # values.yaml preenche `host` + `runtimeConfig` reais.
  apps:
    portal:
      enabled: false  # ativar em environments/<env>/values.yaml
      replicas: 2
      # Imagem GHCR — atenção ao naming inconsistente entre portal (sem
      # prefixo `web-`) e os demais (com `web-`). Verificar tags em
      # https://github.com/unifesspa-edu-br/packages.
      image: uniplus-portal
      tag: v0.2.1  # tag publicada em GHCR (override per-app possível)
      host: ""  # ex.: portal.standalone.portaluni.com.br
      # Subpath opcional (Host + PathPrefix, sem StripPrefix) — RUNBOOKS §21.3.
      # Vazio/ausente → rota `Host()` pura (preserva standalone-compact/lab).
      # O chart propaga o valor normalizado como APP_BASE_HREF (<prefixo>/)
      # para a imagem uniplus-web. Ex. HML: /portal
      pathPrefix: ""
      # Conteúdo escrito em /assets/runtime-config.json via ConfigMap.
      # Schema é a interface AppConfig em libs/shared-data/lib/config/
      # app-config.model.ts do uniplus-web (ADR-0021).
      runtimeConfig:
        apiUrl: ""  # ex.: https://api-portal.standalone.portaluni.com.br
        # Contrato neutro (uniplus-web commit 9884c64): oidc.issuerUrl já
        # inclui o path do realm. keycloak.{url,realm} mantido em paralelo
        # (template renderiza os dois) enquanto standalone-compact/lab
        # rodam v0.2.1, publicada antes da mudança de contrato — ver
        # comentário em templates/configmap-runtime.yaml.
        oidc:
          issuerUrl: ""  # ex.: https://standalone.portaluni.com.br/auth/realms/uniplus
          clientId: uniplus-portal
        keycloak:
          url: ""  # ex.: https://standalone.portaluni.com.br/auth
          realm: uniplus
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    selecao:
      enabled: false  # ativar em environments/<env>/values.yaml
      replicas: 2
      image: uniplus-web-selecao
      tag: v0.2.1
      host: ""
      pathPrefix: ""  # subpath opcional — ver nota em apps.portal.pathPrefix. Ex. HML: /selecao
      runtimeConfig:
        apiUrl: ""
        oidc:
          issuerUrl: ""
          clientId: uniplus-portal
        keycloak:
          url: ""
          realm: uniplus
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    ingresso:
      enabled: false  # ativar em environments/<env>/values.yaml
      replicas: 2
      image: uniplus-web-ingresso
      tag: v0.2.1
      host: ""
      pathPrefix: ""  # subpath opcional — ver nota em apps.portal.pathPrefix. Ex. HML: /ingresso
      runtimeConfig:
        apiUrl: ""
        oidc:
          issuerUrl: ""
          clientId: uniplus-portal
        keycloak:
          url: ""
          realm: uniplus
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    configuracao:
      enabled: false  # ativar em environments/<env>/values.yaml
      replicas: 2
      # v0.2.1/v0.2.2 não publicaram esta imagem (matrix de publish-images.yml
      # só ganhou o módulo configuracao na issue #558) — primeira tag
      # publicada com uniplus-web-configuracao é v0.2.3.
      image: uniplus-web-configuracao
      tag: v0.2.3
      host: ""
      pathPrefix: ""  # subpath opcional — ver nota em apps.portal.pathPrefix. Ex. HML: /configuracao
      runtimeConfig:
        apiUrl: ""
        oidc:
          issuerUrl: ""
          clientId: uniplus-portal
        keycloak:
          url: ""
          realm: uniplus
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  ingress:
    enabled: true
    entryPoint: websecure
    tls:
      enabled: true
      # Vazio (default): cada app usa seu próprio Secret "<appFullname>-tls"
      # (criado pelo cert-manager quando certManager.enabled=true — caso de
      # produção). Setar aqui só quando as 3 SPAs devem compartilhar um
      # único Secret pré-existente (ex.: certificado wildcard autoassinado
      # de lab, sem cert-manager).
      secretName: ""
      certManager:
        enabled: true
        clusterIssuer: letsencrypt-prod

  # NetworkPolicy: ingress só do namespace Traefik; egress só DNS (CoreDNS).
  # Nginx-unprivileged não chama upstream — todas as requests externas
  # (Keycloak, API) são feitas pelo browser do usuário, não pelo pod.
  # Por isso não há regra de egress para Keycloak/API.
  networkPolicy:
    enabled: true
    traefikNamespace: traefik
    monitoringNamespace: monitoring

  # ServiceMonitor opt-in (Prometheus auto-discovery). nginx-unprivileged
  # serve métricas em formato Prometheus se enabled — fora de escopo standalone.
  serviceMonitor:
    enabled: false
    interval: 30s

  podAntiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname

  commonLabels:
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: frontend
