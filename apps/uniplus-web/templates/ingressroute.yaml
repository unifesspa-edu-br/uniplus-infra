{{- if and .Values.uniplusWeb.enabled .Values.uniplusWeb.ingress.enabled -}}
{{- range $app, $cfg := .Values.uniplusWeb.apps -}}
{{- if $cfg.enabled -}}
{{- if not $cfg.host -}}
{{- fail (printf "uniplusWeb.apps.%s.host é obrigatório quando uniplusWeb.ingress.enabled=true (ex.: %s.standalone.portaluni.com.br). IngressRoute Traefik exige Host(...) válido." $app $app) -}}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "uniplusWeb.appFullname" (dict "ctx" $ "app" $app) }}
  labels:
    {{- include "uniplusWeb.labels" (dict "ctx" $ "app" $app) | nindent 4 }}
spec:
  entryPoints:
    - {{ $.Values.uniplusWeb.ingress.entryPoint }}
  routes:
    # PathPrefix opcional, sem StripPrefix — permite servir múltiplas SPAs sob o
    # mesmo FQDN por subpath (`/portal`, `/selecao`, `/ingresso`). Vazio → `Host()`
    # puro (comportamento atual). Ver docs/RUNBOOKS.md §21.3.
    - match: Host(`{{ $cfg.host }}`){{ if $cfg.pathPrefix }} && PathPrefix(`{{ $cfg.pathPrefix }}`){{ end }}
      kind: Rule
      services:
        - name: {{ include "uniplusWeb.appFullname" (dict "ctx" $ "app" $app) }}
          port: 8080
  {{- if $.Values.uniplusWeb.ingress.tls.enabled }}
  tls:
    secretName: {{ $.Values.uniplusWeb.ingress.tls.secretName | default (printf "%s-tls" (include "uniplusWeb.appFullname" (dict "ctx" $ "app" $app))) }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
