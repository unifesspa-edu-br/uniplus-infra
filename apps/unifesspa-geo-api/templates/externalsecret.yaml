{{- if and .Values.unifesspaGeoApi.enabled .Values.unifesspaGeoApi.externalSecrets.enabled -}}
{{- $es := .Values.unifesspaGeoApi.externalSecrets -}}
# ESO 1: Postgres app password (DB dedicada uniplus_geo / role uniplus_geo_app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "unifesspaGeoApi.postgresSecretName" . }}
  labels:
    {{- include "unifesspaGeoApi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "unifesspaGeoApi.postgresSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ $es.postgresApp.vaultPath }}
        property: {{ $es.postgresApp.passwordKey }}
---
# ESO 2: Redis default user password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "unifesspaGeoApi.redisSecretName" . }}
  labels:
    {{- include "unifesspaGeoApi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "unifesspaGeoApi.redisSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ $es.redisDefault.vaultPath }}
        property: {{ $es.redisDefault.passwordKey }}
{{- if eq .Values.unifesspaGeoApi.encryption.provider "local" }}
---
# ESO 3: chave AES-GCM local (Geo:Encryption:LocalKey). Só necessária quando
# encryption.provider=local — em Vault mode a cifragem usa Transit, sem chave
# local a custodiar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "unifesspaGeoApi.encryptionSecretName" . }}
  labels:
    {{- include "unifesspaGeoApi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "unifesspaGeoApi.encryptionSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: GEO_ENCRYPTION_LOCAL_KEY
      remoteRef:
        key: {{ $es.encryptionLocalKey.vaultPath }}
        property: {{ $es.encryptionLocalKey.localKeyKey }}
{{- end }}
{{- end }}
