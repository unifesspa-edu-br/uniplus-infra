{{- if .Values.unifesspaGeoApi.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifesspaGeoApi.fullname" . }}
  labels:
    {{- include "unifesspaGeoApi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "unifesspaGeoApi.selectorLabels" . | nindent 4 }}
{{- end }}
