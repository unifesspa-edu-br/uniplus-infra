# Defaults do chart apps/kafka-ui/.
# Cada environment (environments/<env>/values.yaml) sobrescreve apenas o
# necessário. Por padrão o chart fica DESABILITADO — só os ambientes que
# precisam de UI Kafka (ex.: produção) ligam via `kafkaUi.enabled: true`.

commonLabels:
  app.kubernetes.io/part-of: uniplus
  app.kubernetes.io/component: data-admin

kafkaUi:
  # Liga/desliga o chart inteiro. Default false.
  enabled: false

  image:
    registry: docker.io
    repository: tchiotludo/akhq
    # Versão estável validada (Mar/2026). Bumps de patch são seguros;
    # major requer revisão da application.yml schema.
    tag: "0.27.0"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # AKHQ é stateless (não persiste nada local); 1 réplica é suficiente.
  # Multi-réplica não dá ganho — todas leem do mesmo Kafka.
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  serviceAccount:
    create: true
    name: ""

  # === Conexão ao Kafka cluster ===
  # AKHQ pode gerenciar múltiplos clusters; no ambiente de nó único só temos 1.
  kafka:
    # Nome do cluster como aparecerá na UI.
    clusterName: uniplus
    bootstrapServers: ""  # ex.: 10.0.2.87:9092
    # SASL_SSL + SCRAM-SHA-512 via creds sintetizadas pelo ESO.
    # `ssl.endpoint.identification.algorithm=` vazio aceita SAN do
    # self-signed que cobre IP da subnet privada.
    securityProtocol: SASL_SSL
    saslMechanism: SCRAM-SHA-512
    # ssl.endpoint.identification.algorithm do cliente: vazio não verifica o nome
    # do broker; `https` verifica.
    sslEndpointIdentification: ""

  # === OIDC (Keycloak realm uniplus) ===
  # AKHQ usa Micronaut OIDC. Confidential client `kafka-ui` no realm —
  # client_secret custodiado em Vault e injetado via ExternalSecret.
  oidc:
    enabled: true
    providerName: keycloak
    issuerUri: ""                  # ex.: https://uniplus.unifesspa.edu.br/auth/realms/uniplus
    clientId: kafka-ui
    # Mapping de claim `groups` → grupos do AKHQ. Requer mapper
    # `groups` (caminho completo) no client `kafka-ui` do realm.
    # Quem não está em nenhum dos dois grupos cai no `no-roles` e não vê nada.
    # `/users/uniplus` NÃO entra aqui: é grupo amplo e não tem motivo para
    # ler mensagens do Kafka (uniplus-infra#805).
    groupsClaim: groups
    groups:
      # Papel `admin` do AKHQ. No broker, a credencial do AKHQ não tem
      # Write, Create, Delete nem Alter, então as ações de escrita da
      # interface são recusadas pelo Kafka.
      kafkaAdminsClaim: "/admins/kafka"
      # Leitura de mensagens, menos os tópicos de `topicosSemLeituraNaInterface`.
      # Concessão individual e justificada (docs/RUNBOOKS.md, seção 9).
      leitoresDeConteudoClaim: "/users/kafka-ui-leitores"

  # Tópicos cujo conteúdo o papel de leitura do AKHQ não alcança. Defesa em
  # profundidade: o broker já nega `Read` nesses tópicos à credencial do AKHQ
  # (scripts/servicos-no-host/provisionar-kafka-ui.sh). Listar e ver offsets
  # continua permitido.
  topicosSemLeituraNaInterface:
    - autorizacao_registros_de_acesso

  # === ExternalSecrets (Vault → K8s Secret) ===
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: plataforma

    # Usuário SCRAM próprio do AKHQ (`uniplus-kafka-ui-svc`) + CA do broker.
    # Gravados em `kafka/kafka-ui` por
    # scripts/servicos-no-host/provisionar-kafka-ui.sh, que também aplica as
    # ACLs: só leitura de metadados e de mensagens, com `Read` negado em
    # `autorizacao_registros_de_acesso`. Nunca `kafka/admin`: o `admin` é
    # superusuário do broker e passa por cima das ACLs (o schema recusa).
    # ca_cert é o PEM do CA do broker, para o AKHQ validar o TLS.
    kafkaCredencial:
      vaultPath: kafka/kafka-ui
      usernameKey: username
      passwordKey: password
      caCertKey: ca_cert

    # client_secret OIDC do confidential client `kafka-ui` no realm
    # uniplus. Gerado pelo operador (one-shot ou via Keycloak Admin API)
    # e custodiado no Vault. AKHQ NÃO suporta public client/PKCE para
    # provider customizado em 0.27.x.
    oidcClient:
      vaultPath: keycloak/kafka-ui
      clientSecretKey: client_secret

    # JWT signing secret — assina o cookie de sessão do Micronaut no AKHQ.
    # Sem ele, o AKHQ 0.25+ aplica os grupos só na interface, e uma
    # requisição direta à API do AKHQ passa por cima deles. Gerado por
    # scripts/servicos-no-host/semear-vault.sh (32 bytes hex).
    jwt:
      vaultPath: kafka-ui/jwt
      signingSecretKey: signing_secret

  # === Exposição externa via Traefik IngressRoute ===
  ingress:
    enabled: false
    entryPoint: websecure
    # Middlewares Traefik aplicados à rota (ex.: restrição por rede).
    middlewares: []
    host: ""                     # ex.: uniplus.unifesspa.edu.br
    tls:
      enabled: true
      secretName: ""             # criado pelo cert-manager se certManager.enabled

  # === NetworkPolicy ===
  # Egress: Kafka data-host (10.0.2.87:9092) + DNS + Keycloak
  # (cluster-internal) + OIDC issuer endpoint externo (HTTPS port 443).
  # Ingress: somente Traefik.
  networkPolicy:
    enabled: true
    traefikNamespace: traefik
    monitoringNamespace: observability-prometheus
    # CIDR da subnet privada VCN onde o Kafka data-host vive. Deve casar
    # com `dataHostCIDR` do keycloak-replica para reuso de pattern.
    dataHostCIDR: ""
    dataHostPort: 9092
    # Service do Keycloak local (do cluster). Default casa com release name
    # padrão do chart keycloak-replica no ambiente de nó único.
    keycloakService: keycloak-replica
    keycloakNamespace: keycloak-replica
    keycloakPort: 8080
    # CIDR do endpoint público do OIDC issuer. AKHQ chama `.well-known/
    # openid-configuration`, `/token`, `/userinfo` em HTTPS port 443 contra
    # o issuer URL (ex.: uniplus.unifesspa.edu.br resolve pra k8s-host
    # public IP que entra via Traefik IngressRoute do Keycloak). Sem essa
    # entrada, o pod resolve o DNS mas o handshake TLS é bloqueado pelo
    # default-deny do egress.
    #
    # Usar o /32 do issuer; NUNCA 0.0.0.0/0 (defesa em profundidade).
    oidcIssuerCIDR: ""
    oidcIssuerPort: 443

  # === ServiceMonitor (Prometheus) ===
  # AKHQ expõe /metrics em /prometheus (Micronaut). Gateado em
  # `serviceMonitor.enabled AND metrics.enabled` (mesma estratégia
  # do keycloak-replica para evitar scrape de endpoint inexistente).
  metrics:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s

  # === Probes ===
  # AKHQ tem startup ~10-30s; failureThreshold absorve cold start.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 5
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5

  # === SecurityContext ===
  # tchiotludo/akhq:0.27.0 roda como uid 1001 (akhq).
  podSecurityContext:
    fsGroup: 1001
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # AKHQ escreve em /tmp; rootfs pode ser readOnly se montar /tmp
    # como emptyDir. Out of scope deste PR (deploy em prod hardening).
    readOnlyRootFilesystem: false

  # Env vars adicionais (lista de `{name, value}` ou `{name, valueFrom}`).
  extraEnv: []
