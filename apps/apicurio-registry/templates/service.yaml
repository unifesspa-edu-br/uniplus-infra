{{- if .Values.apicurioRegistry.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apicurioRegistry.fullname" . }}
  labels:
    {{- include "apicurioRegistry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "apicurioRegistry.selectorLabels" . | nindent 4 }}
{{- end }}
