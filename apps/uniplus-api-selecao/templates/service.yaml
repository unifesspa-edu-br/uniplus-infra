{{- if .Values.uniplusApiSelecao.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uniplusApiSelecao.fullname" . }}
  labels:
    {{- include "uniplusApiSelecao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "uniplusApiSelecao.selectorLabels" . | nindent 4 }}
{{- end }}
