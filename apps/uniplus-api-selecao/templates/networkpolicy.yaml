{{- if and .Values.uniplusApiSelecao.enabled .Values.uniplusApiSelecao.networkPolicy.enabled -}}
{{- if not .Values.uniplusApiSelecao.networkPolicy.dataHostCIDR -}}
{{- fail "uniplusApiSelecao.networkPolicy.dataHostCIDR é obrigatório (egress para Postgres + Redis + Kafka + MinIO no data-host)." -}}
{{- end -}}
{{- $srOAuth := eq .Values.uniplusApiSelecao.schemaRegistry.authType "OAuthBearer" -}}
{{- if and (or .Values.uniplusApiSelecao.oidc.enabled $srOAuth) (not .Values.uniplusApiSelecao.networkPolicy.oidcIssuerCIDR) -}}
{{- fail "uniplusApiSelecao.networkPolicy.oidcIssuerCIDR é obrigatório quando oidc.enabled=true OU schemaRegistry.authType=OAuthBearer (egress HTTPS via Traefik para Keycloak/Apicurio no IP do k8s-host)." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uniplusApiSelecao.fullname" . }}
  labels:
    {{- include "uniplusApiSelecao.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uniplusApiSelecao.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.uniplusApiSelecao.networkPolicy.traefikNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if and .Values.uniplusApiSelecao.metrics.enabled .Values.uniplusApiSelecao.serviceMonitor.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.uniplusApiSelecao.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    # DNS (CoreDNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Data-host (Postgres 5432 + Redis 6379 + Kafka 9092 + MinIO 9000).
    # Single rule by CIDR + multi-port (todos compartilham mesmo /24 em standalone).
    - to:
        - ipBlock:
            cidr: {{ .Values.uniplusApiSelecao.networkPolicy.dataHostCIDR }}
      ports:
        - protocol: TCP
          port: 5432  # Postgres
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 9000  # MinIO API S3
        {{- if .Values.uniplusApiSelecao.kafka.enabled }}
        - protocol: TCP
          port: 9092  # Kafka SASL_SSL
        {{- end }}
    # Keycloak in-cluster (fallback se issuerUri usar Service DNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.uniplusApiSelecao.networkPolicy.keycloakNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-replica
      ports:
        - protocol: TCP
          port: {{ .Values.uniplusApiSelecao.networkPolicy.keycloakPort }}
    {{- if or .Values.uniplusApiSelecao.oidc.enabled (eq .Values.uniplusApiSelecao.schemaRegistry.authType "OAuthBearer") }}
    # Egress HTTPS para o IP público do k8s-host (Traefik), necessário para:
    #   - JWT validation chama jwks endpoint do Keycloak quando oidc.enabled
    #     (resource server bearer validation).
    #   - Token endpoint OAuth + Apicurio Registry (Confluent-compat) quando
    #     schemaRegistry.authType=OAuthBearer (publishing de schemas, ADR-0051).
    # Em standalone os dois subdomínios (auth + schema-registry) resolvem para
    # o mesmo IP público do k8s-host (Traefik termina TLS), então uma regra
    # única cobre ambos consumidores.
    - to:
        - ipBlock:
            cidr: {{ .Values.uniplusApiSelecao.networkPolicy.oidcIssuerCIDR }}
      ports:
        - protocol: TCP
          port: {{ .Values.uniplusApiSelecao.networkPolicy.oidcIssuerPort }}
    {{- end }}
{{- end }}
