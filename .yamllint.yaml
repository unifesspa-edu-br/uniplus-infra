extends: default

rules:
  line-length:
    max: 200
    level: warning

  indentation:
    spaces: 2
    indent-sequences: consistent

  comments:
    require-starting-space: false
    min-spaces-from-content: 1

  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']

  document-start: disable

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

ignore: |
  /charts/
  /node_modules/
  *.tgz
  # Helm chart templates contêm Go templates ({{- ... -}}) que não são
  # YAML válido — `helm lint` é o linter correto para esses arquivos.
  **/templates/
