# ApplicationSet ArgoCD para o Uni+
#
# Gera Applications automaticamente combinando:
# - Cada cluster registrado no ArgoCD
# - Cada chart em apps/ e platform/
#
# Pré-requisito: clusters lab-sp1, lab-sp2, prod-sp1, prod-sp2 registrados no ArgoCD
# (via `argocd cluster add`)

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: uniplus-apps
  namespace: argocd
spec:
  # Templates usam Go text/template + Sprig (acesso a nested maps como
  # {{.metadata.labels.environment}}). Sem goTemplate=true o controller
  # cai no modo fasttemplate e renderiza tudo literal — todos os Applications
  # colidem no mesmo nome e o AppSet entra em ApplicationValidationError.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # Apps habilitados em todos os ambientes — combina cada cluster
    # registrado com cada app desta lista, sem distinção por ambiente.
    - matrix:
        generators:
          # Cada cluster registrado
          - clusters:
              selector:
                matchLabels:
                  uniplus.io/managed: "true"
          # Cada app em apps/. `namespace` é explícito por elemento (não um
          # literal fixo no template) porque nem todo app deste ApplicationSet
          # compartilha o mesmo namespace — ver bloco seletivo abaixo
          # (unifesspa-geo-api usa `geo`, não `uniplus`).
          - list:
              elements:
                - app: uniplus-web
                  namespace: uniplus
                  aplicaMigration: false
                - app: uniplus-api-portal
                  namespace: uniplus
                  aplicaMigration: false
                - app: uniplus-api-selecao
                  namespace: uniplus
                  aplicaMigration: false
                - app: uniplus-api-ingresso
                  namespace: uniplus
                  aplicaMigration: false
                - app: clamav-scanner
                  namespace: uniplus
                  aplicaMigration: false
                - app: keycloak-replica
                  namespace: uniplus
                  aplicaMigration: false
                - app: kafka-ui
                  namespace: uniplus
                  aplicaMigration: false
                - app: apicurio-registry
                  namespace: uniplus
                  aplicaMigration: false
                - app: redis-ui
                  namespace: uniplus
                  aplicaMigration: false
    # Apps habilitados só em ambientes específicos — mecanismo genérico de
    # habilitação por-ambiente (ver argocd/README.md § Habilitação por-ambiente).
    # Cada elemento declara o chart + o(s) ambiente(s) (label `environment`
    # do cluster) onde a Application deve ser gerada; o `list` generator
    # produz `targetEnvironment`, consumido pelo `clusters` generator
    # seguinte via `selector.matchLabels.environment` (matrix passa
    # parâmetros de um generator filho para o próximo — o produtor precisa
    # vir antes do consumidor). Para habilitar um chart em mais de um
    # ambiente, repetir o elemento com `targetEnvironment` diferente; para
    # habilitar um novo chart, adicionar um elemento novo — nenhum nome de
    # chart é hardcoded na lógica de filtragem.
    - matrix:
        generators:
          - list:
              elements:
                # uniplus-api-host é composition root do mesmo bounded
                # context de portal/selecao/ingresso — namespace `uniplus`.
                - app: uniplus-api-host
                  namespace: uniplus
                  targetEnvironment: hml-standalone-single
                  # O único com hook `PreSync` que aplica migrations. Isso muda o
                  # significado de "sincronizar de novo": todo sync automático
                  # reexecuta o hook, e o `before-hook-creation` descarta o Job
                  # anterior — inclusive o que falhou e foi preservado para
                  # inspeção. Repetir migration cegamente é justamente o que o
                  # `backoffLimit: 0` do Job recusa, e o que uma migration que
                  # falhou por schema ou dado não resolve.
                  #
                  # Ver o patch no fim deste AppSet para o que a marca desliga.
                  aplicaMigration: true
                # unifesspa-geo-api é aplicação independente (bounded
                # context próprio — só compartilha o emissor OIDC com as
                # demais APIs) — namespace `geo`, não `uniplus`.
                - app: unifesspa-geo-api
                  namespace: geo
                  aplicaMigration: false
                  targetEnvironment: hml-standalone-single
          - clusters:
              selector:
                matchLabels:
                  uniplus.io/managed: "true"
                  environment: '{{.targetEnvironment}}'

  template:
    metadata:
      name: '{{.app}}-{{.name}}'
      labels:
        app.kubernetes.io/part-of: uniplus
        environment: '{{.metadata.labels.environment}}'
    spec:
      project: uniplus
      # Multi-source apps (ArgoCD ≥ 2.6) — usar `$values` para referenciar
      # arquivos de valores via path absoluto a partir do repo root,
      # eliminando a fragilidade de `../../` relativo (que quebra para
      # paths de profundidade variável). Todos os apps usam apps/<app>
      # (2 segmentos), mas mantemos o pattern consistente com o
      # uniplus-platform AppSet para evitar drift.
      sources:
        - repoURL: https://github.com/unifesspa-edu-br/uniplus-infra
          targetRevision: main
          path: 'apps/{{.app}}'
          helm:
            valueFiles:
              - values.yaml
              - '$values/environments/{{.metadata.labels.environment}}/values.yaml'
        - repoURL: https://github.com/unifesspa-edu-br/uniplus-infra
          targetRevision: main
          ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true

      # `retry` e `selfHeal` não ficam aqui: dependem de `aplicaMigration`, e o
      # template é objeto tipado — um `{{...}}` ali viraria string onde o apiserver
      # espera inteiro ou booleano. Vêm pelo `templatePatch` no fim deste AppSet,
      # renderizado como texto antes de virar YAML.

      # O webhook do External Secrets Operator injeta defaults do CRD que os
      # manifests no Git não listam (conversionStrategy, decodingStrategy,
      # metadataPolicy, nullBytePolicy, deletionPolicy, engineVersion,
      # mergePolicy), gerando OutOfSync crônico e benigno que mascara drift
      # real no painel. Ignoramos esses campos derivados.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
            - '.spec.target.deletionPolicy'
            - '.spec.target.template.engineVersion'
            - '.spec.target.template.mergePolicy'

  # O que muda para o app que aplica migrations por hook.
  #
  # As duas políticas abaixo existem para repetir o sync sozinhas, e é exatamente
  # isso que não pode acontecer quando o sync executa uma migration. O `retry`
  # repete a operação que falhou; o `selfHeal` reage ao Deployment que continuou
  # OutOfSync porque a migration abortou a promoção. Nos dois casos o hook roda de
  # novo, o `before-hook-creation` apaga o Job que guardava a mensagem do banco, e
  # a falha se repete sem que ninguém a leia.
  #
  # Desligar o `selfHeal` custa a correção automática de drift neste app: alteração
  # manual no cluster passa a aparecer como OutOfSync até alguém sincronizar. É o
  # lado certo da troca — num app com hook de migration, qualquer sync automático é
  # uma execução de migration, e disparar isso por causa de um label editado à mão
  # não se justifica.
  #
  # Fica num patch, e não no `template`, por limitação de tipo: o template é objeto
  # já tipado, então `{{...}}` viraria string onde o apiserver espera inteiro ou
  # booleano. O patch é renderizado como texto antes de virar YAML.
  #
  # `aplicaMigration` é declarado em TODOS os elementos, e não só onde é verdadeiro,
  # porque `goTemplateOptions: missingkey=error` transforma chave ausente em falha
  # de geração do AppSet inteiro.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          selfHeal: {{ not .aplicaMigration }}
        retry:
          limit: {{ if .aplicaMigration }}0{{ else }}5{{ end }}
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: uniplus-platform
  namespace: argocd
spec:
  # Ver comentário em uniplus-apps — função `replace` é Sprig, exige goTemplate.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  uniplus.io/managed: "true"
          - list:
              elements:
                - component: storage
                - component: minio-console-proxy
                - component: traefik
                - component: cert-manager
                - component: external-secrets
                - component: vault
                - component: vault-transit
                - component: vault-transit-bootstrap
                - component: observability/prometheus
                - component: observability/grafana
                - component: observability/loki
                - component: observability/tempo
                # Nome curto `otelcol` (em vez de `otel-collector`) — evita
                # release name > 53 chars (limite Helm) quando combinado com
                # `platform-` prefix + `-uniplus-standalone` suffix.
                - component: observability/otelcol

  template:
    metadata:
      name: 'platform-{{.component | replace "/" "-"}}-{{.name}}'
      labels:
        app.kubernetes.io/part-of: uniplus-platform
        environment: '{{.metadata.labels.environment}}'
    spec:
      project: uniplus
      # Multi-source apps — `$values` usa path absoluto a partir do repo
      # root, evitando o bug de `../../` relativo que renderizava
      # `platform/environments/...` para components com profundidade 3
      # (observability/prometheus, observability/grafana, etc.). Components
      # de profundidade 2 (storage, traefik, ...) também passam a usar
      # path absoluto pra consistência.
      sources:
        - repoURL: https://github.com/unifesspa-edu-br/uniplus-infra
          targetRevision: main
          path: 'platform/{{.component}}'
          helm:
            valueFiles:
              - values.yaml
              - '$values/environments/{{.metadata.labels.environment}}/values.yaml'
        - repoURL: https://github.com/unifesspa-edu-br/uniplus-infra
          targetRevision: main
          ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.component | replace "/" "-"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      # Ver nota no AppSet uniplus-apps: ignora defaults injetados pelo webhook
      # do External Secrets Operator que geram OutOfSync benigno.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
            - '.spec.target.deletionPolicy'
            - '.spec.target.template.engineVersion'
            - '.spec.target.template.mergePolicy'
