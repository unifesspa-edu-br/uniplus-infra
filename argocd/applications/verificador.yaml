# Application do verificador de arquivos do candidato em produção. O chart vive
# no uniplus-api; os valores, neste repositório, em
# environments/uniplus-prd/verificador.values.yaml.
#
# Sem sincronização automática: cada atualização é um sync manual. As duas
# revisões são tags, nunca branch:
#   - a do chart (uniplus-api) é a mesma validada em HML;
#   - a dos valores (uniplus-infra) é a tag de produção, em REVISAO_UNIPLUS_INFRA.
# O marcador REVISAO_UNIPLUS_INFRA é trocado pela tag no momento de aplicar
# (scripts/servicos-no-host/bootstrap-app.sh e docs/RUNBOOKS.md, seção de
# produção); o arquivo no Git nunca aponta para uma branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verificador
  namespace: argocd
  labels:
    app.kubernetes.io/name: uniplus-verificador
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: uniplus
    environment: uniplus-prd
  annotations:
    uniplus.io/atualizacao: manual
spec:
  project: uniplus
  sources:
    - repoURL: https://github.com/unifesspa-edu-br/uniplus-api
      targetRevision: v0.48.0
      path: infra/helm/verificador
      helm:
        releaseName: verificador
        valueFiles:
          - values.yaml
          - $values/environments/uniplus-prd/verificador.values.yaml
    - repoURL: https://github.com/unifesspa-edu-br/uniplus-infra
      targetRevision: REVISAO_UNIPLUS_INFRA
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: uniplus
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
  # Mesmos defaults do webhook do External Secrets Operator ignorados nos
  # ApplicationSets (OutOfSync benigno).
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
        - '.spec.data[].remoteRef.nullBytePolicy'
        - '.spec.target.deletionPolicy'
        - '.spec.target.template.engineVersion'
        - '.spec.target.template.mergePolicy'
