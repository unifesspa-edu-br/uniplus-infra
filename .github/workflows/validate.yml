name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml \
            apps/ platform/ data/ environments/ argocd/

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint apps/
        run: |
          for chart in apps/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart"
              helm lint "$chart"
            fi
          done

      - name: Lint platform/
        run: |
          for chart in platform/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart"
              helm dependency update "$chart"
              helm lint "$chart"
            fi
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  schema-validate:
    name: Schema Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Validate values.schema.json across charts × environments
        run: |
          set -euo pipefail
          ENVS="standalone-compact"
          FAILS=0
          for chart_dir in apps/*/ platform/*/; do
            chart_name=$(basename "$chart_dir")
            if [ ! -f "$chart_dir/Chart.yaml" ]; then continue; fi
            if grep -q '^dependencies:' "$chart_dir/Chart.yaml"; then
              helm dependency update "$chart_dir" >/dev/null
            fi
            for env in $ENVS; do
              echo "Validating $chart_name × $env"
              if ! helm template "$chart_name" "$chart_dir" \
                  -f "environments/$env/values.yaml" >/dev/null 2>/tmp/render.log; then
                echo "✗ $chart_name × $env"
                cat /tmp/render.log
                FAILS=$((FAILS+1))
              fi
            done
          done
          if [ "$FAILS" -gt 0 ]; then
            echo "✗ $FAILS combinação(ões) chart × env falharam"
            exit 1
          fi

  manifest-validate:
    name: Manifest Validate (kubeconform + RFC 1123)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML for RFC 1123 validator
        run: pip install --quiet pyyaml

      - name: Install kubeconform
        run: |
          curl -sL \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Render and validate charts × environments
        run: |
          set -euo pipefail
          K8S_VERSION="1.31.0"
          ENVS="standalone-compact"
          FAILS=0
          for chart in apps/*/ platform/*/ platform/observability/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            chart_name=$(basename "$chart")
            if grep -q '^dependencies:' "$chart/Chart.yaml"; then
              helm dependency update "$chart" >/dev/null 2>&1
            fi
            for env in $ENVS; do
              env_values="environments/$env/values.yaml"
              [ -f "$env_values" ] || continue
              echo "=== $chart × $env ==="
              if ! helm template "$chart_name" "$chart" \
                  -f "$env_values" > /tmp/render.yaml 2>/tmp/render.err; then
                echo "✗ helm template failed"
                cat /tmp/render.err
                FAILS=$((FAILS+1))
                continue
              fi
              # Charts desabilitados em env (ex.: vault em PA1, grafana em PA1)
              # produzem render vazio — kubeconform/RFC 1123 passam trivialmente.
              # kubeconform: estrutura/OpenAPI (campos obrigatórios, tipos,
              # kinds, YAML duplicate-key). -ignore-missing-schemas pula CRDs
              # (ServiceMonitor, IngressRoute, etc.) sem schema disponível.
              if ! kubeconform -strict -summary \
                  -kubernetes-version "$K8S_VERSION" \
                  -ignore-missing-schemas /tmp/render.yaml; then
                echo "✗ kubeconform failed for $chart × $env"
                FAILS=$((FAILS+1))
              fi
              # RFC 1123: container names em workloads. Captura bug de chart
              # wrapper com `alias` virando Chart.Name camelCase + bug de
              # nomes longos > 63 chars que K8s API rejeita.
              if ! python3 scripts/validate-rfc1123.py /tmp/render.yaml; then
                echo "✗ RFC 1123 validation failed for $chart × $env"
                FAILS=$((FAILS+1))
              fi
            done
          done
          if [ "$FAILS" -gt 0 ]; then
            echo "✗ $FAILS combinação(ões) chart × env falharam"
            exit 1
          fi

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
