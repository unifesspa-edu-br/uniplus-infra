# Defaults para o Vault de aplicação: HA Raft com unseal manual (Shamir 5/3).
#
# Bootstrap manual após o primeiro deploy em cada ambiente: ver
# docs/RUNBOOKS.md, seção do Vault.

vault:
  enabled: true

  global:
    enabled: true
    # O listener serve TLS com o certificado do domínio (Secret TLS montado em
    # server.extraVolumes). Cliente nenhum fala com o Vault em texto claro: o Traefik,
    # o External Secrets, o KES e as APIs validam a cadeia pública pelo nome do
    # Vault do ambiente, que o CoreDNS do cluster resolve para o Service.
    tlsDisable: false

  # Vault Agent Injector — injeta secrets em Pods de aplicação anotados.
  injector:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  server:
    enabled: true

    image:
      repository: hashicorp/vault
      tag: "1.21.2"

    # Certificado do domínio (cadeia completa em tls.crt), copiado para o namespace
    # pelos scripts de bootstrap e de renovação. O Vault o relê com SIGHUP.
    extraVolumes:
      - type: secret
        name: uniplus-unifesspa-tls

    # A sonda usa o endpoint de saúde (pronto = aberto, ativo ou standby) em vez do
    # `vault status` do chart, que pula a validação do certificado.
    readinessProbe:
      path: "/v1/sys/health?standbyok=true"

    # HA Raft. Recursos reduzidos por default; o ambiente eleva conforme a carga.
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        # Config Raft default, com unseal manual. O ambiente pode substituir
        # esta string inteira.
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 0
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/uniplus-unifesspa-tls/tls.crt"
            tls_key_file = "/vault/userconfig/uniplus-unifesspa-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"
          }

          service_registration "kubernetes" {}

    # Storage local com PVC durável. StorageClass nomeada definida no
    # environment (sub-issue StorageClass).
    dataStorage:
      enabled: true
      size: 5Gi
      mountPath: /vault/data
      # storageClass: <definido por environment>

    auditStorage:
      enabled: true
      size: 5Gi

    # O Vault não rotaciona o audit.log. O sidecar compacta e esvazia o arquivo uma
    # vez por dia ou ao passar de AUDIT_MAX_BYTES, sem reiniciar o Vault: o
    # dispositivo grava em modo append. As linhas gravadas entre a compactação e o
    # esvaziamento também saem no dispositivo stdout/. Sem `set -e`: uma falha
    # do sidecar tiraria o pod do Vault de Ready.
    extraContainers:
      - name: audit-rotate
        image: hashicorp/vault:1.21.2
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            d=/vault/audit
            f=$d/audit.log
            ultimo=$(date +%F)
            while :; do
              sleep 300
              tamanho=$(stat -c %s "$f" 2>/dev/null || echo 0)
              if [ "$(date +%F)" != "$ultimo" ] || [ "$tamanho" -ge "$AUDIT_MAX_BYTES" ]; then
                if [ "$tamanho" -gt 0 ]; then
                  destino=$d/audit.log.$(date +%Y%m%dT%H%M%S).gz
                  if gzip -c "$f" > "$destino"; then
                    : > "$f"
                  else
                    rm -f "$destino"
                  fi
                fi
                ultimo=$(date +%F)
              fi
              find "$d" -name 'audit.log.*.gz' -mtime +"$AUDIT_RETENCAO_DIAS" -delete
            done
        env:
          - name: AUDIT_MAX_BYTES
            value: "104857600"
          - name: AUDIT_RETENCAO_DIAS
            value: "30"
        volumeMounts:
          - name: audit
            mountPath: /vault/audit
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

    # Recursos padrão; o ambiente os ajusta conforme a carga.
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    service:
      enabled: true
      type: ClusterIP

    statefulSet:
      extraLabels:
        app.kubernetes.io/part-of: uniplus
        app.kubernetes.io/component: vault

# NetworkPolicy controlando ingress/egress no Pod do Vault de aplicação.
networkPolicy:
  enabled: true
  # Namespace do external-secrets operator (consumidor primário do Vault).
  externalSecretsNamespace: external-secrets
  # Namespace do Traefik no mesmo cluster (acesso UI/API).
  traefikNamespace: traefik
  # Namespaces de aplicações consumidoras do Vault (auth/kubernetes/login +
  # <mount>-transit/{encrypt,decrypt,hmac}). Cada entrada gera uma regra de ingress 8200.
  # Vazio = sem regra; aplicações em namespaces fora desta lista não
  # alcançarão o Vault server (mesmo com NetworkPolicy de egress permissiva
  # do lado do consumidor).
  appConsumerNamespaces: []
  # CIDRs restritos para egress ao Kubernetes API server (service registration).
  # Padrão: service CIDR do K3s (10.43.0.0/16) — cobre o ClusterIP do
  # serviço `kubernetes` em `default` sem permitir destinos externos em 443/6443.
  # Ajustar em environments/ se o service CIDR do cluster for diferente.
  # ATENÇÃO: lista vazia suprime a regra inteiramente — service_registration
  # "kubernetes" {} falhará. Só usar [] se o cluster não precisar de
  # service registration (ex.: Vault sem injeção de secrets via K8s).
  kubeApiCidrs:
    - 10.43.0.0/16
  # Egress para cloud provider IMDS (169.254.169.254) + KMS endpoints
  # públicos (HTTPS:443 internet). Necessário só quando o seal block é
  # "ocikms"/"awskms"/"gcpckms"/"azurekeyvault" e o Vault autentica via
  # Instance Principal. Sem essas rotas, o SDK do Vault entra em pânico.
  # Desligado por padrão: o unseal é manual.
  cloudKmsEgressEnabled: false

# ServiceMonitor para Prometheus (Vault expõe métricas em /v1/sys/metrics).
# Desligado por default — ligar quando #26 (Prometheus chart) estiver pronto.
serviceMonitor:
  enabled: false
  interval: 30s
  # O endpoint de métricas fica no listener da API (8200), não no listener
  # interno de cluster/Raft (8201). Com TLS no listener o chart upstream nomeia a
  # porta `https`. O Prometheus valida a cadeia pelo nome do Vault do ambiente:
  # o ambiente informa tlsConfig.serverName.
  port: https
  scheme: https
  tlsConfig: {}

# IngressRoute (Traefik) para acesso administrativo ao UI. O backend é HTTPS e o
# Traefik valida o certificado do Vault pelo nome `ingress.host` (ServersTransport).
# Desligado por default — ligar quando integração OIDC com Keycloak estiver
# pronta (sub-issue futura). Acesso restrito via VPN institucional.
ingress:
  enabled: false
  host: ""
  entryPoint: websecure
  # Middlewares Traefik da rota (ex.: restrição por rede).
  middlewares: []
