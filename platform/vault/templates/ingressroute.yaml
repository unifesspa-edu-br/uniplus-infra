{{- if and .Values.ingress.enabled .Values.vault.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-vault-ui
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: uniplus
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint | default "websecure" }}
  routes:
    - match: Host(`{{ required "ingress.host é obrigatório quando ingress.enabled=true" .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-vault
          port: 8200
{{- end }}
