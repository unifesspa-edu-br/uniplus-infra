# Defaults do chart platform/minio-console-proxy/.
# Cada environment (environments/<env>/values.yaml) sobrescreve apenas o
# necessário. Por padrão o chart fica DESABILITADO — só os ambientes que
# precisam de Console MinIO público (ex.: standalone) ligam via
# `minioConsoleProxy.enabled: true`.

commonLabels:
  app.kubernetes.io/part-of: uniplus
  app.kubernetes.io/component: data-admin

minioConsoleProxy:
  # Liga/desliga o chart inteiro. Default false.
  enabled: false

  # === Backend MinIO (rodando como systemd no data-host, fora do cluster) ===
  # Service K8s do tipo ExternalName aponta para o hostname/IP do data-host.
  # `targetPort` é o port do Console (9001) — port API S3 (9000) NÃO é exposto
  # por este proxy: clients S3 falam direto com o IP privado via NetworkPolicy
  # do app, sem passar por Traefik (overhead desnecessário + sem auth UI).
  backend:
    # IP IPv4 literal do data-host onde MinIO roda. EndpointSlice manual
    # (ver templates/service.yaml) declara addressType: IPv4 — FQDN não é
    # aceito pelo K8s nesse contexto. Para FQDN seria necessário addressType:
    # FQDN (não implementado neste chart) ou resolver no values do environment.
    # Render-time guard rejeita não-IPv4 com mensagem explicativa.
    host: ""                    # ex.: 10.2.2.11
    # Port do MinIO Console (não da API S3 9000).
    consolePort: 9001

  # === Exposição externa via Traefik IngressRoute ===
  ingress:
    # default ON quando chart habilitado — sem ingress, este chart não tem
    # propósito (apenas o Service ExternalName seria criado, sem rota).
    enabled: true
    entryPoint: websecure
    host: ""                    # ex.: minio.standalone.portaluni.com.br
    tls:
      enabled: true
      secretName: ""            # criado pelo cert-manager se certManager.enabled
      certManager:
        enabled: false
        clusterIssuer: ""       # ex.: letsencrypt-staging | letsencrypt-prod

    # Middleware Traefik para reescrever Host header e/ou forçar redirect.
    # MinIO Console aceita acesso por hostname diferente sem rewrite porque
    # ele lê o Host header e gera URLs relativas. Mantemos vazio por padrão.
    middlewares: []

# === Acervo público (ADR-0132 do uniplus-api) ===
# Rota da borda para o bucket público do MinIO, independente do Console:
# `minioConsoleProxy.enabled` não a liga nem a desliga. Vive neste chart porque
# é o mesmo desenho (porta do MinIO no host, fora do cluster, publicada pelo
# Traefik) e porque a Application deste chart já existe em todo cluster
# gerenciado — um chart novo exigiria reaplicar o ApplicationSet à mão.
#
# A rota reescreve `<pathPrefix>/<chave>` para `/<bucket>/<chave>`, aceita só
# GET e HEAD e entrega ao MinIO uma requisição anônima, sem os cabeçalhos de
# origem encaminhada (ver templates/acervo-publico.yaml). Não expõe a API S3:
# nenhum outro bucket nem operação de escrita passa por ela.
#
# A porta de dados precisa estar liberada no egress do Traefik
# (`networkPolicy.externalBackends` do platform/traefik/), como a do Console.
acervoPublicoProxy:
  # Liga/desliga a rota do acervo. Default false.
  enabled: false
  fullnameOverride: ""

  backend:
    # IPv4 literal do host onde a porta de dados do MinIO escuta (EndpointSlice
    # addressType: IPv4 — FQDN não é aceito).
    host: ""                    # ex.: 192.168.21.134
    # Porta de dados S3 do MinIO.
    port: 9000

  # Bucket público. Precisa ser o mesmo criado pelo setup do MinIO e o mesmo de
  # `uniplusApiHost.acervoPublico.bucket`.
  bucket: uniplus-acervo-publico

  ingress:
    entryPoint: websecure
    host: ""                    # ex.: uniplus-hml.unifesspa.edu.br
    # Caminho público do acervo no host. É o que fecha o endereço divulgado:
    # `uniplusApiHost.acervoPublico.enderecoBase` = https://<host><pathPrefix>.
    pathPrefix: /acervo
    tls:
      enabled: true
      # Vazio: o Traefik escolhe o certificado pelo SNI entre os já carregados
      # (o do host vem da rota que o publica). Preencher só quando o Secret
      # existir no namespace deste chart.
      secretName: ""
    # Middlewares adicionais, aplicados depois da reescrita e da limpeza de
    # cabeçalhos (ex.: cache e limite de taxa, quando a borda própria chegar).
    middlewares: []
