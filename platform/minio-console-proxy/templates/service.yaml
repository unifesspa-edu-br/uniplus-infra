{{- if .Values.minioConsoleProxy.enabled -}}
{{- include "minioProxy.backend" (dict
      "bloco" "minioConsoleProxy"
      "nome" (include "minioConsoleProxy.fullname" .)
      "labels" (include "minioConsoleProxy.labels" .)
