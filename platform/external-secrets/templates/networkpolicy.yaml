{{- $eso := index .Values "external-secrets" -}}
{{- if and .Values.networkPolicy.enabled $eso.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: uniplus
spec:
  # Subchart upstream cria 3 Deployments com app.kubernetes.io/name distintos:
  #   - external-secrets             (controller)
  #   - external-secrets-webhook     (validating webhook)
  #   - external-secrets-cert-controller (cert lifecycle do webhook)
  # Selecionar só `external-secrets` deixaria webhook e cert-controller sem
  # restrição de egress. matchExpressions com In: [...] cobre os três.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - external-secrets
          - external-secrets-webhook
          - external-secrets-cert-controller
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # ESO consome Secrets do Vault de aplicação local (8200/tcp).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vaultNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8200
    # DNS (kube-dns).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API (TokenReview para auth/kubernetes do Vault, manage de
    # Secrets sintetizados, leitura de ServiceAccount tokens). Restrito ao
    # service CIDR para impedir egress livre na internet.
    {{- with .Values.networkPolicy.kubeApiCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
