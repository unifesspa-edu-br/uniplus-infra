{{- if .Values.clusterSecretStore.enabled }}
# ClusterSecretStore default — backend Vault de aplicação local.
#
# Habilitado via override em environments/<env>/values.yaml após:
#   1. Vault inicializado (vault operator init)
#   2. Vault unsealed (auto via Transit em SP1/SP2 ou OCI KMS em standalone)
#   3. Policy `external-secrets-read` criada
#   4. Role `external-secrets` (auth k8s) vinculado à policy
#
# Procedimento detalhado: docs/RUNBOOKS.md §1.4 (3-DC) e §8.4 (standalone).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name | quote }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    vault:
      server: {{ .Values.clusterSecretStore.vaultServer | quote }}
      path: {{ .Values.clusterSecretStore.vaultPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.clusterSecretStore.vaultAuth.role | quote }}
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore.vaultAuth.serviceAccount.name | quote }}
            namespace: {{ .Values.clusterSecretStore.vaultAuth.serviceAccount.namespace | quote }}
{{- end }}
