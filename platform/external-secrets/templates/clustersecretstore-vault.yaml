{{- if .Values.clusterSecretStore.enabled }}
{{- if not .Values.clusterSecretStore.vaultServer -}}
{{- fail "clusterSecretStore.enabled=true exige clusterSecretStore.vaultServer não vazio. Sobrescrever em environments/<env>/values.yaml com a URL HTTPS do Vault pelo nome do certificado (https://uniplus-vault.unifesspa.edu.br:8200)." -}}
{{- end }}
{{- if not .Values.clusterSecretStore.stores -}}
{{- fail "clusterSecretStore.enabled=true exige ao menos uma store em clusterSecretStore.stores." -}}
{{- end }}
# Uma ClusterSecretStore por sistema e ambiente. Cada store lê só o próprio KV do
# Vault, autentica com papel e ServiceAccount próprios e só atende os namespaces
# do dono (spec.conditions): um ExternalSecret fora deles é recusado.
#
# Pré-requisito no Vault: scripts/servicos-no-host/configurar-vault.sh.
{{- range $store := .Values.clusterSecretStore.stores }}
{{- if not $store.namespaces -}}
{{- fail (printf "clusterSecretStore.stores[%s].namespaces não pode ser vazio: a store ficaria aberta a qualquer namespace." $store.name) -}}
{{- end }}
{{- $sa := default (printf "external-secrets-%s" $store.name) $store.serviceAccount }}
{{- $role := default (printf "external-secrets-%s" $store.name) $store.role }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $store.name | quote }}
  annotations:
    # O webhook do External Secrets valida a store. Numa instalação do zero ele
    # sobe na onda 0; nesta onda o ArgoCD só aplica a store com ele saudável.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: external-secrets
spec:
  conditions:
    - namespaces:
        {{- range $store.namespaces }}
        - {{ . | quote }}
        {{- end }}
  provider:
    vault:
      server: {{ $.Values.clusterSecretStore.vaultServer | quote }}
      path: {{ $store.vaultPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $role | quote }}
          serviceAccountRef:
            name: {{ $sa | quote }}
            namespace: {{ $.Release.Namespace | quote }}
{{- end }}
{{- end }}
