# Defaults para o External Secrets Operator (ESO) no cluster Uni+.
#
# Topologia: ESO roda em cada cluster (lab-{sp1,sp2}, prod-{sp1,sp2},
# standalone) e consome Secrets do Vault de aplicação local (chart
# `platform/vault/`). Nos clusters PA1, ESO pode permanecer desligado
# (PA1 só hospeda Vault Transit).
#
# IMPORTANTE: o ClusterSecretStore não é habilitado por default — o Vault
# precisa estar inicializado e o role `external-secrets` configurado antes
# de ligar o store. Habilitar via override em environments/<env>/values.yaml
# após Vault init (issue #64) e provisionamento da policy + role.

# Sem alias no Chart.yaml — key tem que ser literal `external-secrets`
# (com hífen). Acesso em templates Go via `(index .Values "external-secrets" "x")`.
# Sem alias o `nameOverride` também é desnecessário: Chart.Name = nome da dep =
# `external-secrets` (kebab-case) → container name e labels ficam corretos.
external-secrets:
  enabled: true

  # Operator core. Mantido enxuto — em prod elevar conforme Tabela 10.1.
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ServiceAccount do controller. Nome FIXO (`external-secrets`) para que
  # o ClusterSecretStore.vaultAuth.serviceAccount.name (abaixo) referencie
  # a SA correta independente do release name gerado pelo ApplicationSet
  # (`platform-external-secrets-<cluster>`). Sem isso, o upstream cria a SA
  # como `<release>` e o Vault Kubernetes auth role não encontra a SA.
  serviceAccount:
    create: true
    name: external-secrets

  # Webhook de validação (validating admission webhook).
  webhook:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Cert controller (gerencia o certificado interno do webhook).
  certController:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Métricas Prometheus do operator. ESO 2.4.1 já traz 3 ServiceMonitors
  # próprios (controller, webhook, cert-controller) gateados por
  # `serviceMonitor.enabled` + helper `shouldRenderServiceMonitor` (que
  # checa se a CRD do Prometheus Operator existe). Wrapper NÃO emite SM
  # próprio para evitar scrape duplicado do endpoint /metrics no controller.
  # Ligar `enabled: true` quando #26 (Prometheus chart) estiver pronto.
  serviceMonitor:
    enabled: false

  # Labels padrão Uni+ aplicados em todos os recursos do subchart.
  commonLabels:
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: external-secrets

# ============================================================================
# ClusterSecretStore — uma por sistema e ambiente, cada uma com o próprio KV do
# Vault, papel e ServiceAccount, restrita aos namespaces do dono.
# Desligado por default (o Vault precisa estar inicializado primeiro).
# Habilitar via override em environments/<env>/values.yaml após:
#   1. `vault operator init` executado (chaves Shamir guardadas)
#   2. Vault aberto
#   3. scripts/servicos-no-host/configurar-vault.sh rodado (KVs, políticas e
#      roles `external-secrets-<store>`)
# Procedimento detalhado em docs/RUNBOOKS.md.
# ============================================================================
clusterSecretStore:
  enabled: false

  # Endpoint do Vault no cluster local. NÃO HÁ DEFAULT UTILIZÁVEL — cada
  # ambiente DEVE sobrescrever. O chart `platform/vault/` não força
  # `fullnameOverride`, então o Service leva o nome da release:
  #   http://platform-vault.vault.svc.cluster.local:8200
  vaultServer: ""

  # Uma entrada por store. Os ExternalSecrets dos charts citam só o `name`.
  #   name           nome da ClusterSecretStore (estável entre ambientes)
  #   vaultPath      KV v2 do sistema no ambiente (ex.: uniplus-prd)
  #   namespaces     únicos namespaces que podem usar a store (obrigatório)
  #   role           papel no auth/kubernetes (default external-secrets-<name>)
  #   serviceAccount ServiceAccount em external-secrets (default external-secrets-<name>)
  stores: []
  #  - name: uniplus
  #    vaultPath: uniplus-prd
  #    namespaces: [uniplus]

# ============================================================================
# NetworkPolicy — egress controlado para Vault local + DNS + Kubernetes API.
# ============================================================================
networkPolicy:
  enabled: true

  # Namespace onde o chart platform/vault/ está instalado (default: vault).
  vaultNamespace: vault

  # CIDRs restritos para egress ao Kubernetes API server (validating webhook
  # talvez precise; ESO consome ServiceAccount tokens via API).
  # Padrão: service CIDR do K3s (10.43.0.0/16).
  kubeApiCidrs:
    - 10.43.0.0/16
