{{- if .Values.rabbitmq.enabled }}
{{- $r := .Values.rabbitmq -}}
{{- $es := $r.externalSecret -}}
# Credenciais lidas pelo broker (admin) e pelo Job de provisionamento (todas).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rabbitmq.credentialsSecretName" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreKind }}
    name: {{ $es.secretStoreName }}
  target:
    name: {{ include "rabbitmq.credentialsSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_USERNAME
      remoteRef:
        key: {{ $es.adminVaultPath }}
        property: username
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ $es.adminVaultPath }}
        property: password
    - secretKey: API_PASSWORD
      remoteRef:
        key: {{ $es.apiVaultPath }}
        property: password
    - secretKey: VERIFICADOR_PASSWORD
      remoteRef:
        key: {{ $es.verificadorVaultPath }}
        property: password
{{- if $r.consumers.enabled }}
---
# O que a API lê: URI AMQP completa e as partes avulsas.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $r.consumers.apiSecretName }}
  namespace: {{ $r.consumers.namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreKind }}
    name: {{ $es.secretStoreName }}
  target:
    name: {{ $r.consumers.apiSecretName }}
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_USERNAME: {{ $r.users.api | quote }}
        RABBITMQ_PASSWORD: "{{ "{{ .password }}" }}"
        RABBITMQ_URI: "amqp://{{ $r.users.api }}:{{ "{{ .password }}" }}@{{ include "rabbitmq.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:5672/{{ $r.vhost }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $es.apiVaultPath }}
        property: password
---
# O que o verificador lê.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $r.consumers.verificadorSecretName }}
  namespace: {{ $r.consumers.namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreKind }}
    name: {{ $es.secretStoreName }}
  target:
    name: {{ $r.consumers.verificadorSecretName }}
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_USERNAME: {{ $r.users.verificador | quote }}
        RABBITMQ_PASSWORD: "{{ "{{ .password }}" }}"
        RABBITMQ_URI: "amqp://{{ $r.users.verificador }}:{{ "{{ .password }}" }}@{{ include "rabbitmq.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:5672/{{ $r.vhost }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $es.verificadorVaultPath }}
        property: password
{{- end }}
{{- end }}
