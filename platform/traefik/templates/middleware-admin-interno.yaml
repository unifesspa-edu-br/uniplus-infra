{{- if and .Values.middlewares.enabled .Values.middlewares.adminInterno.enabled .Values.traefik.enabled }}
{{- if not .Values.middlewares.adminInterno.sourceRange }}
{{- fail "middlewares.adminInterno.sourceRange é obrigatório quando adminInterno.enabled=true: sem a lista de origens a restrição não permitiria ninguém." }}
{{- end }}
# Restringe as rotas de administração à rede institucional/VPN. Nome fixo, para
# as IngressRoutes de outros namespaces referenciarem com
# `namespace: {{ .Release.Namespace }}` (allowCrossNamespace está ligado).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uniplus-admin-interno
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: traefik
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.middlewares.adminInterno.sourceRange | nindent 6 }}
{{- end }}
