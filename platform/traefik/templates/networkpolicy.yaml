{{- if and .Values.networkPolicy.enabled .Values.traefik.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: uniplus
spec:
  # Subchart upstream emite Pods com `app.kubernetes.io/name: traefik` e
  # `app.kubernetes.io/instance: <release>-traefik` (subchart fullname,
  # NÃO o release name puro). commonLabels adiciona `part-of: uniplus`.
  # Selecionamos por name+part-of (estáveis e únicos por instalação Uni+),
  # evitando depender do template fullname do upstream.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/part-of: uniplus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Tráfego externo entra via NodePort/LoadBalancer (depende do environment).
    # Sem from selector — qualquer origem pode bater nas portas 8000/8443
    # do Pod (firewall/NodePort range já controla acesso na borda do cluster).
    - ports:
        - protocol: TCP
          port: 8000  # web (HTTP) — entryPoint redireciona para HTTPS
        - protocol: TCP
          port: 8443  # websecure (HTTPS)
    # Métricas Prometheus (quando habilitado).
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9100
  egress:
    # Tráfego para os Services dos backends nos namespaces das apps.
    {{- with .Values.networkPolicy.appNamespaces }}
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
    # cert-manager solver Pods (HTTP-01 challenge) nascem no MESMO namespace
    # da Certificate resource — não no namespace `cert-manager` (que hospeda
    # apenas o controller). Para Certificates em namespaces de apps (uniplus,
    # keycloak, etc.) o solver pod nasce ali. Permitir egress para qualquer
    # Pod com o label `acme.cert-manager.io/http01-solver=true`, em qualquer
    # namespace, é o pattern correto. Sem isso, Traefik dá `502 Bad Gateway`
    # em `/.well-known/acme-challenge/*` para Certificates fora de namespaces
    # explicitamente listados em `appNamespaces` — ACME validation falha.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              acme.cert-manager.io/http01-solver: "true"
    # DNS (kube-dns).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API (descoberta de Services e Endpoints, leitura de CRDs).
    {{- with .Values.networkPolicy.kubeApiCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.externalBackends }}
    # Backends externos ao cluster (data-host stateful: MinIO Console,
    # futuras UIs admin de Postgres/Redis/etc.). IngressRoutes que apontam
    # para Services com EndpointSlice manual cujo IP é externo (ex.:
    # 10.2.2.11 do data-host) precisam que o Traefik consiga abrir conexão
    # TCP nesse IP+porta. Sem essa regra, Traefik retorna 502 Bad Gateway
    # silenciosamente (egress default-deny quando policyTypes inclui Egress).
    # Code-reviewer P0 do platform/minio-console-proxy.
    #
    # IMPORTANTE: gerar uma rule SEPARADA por entry de externalBackends.
    # Flatten em um único `to:` + `ports:` causa cross-product (rule única
    # combinando todas as CIDRs com todos os ports), abrindo acessos não
    # declarados (`A:5432` + `B:6379` também viabiliza `A:6379` e `B:5432`).
    # Codex P2 round 1.
    {{- range $b := . }}
    - to:
        - ipBlock:
            cidr: {{ $b.cidr | quote }}
      ports:
        {{- range $b.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
