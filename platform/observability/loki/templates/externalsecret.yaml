{{- if and .Values.loki.enabled .Values.lokiWrapper.externalSecrets.enabled -}}
{{- $eso := .Values.lokiWrapper.externalSecrets -}}
# Secret com as credenciais do usuário loki-svc do MinIO, lido pelo
# StatefulSet via singleBinary.extraEnvFrom. As variáveis LOKI_S3_* preenchem
# os placeholders de loki.loki.storage.s3 (-config.expand-env=true).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplus-loki.s3SecretName" . }}
  labels:
    {{- include "uniplus-loki.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $eso.secretStoreRef.kind }}
    name: {{ $eso.secretStoreRef.name }}
  target:
    name: {{ include "uniplus-loki.s3SecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LOKI_S3_ACCESS_KEY_ID: "{{ "{{" }} .accesskey {{ "}}" }}"
        LOKI_S3_SECRET_ACCESS_KEY: "{{ "{{" }} .secretkey {{ "}}" }}"
        LOKI_S3_ENDPOINT: "{{ "{{" }} .endpoint {{ "}}" }}"
        LOKI_S3_REGION: "{{ "{{" }} .region {{ "}}" }}"
  data:
    - secretKey: accesskey
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.accessKeyIdKey }}
    - secretKey: secretkey
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.secretAccessKeyKey }}
    - secretKey: endpoint
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.endpointKey }}
    - secretKey: region
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.regionKey }}
{{- end }}
