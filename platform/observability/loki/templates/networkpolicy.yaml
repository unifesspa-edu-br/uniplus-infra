{{- if and .Values.loki.enabled .Values.lokiWrapper.networkPolicy.enabled -}}
{{- $np := .Values.lokiWrapper.networkPolicy -}}
{{- if not $np.minioCIDR -}}
{{- fail "lokiWrapper.networkPolicy.enabled=true exige lokiWrapper.networkPolicy.minioCIDR (IP do host de dados, ex.: 192.0.2.10/32)." -}}
{{- end -}}
# NetworkPolicy do Loki SingleBinary.
#
# Ingress: só os namespaces de ingressNamespaces (Grafana consulta, OTel
# Collector envia logs) e os pods do próprio Loki.
# Egress: memberlist entre os pods do Loki, MinIO (minioCIDR:minioPort),
# DNS e, se kubeApiCidrs estiver preenchido, o kube-apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uniplus-loki.fullname" . }}
  labels:
    {{- include "uniplus-loki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uniplus-loki.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Push e queries dos namespaces autorizados.
    - from:
        {{- range $np.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "uniplus-loki.selectorLabels" . | nindent 14 }}
      ports:
        - port: 3100      # API HTTP
          protocol: TCP
        - port: 9095      # gRPC interno
          protocol: TCP
        - port: 7946      # Memberlist
          protocol: TCP
        - port: 7946
          protocol: UDP
  egress:
    # Memberlist entre os pods do Loki; evita falha de ring-join ao escalar.
    - to:
        - podSelector:
            matchLabels:
              {{- include "uniplus-loki.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7946
          protocol: TCP
        - port: 7946
          protocol: UDP
    # MinIO (S3 storage backend)
    - to:
        - ipBlock:
            cidr: {{ $np.minioCIDR | quote }}
      ports:
        - port: {{ $np.minioPort }}
          protocol: TCP
    # DNS K8s (CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $np.kubeApiCidrs }}
    # kube-apiserver
    - to:
        {{- range $np.kubeApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- end }}
{{- end }}
