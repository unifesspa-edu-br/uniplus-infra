apiVersion: v2
name: loki
description: |
  Loki, agregador de logs. Wrapper sobre grafana/loki em modo SingleBinary
  com armazenamento S3 no MinIO (ADR-011).
type: application

# Versão do chart wrapper Uni+.
version: 0.1.0

# Versão do Loki upstream empacotado.
appVersion: "3.6.7"

home: https://github.com/unifesspa-edu-br/uniplus-infra
sources:
  - https://github.com/unifesspa-edu-br/uniplus-infra
  - https://github.com/grafana/loki

maintainers:
  - name: CTIC Unifesspa
    url: https://github.com/unifesspa-edu-br

keywords:
  - loki
  - observability
  - logging
  - uniplus

# Dependência do chart upstream oficial.
# Sem alias: os valores do subchart ficam em .Values.loki.
dependencies:
  - name: loki
    version: 7.0.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
