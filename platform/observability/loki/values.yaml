# Defaults do Loki. Os valores de cada ambiente vivem no repositório de
# implantação; aqui ficam só os defaults seguros.
#
# Topologia (ADR-011): SingleBinary, 1 réplica, replication factor 1, sem
# caches nem gateway. O armazenamento é o MinIO do host de dados, por TLS e
# com o usuário `loki-svc` (política restrita ao bucket `loki-chunks`),
# cujas credenciais ficam no Vault em `minio/loki` e chegam ao pod por
# ExternalSecret + envFrom.
#
# Acesso pelo Grafana: Service ClusterIP na porta 3100. Logs chegam pelo
# OTel Collector (endpoint OTLP `/otlp`); não há Promtail.
#
# Os toggles do subchart ficam dentro do bloco `loki:`. As configurações do
# wrapper (ExternalSecret, NetworkPolicy) ficam em `lokiWrapper:`, chave
# própria porque o arquivo de values do ambiente é compartilhado entre os
# charts e chaves homônimas colidiriam.

loki:
  enabled: true

  # Tudo em um pod só (ingester, querier, compactor, distributor, frontend).
  deploymentMode: SingleBinary

  loki:
    # Single-tenant: aceita push e query sem X-Scope-OrgID.
    auth_enabled: false

    # As credenciais vêm de variáveis de ambiente (singleBinary.extraEnvFrom),
    # expandidas pela flag -config.expand-env abaixo.
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-chunks
        admin: loki-chunks
      s3:
        endpoint: "${LOKI_S3_ENDPOINT}"
        region: "${LOKI_S3_REGION}"
        accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
        secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
        # O MinIO exige path-style e só aceita TLS.
        s3ForcePathStyle: true
        insecure: false

    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Com uma réplica do SingleBinary o fator precisa ser 1; o default do
    # upstream (3) impede o startup.
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki

    limits_config:
      retention_period: 168h          # 7 dias; aplicado pelo compactor
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 15m
      query_timeout: 300s
      volume_enabled: true
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6

    # Sem a retenção do compactor os chunks nunca saem do MinIO.
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3

    pattern_ingester:
      enabled: false

  # Componentes do modo SimpleScalable, desligados.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # `tls: {}` evita o aviso do subchart, que declara o tipo como mapa.
  gateway:
    enabled: false
    ingress:
      enabled: false
      tls: {}

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  test:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
    serviceMonitor:
      enabled: false

  lokiCanary:
    enabled: false

  # A NetworkPolicy é a do wrapper (lokiWrapper.networkPolicy); a do
  # subchart geraria várias políticas.
  networkPolicy:
    enabled: false

  ingress:
    enabled: false
    tls: {}

  singleBinary:
    replicas: 1

    # Expande ${VAR} na configuração (credenciais S3).
    extraArgs:
      - -config.expand-env=true

    # O ambiente aponta para o Secret criado pelo ExternalSecret do wrapper
    # (`loki-s3-creds`, ou lokiWrapper.externalSecrets.s3SecretName).
    extraEnvFrom: []

    # WAL e cache local de índices. A StorageClass vem do ambiente
    # (persistence.storageClass).
    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# ============================================================================
# Wrapper Uni+: ExternalSecret e NetworkPolicy
# ============================================================================
lokiWrapper:
  # Secret com as credenciais do MinIO, via External Secrets Operator e a
  # ClusterSecretStore `plataforma`. Desligado por padrão para o render
  # funcionar sem ESO; o ambiente liga.
  externalSecrets:
    enabled: false
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: plataforma
    # Vazio = `loki-s3-creds`. O nome é fixo porque extraEnvFrom do
    # subchart não aceita template.
    s3SecretName: ""
    s3:
      vaultPath: "minio/loki"
      accessKeyIdKey: "accesskey"
      secretAccessKeyKey: "secretkey"
      endpointKey: "endpoint"
      regionKey: "region"

  # Ingress fechado aos namespaces listados; egress só para MinIO, DNS e,
  # se informado, o kube-apiserver.
  networkPolicy:
    enabled: false
    ingressNamespaces:
      - observability-grafana
      - observability-otelcol
    # IP do host de dados (/32). Obrigatório com a política ligada.
    minioCIDR: ""
    minioPort: 9000
    # IPs do kube-apiserver, avaliados depois do DNAT (no K3s é o IP do
    # host da aplicação). Vazio = sem regra de egress para o apiserver.
    kubeApiCidrs: []
