# Defaults para o OpenTelemetry Collector no cluster Uni+.
#
# Topologia (ADR-013): single DaemonSet em standalone — atua simultaneamente
# como agent (filelog receiver coleta logs do containerd em cada nó) E como
# gateway (apps no mesmo nó enviam OTLP gRPC/HTTP para o collector local).
# Em prod, separar em DaemonSet+Deployment é desejável; em standalone
# single-node, 1 deployment evita complexidade.
#
# Pipelines:
# - logs: filelog (containers do nó) + otlp (apps push direto) → loki
# - traces: otlp (apps push) → tempo
# - metrics: otlp (apps .NET push OTLP) → prometheusremotewrite (Prometheus standalone)
#
# IMPORTANTE — chart upstream tem alias `otelCollector` (definido em
# Chart.yaml). Diferente do Loki/Tempo, aqui usamos alias para distinguir
# `.Values.otelCollector.*` (subchart) de eventuais helpers/wrappers.
#
# Configs do wrapper Uni+ (NetworkPolicy) ficam em chave única
# `otelCollectorWrapper:` (mesmo pattern do Loki/Tempo — evitar colisão
# entre wrappers no environment compartilhado).
#
# Vault: NÃO usado — OTel Collector tem só endpoints internos (Loki+Tempo
# do mesmo cluster); sem credenciais externas, sem ExternalSecret.

otelCollector:
  enabled: true

  # fullnameOverride: força nome dos recursos do subchart como `otelcol-...`
  # em vez de `<release>-otelCollector-...`. Necessário porque:
  # 1. release-name `platform-observability-otelcol-uniplus-standalone` (49) +
  #    `-otelCollector-agent` (19) excede 63 chars (limite RFC 1123 para
  #    nomes de recursos K8s).
  # 2. `otelCollector` em camelCase (do alias do Chart.yaml) viola DNS-1035
  #    label que exige lowercase. Helm aceita o alias mas K8s rejeita.
  #
  # `otelcol` curto + lowercase satisfaz ambos os limites.
  fullnameOverride: otelcol

  # ============================================================================
  # Mode + image
  # ============================================================================
  # DaemonSet: 1 pod por nó, usa hostPath para tail dos /var/log/containers.
  # Em standalone (1 nó) é equivalente a Deployment, mas pattern correto
  # para presets logsCollection.
  mode: daemonset

  image:
    # Distribution contrib — necessária para o exporter `prometheusremotewrite`
    # (pipeline metrics → Prometheus). A distribuição `k8s` não inclui esse
    # exporter; a `contrib` inclui tudo da k8s + todos os contrib components.
    # Diferença de tamanho: ~80 MB (k8s) → ~450 MB (contrib); aceitável em
    # standalone onde o DaemonSet roda em 1 nó apenas.
    repository: otel/opentelemetry-collector-contrib

  # ============================================================================
  # Presets — chart configura volumes + RBAC + pipeline injection automaticamente.
  # ============================================================================
  presets:
    # Adiciona filelog receiver + volume mount /var/log/containers + checkpoint
    # storage. Coleta TODOS os logs de containers do nó.
    logsCollection:
      enabled: true
      includeCollectorLogs: false        # evita loop (collector logando próprios eventos)
      storeCheckpoints: true             # /var/lib/otelcol — resume from last position pós-restart
      maxRecombineLogSize: 102400
    # Adiciona k8sattributes processor (enriquece logs/traces com pod/namespace/etc)
    # + RBAC mínimo (get/list/watch pods).
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: false
      extractAllPodAnnotations: false

  # ============================================================================
  # Configuração do collector — alternateConfig permite OVERRIDE COMPLETO
  # ============================================================================
  # IMPORTANTE: o chart upstream tem bug Helm conhecido onde `null` em sub-keys
  # não remove receivers/exporters/pipelines do default merge (issue helm/helm#12879).
  # `alternateConfig:` substitui COMPLETAMENTE o default — provê config
  # autoritativa sem hash merge.
  #
  # Decisão: usar alternateConfig para excluir receivers que não usamos
  # (jaeger, zipkin, prometheus interno) e adicionar exporters Loki+Tempo
  # com pipelines explícitas.
  #
  # Presets continuam funcionando via injeção do chart no momento do render
  # (filelog para logs pipeline; k8sattributes processor para todas pipelines).
  alternateConfig:
    extensions:
      # Healthcheck obrigatório (probes do chart consomem).
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      # filelog é injetado pelo preset logsCollection — não declarar aqui (preset
      # mescla automaticamente).

    processors:
      # Memory limiter previne OOM kill — sempre primeiro no pipeline.
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Batch antes de exportar — economia de RPC/payloads.
      batch:
        timeout: 10s
        send_batch_size: 8192
      # Resource attrs constantes — env tag para filtragem por DC.
      resource:
        attributes:
          - key: cluster
            value: standalone
            action: upsert
          - key: dc
            value: standalone
            action: upsert
      # Extrai severidade dos logs Serilog (formato bracket) para alimentar
      # o Loki detected_level. Sem isso, logs do stdout das APIs (coletados
      # via filelog) chegam sem severity_text e o Loki classifica como
      # 'unknown'. Aplica somente quando severity_text não está preenchido
      # — logs OTLP das apps já chegam com severity setada pelo SDK .NET.
      #
      # Formato Serilog (após fix Issue #513 — {Level} sem :u3):
      #   [14:59:54 Information] End processing HTTP request...
      # Regex extrai o nivel e seta severity_text + severity_number.
      transform/serilog-severity:
        log_statements:
          - context: log
            statements:
              - 'set(severity_text, ExtractPatterns(body, "^\\[\\d{2}:\\d{2}:\\d{2} (?P<level>\\w+)\\]")["level"]) where severity_text == "" and IsMatch(body, "^\\[\\d{2}:\\d{2}:\\d{2} \\w+\\]")'
              - 'set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "Debug"'
              - 'set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "Information"'
              - 'set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "Warning"'
              - 'set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "Error"'
              - 'set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "Fatal"'
      # Descarta logs de serviços de plataforma que geram ruído sem valor para
      # monitoração das APIs Uni+. Filtros aplicados antes do batch/exporter
      # para evitar custo de armazenamento no Loki.
      #
      # Apicurio Registry: probe K8s em /apis/registry/v3/system/info a cada ~4s
      # via JBossLoggingAccessLogReceiver — representava 89% do volume do namespace.
      # ClamAV: saída de texto não estruturado do scanner, detected_level=unknown.
      filter/drop-platform-noise:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["service.name"] == "apicurio-registry-uniplus-standalone" and IsMatch(body, "system/info")'
            - 'resource.attributes["service.name"] == "clamav-scanner-uniplus-standalone"'
      # k8sattributes é injetado pelo preset kubernetesAttributes.

    exporters:
      # Loki via API HTTP nativa (otelcol-contrib `lokiexporter` removido em
      # 0.108+; recomendação atual é `otlphttp/loki` apontando para o endpoint
      # OTLP do Loki — Loki 3.x suporta OTLP nativo em /otlp/v1/logs).
      #
      # Endpoint via env var `${env:LOKI_OTLP_ENDPOINT}` — populado pelo
      # `extraEnvs` do environment (ver `environments/standalone/values.yaml`).
      # Não usa `{{ }}` Helm template aqui porque `alternateConfig` é renderizado
      # com `tpl` no scope do subchart, sem visibilidade de `.Values` do parent
      # wrapper. Env var injection no DaemonSet contorna esse limite e ainda
      # permite hot-reload do endpoint via Secret/ConfigMap se necessário.
      # Codex P1 PR #224: release-name dos backends varia por cluster
      # (`...uniplus-standalone`, `...lab-sp1`, etc.) — env var por
      # environment é a solução robusta.
      otlphttp/loki:
        endpoint: ${env:LOKI_OTLP_ENDPOINT}
        tls:
          insecure: true
      # Tempo via OTLP HTTP — mesma parametrização.
      otlphttp/tempo:
        endpoint: ${env:TEMPO_OTLP_ENDPOINT}
        tls:
          insecure: true
      # Prometheus remote write — recebe métricas OTLP dos apps .NET e encaminha
      # para o Prometheus standalone via /api/v1/write.
      # Endpoint via env var `${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}` —
      # mesmo padrão do Loki/Tempo: valor real injetado por environment.
      prometheusremotewrite:
        endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
        tls:
          insecure: true
        # Converte Resource attributes (service.name, service.namespace, etc.) em
        # labels Prometheus. Sem isso os dashboards que filtram por
        # service_namespace="uniplus" retornam vazio — o job label é gerado
        # por default mas os demais resource attrs são descartados.
        resource_to_telemetry_conversion:
          enabled: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 60s   # fail fast — não acumular por 5 min (default) se Prometheus indisponível
      # Debug (stdout) — útil em dev; manter para troubleshooting.
      debug:
        verbosity: basic

    service:
      extensions:
        - health_check
      pipelines:
        # Logs: filelog (preset) + otlp (apps push) → memory_limiter → severity → resource → batch → loki
        logs:
          receivers: [otlp]                  # filelog adicionado pelo preset
          processors: [memory_limiter, filter/drop-platform-noise, transform/serilog-severity, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [otlphttp/loki, debug]
        # Traces: otlp → resource → memory_limiter → batch → tempo
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [otlphttp/tempo, debug]
        # Metrics: apps .NET emitem métricas OTLP → OTel Collector → Prometheus
        # via remote_write. Complementar ao scrape do kube-prometheus-stack
        # (que cobre K8s/infra); este pipeline cobre métricas de aplicação
        # empurradas via OpenTelemetryConfiguration.cs (SDK .NET).
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [prometheusremotewrite]

  # ============================================================================
  # Resources — DaemonSet pequeno em standalone
  # ============================================================================
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # ============================================================================
  # Env vars do DaemonSet — populam as referências `${env:X}` no alternateConfig.
  # Defaults vazios (collector falha clean ao iniciar). Environment popula com
  # os endpoints reais dos backends Loki/Tempo nesse cluster.
  # ============================================================================
  extraEnvs:
    - name: LOKI_OTLP_ENDPOINT
      value: ""
    - name: TEMPO_OTLP_ENDPOINT
      value: ""
    - name: PROMETHEUS_REMOTE_WRITE_ENDPOINT
      value: ""

  # ============================================================================
  # Service — em mode=daemonset o chart upstream desativa Service por default
  # (presume que apps usam hostPort). Em standalone queremos Service ClusterIP
  # como fallback consistente — apps podem usar
  # http://platform-observability-otel-collector-uniplus-standalone.observability-otel-collector.svc:4317.
  # ============================================================================
  service:
    enabled: true
    type: ClusterIP

  # ============================================================================
  # Ports — apenas OTLP gRPC + HTTP
  # ============================================================================
  # Override do default que expõe jaeger, zipkin, prometheus etc.
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      hostPort: 4318
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: false  # collector telemetry interna — não scrape externo por enquanto

# ============================================================================
# Wrapper Uni+ — NetworkPolicy próprio
# ============================================================================
# Sem ExternalSecret (collector não consome credenciais externas).
# Endpoints dos exporters Loki/Tempo são parametrizados via env vars no
# DaemonSet (`otelCollector.extraEnvs`), NÃO via chave do wrapper aqui — o
# `tpl` do alternateConfig roda no scope do subchart sem visibilidade de
# `.Values` do parent.
otelCollectorWrapper:
  networkPolicy:
    enabled: false
    # Apps Uni+ que enviam OTLP para o collector. Default cobre o NS principal
    # da plataforma; environments podem estender.
    ingressNamespaces:
      - uniplus
      - traefik              # Traefik métricas/traces (futuro)
      - keycloak
    # Loki + Tempo destinos dos exporters.
    egressLokiNamespace: observability-loki
    egressTempoNamespace: observability-tempo
    egressPrometheusNamespace: observability-prometheus
    # Service CIDR do K3s para acesso ao kube-apiserver (k8sattributes precisa
    # de Watch em pods).
    kubeApiCidrs:
      - 10.43.0.0/16
