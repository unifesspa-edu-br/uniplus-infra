# Defaults do OpenTelemetry Collector. Os valores de cada ambiente vivem no
# repositório de implantação; aqui ficam só os defaults seguros.
#
# Topologia (ADR-013): um DaemonSet que é agente (filelog lê os logs dos
# contêineres do nó) e gateway (as aplicações enviam OTLP ao Service
# `otelcol.observability-otelcol`, portas 4317 gRPC e 4318 HTTP). Não há
# hostPort: o OTLP não tem autenticação e não pode ficar exposto no IP do nó.
#
# Pipelines:
# - logs: filelog (contêineres que não exportam OTLP) + otlp -> Loki
# - traces: otlp -> Tempo
# - metrics: otlp -> Prometheus (remote write)
#
# O subchart entra com o alias `otelCollector`; a NetworkPolicy do wrapper
# fica em `otelCollectorWrapper`. O collector não usa Vault: só fala com
# backends internos do cluster, sem credencial.

otelCollector:
  enabled: true

  # Nome curto e em minúsculas para os recursos: o nome gerado
  # (`<release>-otelCollector-...`) estoura 63 caracteres e o alias em
  # camelCase viola o DNS-1035. O Service resultante é `otelcol`.
  fullnameOverride: otelcol
  # Sem isso o subchart rotula o pod com o alias (`otelCollector`) e a
  # NetworkPolicy do wrapper não o seleciona.
  nameOverride: opentelemetry-collector

  # Um pod por nó, com hostPath para ler /var/log/containers.
  mode: daemonset

  image:
    # A distribuição contrib traz o exporter `prometheusremotewrite`, que a
    # distribuição `k8s` não inclui.
    repository: otel/opentelemetry-collector-contrib

  # Os presets injetam volumes, RBAC e os componentes nas pipelines.
  presets:
    # filelog sobre os logs de todos os contêineres do nó.
    logsCollection:
      enabled: true
      includeCollectorLogs: false        # evita laço com os próprios logs
      storeCheckpoints: true             # retoma da última posição após restart
      maxRecombineLogSize: 102400
    # processor k8sattributes (pod, namespace) e o RBAC de leitura de pods.
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: false
      extractAllPodAnnotations: false

  # `alternateConfig` substitui a configuração padrão do chart por inteiro:
  # `null` em sub-chaves não remove receivers do merge (helm/helm#12879).
  # O filelog e o k8sattributes entram pelos presets.
  alternateConfig:
    extensions:
      # Usado pelas probes do chart.
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      # O preset logsCollection gera o filelog; aqui só a lista de exclusão,
      # que substitui a dele (o padrão do preset procura o coletor no
      # namespace default). O ambiente acrescenta os contêineres que já mandam
      # os próprios logs por OTLP, para não chegarem duas vezes ao Loki; a
      # lista do ambiente substitui esta inteira e precisa repetir o coletor.
      filelog:
        exclude:
          - /var/log/pods/observability-otelcol_otelcol-*/*/*.log

    processors:
      # Sempre o primeiro da pipeline, contra OOM.
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 10s
        send_batch_size: 8192
      resource:
        attributes:
          - key: cluster
            value: uniplus
            action: upsert
          - key: dc
            value: uniplus
            action: upsert
      # Logs do stdout das APIs (Serilog, `[14:59:54 Information] ...`) chegam
      # pelo filelog sem severidade e o Loki os classifica como `unknown`.
      # Extrai o nível só quando severity_text está vazio; logs OTLP já
      # trazem a severidade do SDK.
      transform/serilog-severity:
        log_statements:
          - context: log
            statements:
              - 'set(severity_text, ExtractPatterns(body, "^\\[\\d{2}:\\d{2}:\\d{2} (?P<level>\\w+)\\]")["level"]) where severity_text == "" and IsMatch(body, "^\\[\\d{2}:\\d{2}:\\d{2} \\w+\\]")'
              - 'set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "Debug"'
              - 'set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "Information"'
              - 'set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "Warning"'
              - 'set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "Error"'
              - 'set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "Fatal"'
      # Descarta, antes do batch, logs de plataforma sem valor de monitoração:
      # a probe do Apicurio Registry em /system/info (~4s) era 89% do volume
      # do namespace.
      filter/drop-platform-noise:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["service.name"] == "apicurio-registry-apicurio-registry" and IsMatch(body, "system/info")'

    exporters:
      # Os endpoints vêm de variáveis de ambiente (extraEnvs): o
      # alternateConfig é renderizado no escopo do subchart e não enxerga
      # os values do wrapper, e o nome dos Services varia com a release.
      # O Loki 3.x recebe OTLP nativo em /otlp.
      otlphttp/loki:
        endpoint: ${env:LOKI_OTLP_ENDPOINT}
        tls:
          insecure: true
      otlphttp/tempo:
        endpoint: ${env:TEMPO_OTLP_ENDPOINT}
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
        tls:
          insecure: true
        # Sem a conversão dos resource attributes em labels, os dashboards
        # que filtram por service_namespace ficam vazios.
        resource_to_telemetry_conversion:
          enabled: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 60s   # falha rápido em vez de acumular 5 min
      debug:
        verbosity: basic

    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]                  # filelog adicionado pelo preset
          processors: [memory_limiter, filter/drop-platform-noise, transform/serilog-severity, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [otlphttp/loki, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [otlphttp/tempo, debug]
        # Métricas de aplicação empurradas pelo SDK .NET; as de infraestrutura
        # vêm do scrape do kube-prometheus-stack.
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]   # k8sattributes adicionado pelo preset
          exporters: [prometheusremotewrite]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Endpoints dos backends, referenciados como `${env:X}` no alternateConfig.
  # Vazios por padrão, e o collector não inicia assim; o ambiente define os
  # três (a lista não faz merge no Helm), com os Services da release
  # `platform-observability-<componente>`:
  #   LOKI_OTLP_ENDPOINT                http://platform-observability-loki.observability-loki.svc.cluster.local:3100/otlp
  #   TEMPO_OTLP_ENDPOINT               http://platform-observability-tempo.observability-tempo.svc.cluster.local:4318
  #   PROMETHEUS_REMOTE_WRITE_ENDPOINT  http://platform-observability-pro-prometheus.observability-prometheus.svc.cluster.local:9090/api/v1/write
  extraEnvs:
    - name: LOKI_OTLP_ENDPOINT
      value: ""
    - name: TEMPO_OTLP_ENDPOINT
      value: ""
    - name: PROMETHEUS_REMOTE_WRITE_ENDPOINT
      value: ""

  # Em mode=daemonset o chart não cria Service; este ClusterIP é o endpoint
  # OTLP das aplicações: http://otelcol.observability-otelcol.svc.cluster.local:4317
  service:
    enabled: true
    type: ClusterIP

  # Só OTLP. O `hostPort: null` remove o default do subchart (4317/4318), que
  # exporia o OTLP sem autenticação no IP do nó.
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: null
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      hostPort: null
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: false

# ============================================================================
# Wrapper Uni+: NetworkPolicy
# ============================================================================
otelCollectorWrapper:
  networkPolicy:
    enabled: false
    # Namespaces cujas aplicações enviam OTLP.
    ingressNamespaces:
      - uniplus
      - geo
      - traefik
      - keycloak-replica
    egressLokiNamespace: observability-loki
    egressTempoNamespace: observability-tempo
    egressPrometheusNamespace: observability-prometheus
    # IPs do kube-apiserver, avaliados depois do DNAT (no K3s é o IP do
    # host da aplicação); o k8sattributes precisa de watch em pods.
    # Obrigatório com a política ligada.
    kubeApiCidrs: []
