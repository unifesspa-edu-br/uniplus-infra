{{- if and .Values.otelCollector.enabled .Values.otelCollectorWrapper.networkPolicy.enabled -}}
{{- $np := .Values.otelCollectorWrapper.networkPolicy -}}
{{- if not $np.kubeApiCidrs -}}
{{- fail "otelCollectorWrapper.networkPolicy.enabled=true exige otelCollectorWrapper.networkPolicy.kubeApiCidrs (IP do kube-apiserver, ex.: 192.0.2.10/32)." -}}
{{- end -}}
# NetworkPolicy do OTel Collector.
#
# Ingress: namespaces de ingressNamespaces (aplicações que enviam OTLP) e os
# pods do próprio collector.
# Egress: Loki (3100), Tempo (4317 e 4318), Prometheus (9090), DNS e
# kube-apiserver (o k8sattributes faz watch em pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uniplus-otel.fullname" . }}
  labels:
    {{- include "uniplus-otel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uniplus-otel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range $np.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "uniplus-otel.selectorLabels" . | nindent 14 }}
      ports:
        - port: 4317      # OTLP gRPC
          protocol: TCP
        - port: 4318      # OTLP HTTP
          protocol: TCP
        - port: 13133     # health_check
          protocol: TCP
  egress:
    # Loki
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.egressLokiNamespace | quote }}
      ports:
        - port: 3100
          protocol: TCP
    # Tempo
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.egressTempoNamespace | quote }}
      ports:
        - port: 4318
          protocol: TCP
        - port: 4317
          protocol: TCP
    # Prometheus (remote write)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.egressPrometheusNamespace | quote }}
      ports:
        - port: 9090
          protocol: TCP
    # DNS K8s
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # kube-apiserver
    - to:
        {{- range $np.kubeApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
