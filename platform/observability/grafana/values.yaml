# Defaults do Grafana. Os valores de cada ambiente vivem no repositório de
# implantação; aqui ficam só os defaults seguros.
#
# Datasources provisionados: Prometheus, Loki e Tempo, com os uids fixos
# `prometheus`, `loki` e `tempo` que os dashboards em dashboards/ referenciam.
#
# Conta de administrador: vem de um Secret criado pelo ExternalSecret
# (`externalSecrets.admin`), a partir do Vault. O ambiente aponta
# `admin.existingSecret` para o mesmo nome. Sem Secret, o subchart gera
# uma senha aleatória.

grafana:
  enabled: true

  # Labels Uni+ aplicados aos resources do subchart. ATENÇÃO: o chart
  # grafana/grafana usa `extraLabels` (NÃO `commonLabels` como prometheus
  # ou external-secrets). Setar `commonLabels` aqui seria silenciosamente
  # ignorado e `app.kubernetes.io/part-of: uniplus` não propagaria.
  extraLabels:
    app.kubernetes.io/part-of: uniplus

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Imagem upstream — versão pinada via appVersion do Chart.yaml.
  image:
    tag: "12.3.1"

  # PVC do sqlite (sessões e dashboards editados pela UI; o padrão é
  # provisionar dashboards por ConfigMap). A StorageClass vem do ambiente.
  persistence:
    enabled: true
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    # storageClassName: <definido por environment>

  # Conta de administrador lida do Secret `existingSecret` (criado pelo
  # ExternalSecret em externalSecrets.admin).
  admin:
    existingSecret: ""
    userKey: admin-user
    passwordKey: admin-password

  # Service: ClusterIP (acesso via IngressRoute do Traefik).
  service:
    type: ClusterIP
    port: 80

  # Ingress upstream desligado — usamos IngressRoute do Traefik via
  # template separado quando configurado (default off).
  ingress:
    enabled: false

  # IngressRoute Traefik (templates/ingressroute.yaml), desligada por padrão.
  # Com pathPrefix vazio o Grafana responde na raiz de um host dedicado.
  # Com pathPrefix (ex.: /grafana) exige `serve_from_sub_path: true` e
  # `root_url` terminando no mesmo prefixo.
  ingressRoute:
    enabled: false
    entryPoint: websecure
    host: ""              # FQDN da rota; obrigatório quando enabled
    pathPrefix: ""        # subpath (ex.: /grafana) ou vazio (subdomain)
    serviceName: ""       # vazio = Service do subchart (nome calculado pelo chart)
    servicePort: 80       # porta do Service do subchart Grafana
    middlewares: []       # Middlewares Traefik da rota (ex.: restrição por rede)
    tls:
      enabled: true
      secretName: ""      # vazio = certificado padrão do Traefik

  # ServiceMonitor do próprio Grafana (vem do subchart).
  serviceMonitor:
    enabled: false

  # Datasources provisionados por ConfigMap. Os Services seguem o nome da
  # release `platform-observability-<componente>` no namespace
  # `observability-<componente>`.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          # O kube-prometheus-stack trunca o nome da release para `-pro-`.
          url: http://platform-observability-pro-prometheus.observability-prometheus.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://platform-observability-loki.observability-loki.svc.cluster.local:3100
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://platform-observability-tempo.observability-tempo.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: true
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true

  # Dashboards de dashboards/ entram por ConfigMap (templates/dashboards.yaml)
  # e o sidecar os carrega.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      searchNamespace: ALL
      # Deve bater com a annotation emitida por templates/dashboards.yaml.
      folderAnnotation: grafana_folder
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  # ExternalSecret da conta de administrador, lido do Vault pela store
  # indicada. As propriedades do Vault são `user` e `password`.
  externalSecrets:
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: plataforma
    admin:
      enabled: false
      vaultPath: grafana/admin
      secretName: grafana-admin
      userProperty: user
      passwordProperty: password

  grafana.ini:
    server:
      # Definido pelo ambiente; com subpath, `serve_from_sub_path` precisa
      # ser true e o root_url terminar no prefixo.
      root_url: ""
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    log:
      mode: console
      level: info

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

networkPolicy:
  enabled: false
