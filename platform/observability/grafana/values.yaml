# Defaults para o Grafana no cluster Uni+.
#
# Topologia: roda em cada cluster (lab-{sp1,sp2}, prod-{sp1,sp2}, standalone).
# Em PA1 fica desligado por default (PA1 hospeda agregação separada).
#
# Datasources:
# - Prometheus: pré-configurado, aponta pro Service do chart
#   `platform/observability/prometheus/` (release name no namespace
#   `observability-prometheus` per ApplicationSet pattern).
# - Loki: gateado por `datasources.loki.enabled` (false até #28 mergear).
# - Tempo: gateado por `datasources.tempo.enabled` (false até #29 mergear).
#
# Admin password: placeholder no chart wrapper (default `admin/uniplus`).
# Em prod/standalone, sobrescrever via External Secret (#24 ESO já mergeado;
# requer Vault inicializado #64). Não commitar senha real no values.

grafana:
  enabled: true

  # Labels Uni+ aplicados aos resources do subchart. ATENÇÃO: o chart
  # grafana/grafana usa `extraLabels` (NÃO `commonLabels` como prometheus
  # ou external-secrets). Setar `commonLabels` aqui seria silenciosamente
  # ignorado e `app.kubernetes.io/part-of: uniplus` não propagaria.
  extraLabels:
    app.kubernetes.io/part-of: uniplus

  # 1 réplica em standalone/lab; prod-{sp1,sp2} elevam para 2.
  replicas: 1

  # Recursos lab — Tabela 10.1 (Grafana é leve em uso normal).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Imagem upstream — versão pinada via appVersion do Chart.yaml.
  image:
    tag: "12.3.1"

  # Persistence: 5Gi PVC para o sqlite (sessions + dashboards modificados
  # via UI, embora o pattern preferido seja provisionar via ConfigMap).
  # StorageClass nomeada pelo environment.
  persistence:
    enabled: true
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    # storageClassName: <definido por environment>

  # Admin: senha placeholder. Em prod/standalone sobrescrever via ESO
  # apontando para Secret no Vault (path secret/grafana/admin).
  admin:
    existingSecret: ""              # default vazio — usa adminPassword abaixo
    userKey: admin-user
    passwordKey: admin-password
  adminUser: admin
  adminPassword: uniplus            # PLACEHOLDER — sobrescrever por env+ESO

  # Service: ClusterIP (acesso via IngressRoute do Traefik).
  service:
    type: ClusterIP
    port: 80

  # Ingress upstream desligado — usamos IngressRoute do Traefik via
  # template separado quando configurado (default off).
  ingress:
    enabled: false

  # IngressRoute Traefik (template wrapper Uni+ — platform/observability/grafana/
  # templates/ingressroute.yaml). Suporta dois patterns:
  #
  # 1) Subpath: host raiz + pathPrefix (ex.: standalone.portaluni.com.br/grafana/*).
  #    Exige serve_from_sub_path: true em grafana.ini.server e root_url terminando
  #    em /grafana/. Wrapper emite um Middleware StripPrefix automaticamente.
  #
  # 2) Subdomain: host dedicado (ex.: grafana.standalone.portaluni.com.br) com
  #    pathPrefix vazio. Pattern dos outros admin UIs Uni+ (kafka-ui,
  #    schema-registry, redis-ui).
  #
  # Default OFF — habilitado em environments/<env>/values.yaml por env.
  ingressRoute:
    enabled: false
    entryPoint: websecure
    host: ""              # ex.: standalone.portaluni.com.br
    pathPrefix: ""        # subpath (ex.: /grafana) ou vazio (subdomain)
    serviceName: ""       # default: <Release.Name>-grafana (Service do subchart)
    servicePort: 80       # porta do Service do subchart Grafana
    tls:
      enabled: true
      secretName: ""      # vazio = Traefik usa default cert (LE prod via cert-manager + Certificate emitido em outro template ou chart)

  # Métricas Prometheus do próprio Grafana. ServiceMonitor vem do upstream
  # (gateado por `serviceMonitor.enabled`); wrapper não emite SM próprio.
  serviceMonitor:
    enabled: false  # ligar quando Prometheus (#26) consumidor estiver pronto

  # Datasources provisionados via ConfigMap. Prometheus pré-configurado;
  # Loki/Tempo gateados até as charts (#28/#29) aterrissarem.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          # URL do Service do Prometheus em outro namespace. ApplicationSet
          # cria release `platform-observability-prometheus-<cluster>` no
          # namespace `observability-prometheus`. O Service do Prometheus
          # leva o release name + sufixo do subchart kube-prometheus-stack.
          # Override por environment (cluster name varia).
          url: http://platform-observability-prometheus-CLUSTER-prometheus.observability-prometheus.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

  # Dashboards iniciais — carregados via sidecar do upstream chart se
  # `sidecar.dashboards.enabled: true`. Default off no wrapper para ficar
  # leve; ligar quando dashboards Uni+ específicos forem provisionados.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  # SSO via OIDC (Keycloak — ADR-003). Em environments com Keycloak local
  # (ex.: standalone) habilitar setando `oidc.enabled: true` + URLs reais
  # + ExternalSecret materializando client_secret no Secret K8s referenciado.
  # O bloco grafana.grafana.ini.auth.generic_oauth abaixo só deve ser ativado
  # quando oidc.enabled=true. Login local admin/* permanece como fallback.
  oidc:
    enabled: false
    # Identificação humana exibida no botão de login (auth.generic_oauth.name).
    providerName: "Uni+ Keycloak"
    clientId: grafana
    # URLs Keycloak realm `uniplus`. Override em environments/<env>/values.yaml.
    issuerBaseUrl: ""  # ex.: https://standalone.portaluni.com.br/auth/realms/uniplus
    # JMESPath para mapear claim `groups` → role Grafana. Default canônico
    # alinhado com pattern AKHQ (grupos /admins/<app> + /editors/<app>).
    roleAttributePath: |
      contains(groups[*], '/admins/grafana') && 'Admin' || contains(groups[*], '/editors/grafana') && 'Editor' || 'Viewer'
    # Permite assignment como Server Admin via grupo (cuidado: ServerAdmin
    # tem permissão total cross-org). Default true para alinhar com o
    # mapping de `/admins/grafana` → Admin no role_attribute_path.
    allowAssignGrafanaAdmin: true
    # Auto-login redireciona direto para Keycloak sem mostrar o form local.
    # Default false para preservar fallback admin local em incidente.
    autoLogin: false

  # ExternalSecret que materializa o client_secret do client OIDC `grafana`
  # do realm uniplus no namespace observability-grafana. Consumido via env
  # OIDC_CLIENT_SECRET pelo Pod Grafana e referenciado em
  # `grafana.ini.auth.generic_oauth.client_secret` como ${OIDC_CLIENT_SECRET}.
  externalSecrets:
    enabled: false
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default
    oidcClient:
      vaultPath: ""  # ex.: secret/standalone/keycloak/clients/grafana
      clientSecretKey: client_secret

  grafana.ini:
    server:
      root_url: ""  # override por env (ex.: https://standalone.portaluni.com.br/grafana/)
      # Habilita Grafana servir corretamente quando atrás de PathPrefix.
      # Quando root_url contém subpath (ex.: /grafana/), Grafana reescreve
      # URLs internas com o prefix. Sem isso, login redireciona para /login
      # (em vez de /grafana/login) e quebra cookies/CSRF. Override por env
      # via environments/<env>/values.yaml quando subpath. Subdomain root
      # (sem subpath) deixa false (default).
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    log:
      mode: console
      level: info

  # Pod security — non-root (Grafana já roda como UID 472 por default).
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

# ============================================================================
# NetworkPolicy custom Uni+. Subchart upstream tem suas próprias NPs;
# wrapper deixa pra subchart. Override por env se precisar.
# ============================================================================
networkPolicy:
  enabled: false
