{{- if and .Values.grafana.enabled .Values.grafana.ingressRoute.enabled -}}
{{- $ing := .Values.grafana.ingressRoute -}}
{{- if not $ing.host -}}
{{- fail "grafana.ingressRoute.enabled=true exige grafana.ingressRoute.host (FQDN da rota)." -}}
{{- end -}}
{{- $svcName := default (include "uniplus-grafana.serviceName" .) $ing.serviceName -}}
{{- $svcPort := default 80 $ing.servicePort -}}
{{/*
  Com pathPrefix vazio a rota usa só o host. Com pathPrefix, o Traefik não
  remove o prefixo: o Grafana com `serve_from_sub_path=true` espera o
  sub-path na URL e, sem ele, redireciona para o root_url em laço.
*/}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "uniplus-grafana.fullname" . }}
  labels:
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: grafana
spec:
  entryPoints:
    - {{ $ing.entryPoint | default "websecure" | quote }}
  routes:
    {{- if $ing.pathPrefix }}
    - match: Host(`{{ $ing.host }}`) && PathPrefix(`{{ $ing.pathPrefix }}`)
      kind: Rule
      {{- with $ing.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
    {{- else }}
    - match: Host(`{{ $ing.host }}`)
      kind: Rule
      {{- with $ing.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
    {{- end }}
  {{- if and $ing.tls.enabled $ing.tls.secretName }}
  tls:
    secretName: {{ $ing.tls.secretName | quote }}
  {{- end }}
  {{- /* Sem secretName o bloco tls é omitido: o CRD rejeita `tls: null`. */}}
{{- end }}
