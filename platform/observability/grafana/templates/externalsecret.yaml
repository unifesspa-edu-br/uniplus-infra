{{- $es := .Values.grafana.externalSecrets -}}
{{- if and .Values.grafana.enabled $es.admin.enabled -}}
{{- if not $es.admin.vaultPath -}}
{{- fail "grafana.externalSecrets.admin.enabled=true exige grafana.externalSecrets.admin.vaultPath (ex.: grafana/admin)." -}}
{{- end -}}
# Conta de administrador do Grafana, materializada do Vault. O subchart lê o
# Secret por `grafana.admin.existingSecret`, que deve ter o mesmo nome.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.admin.secretName }}
  labels:
    app.kubernetes.io/part-of: uniplus
    app.kubernetes.io/component: grafana
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $es.admin.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.grafana.admin.userKey }}
      remoteRef:
        key: {{ $es.admin.vaultPath | quote }}
        property: {{ $es.admin.userProperty | quote }}
    - secretKey: {{ .Values.grafana.admin.passwordKey }}
      remoteRef:
        key: {{ $es.admin.vaultPath | quote }}
        property: {{ $es.admin.passwordProperty | quote }}
{{- end }}
