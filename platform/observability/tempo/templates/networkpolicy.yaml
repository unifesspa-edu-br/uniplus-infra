{{- if and .Values.tempo.enabled .Values.tempoWrapper.networkPolicy.enabled -}}
{{- $np := .Values.tempoWrapper.networkPolicy -}}
{{- if not $np.minioCIDR -}}
{{- fail "tempoWrapper.networkPolicy.enabled=true exige tempoWrapper.networkPolicy.minioCIDR (IP do host de dados, ex.: 192.0.2.10/32)." -}}
{{- end -}}
# NetworkPolicy do Tempo single-binary.
#
# Ingress: só os namespaces de ingressNamespaces (Grafana consulta, OTel
# Collector envia traces) e os pods do próprio Tempo.
# Egress: memberlist entre os pods do Tempo, MinIO (minioCIDR:minioPort),
# DNS, kube-apiserver (se kubeApiCidrs estiver preenchido) e Prometheus
# (se egressPrometheusNamespace estiver preenchido).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uniplus-tempo.fullname" . }}
  labels:
    {{- include "uniplus-tempo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uniplus-tempo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range $np.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "uniplus-tempo.selectorLabels" . | nindent 14 }}
      ports:
        - port: 3200      # API HTTP
          protocol: TCP
        - port: 4317      # OTLP gRPC
          protocol: TCP
        - port: 4318      # OTLP HTTP
          protocol: TCP
        - port: 9095      # gRPC interno
          protocol: TCP
        - port: 7946      # Memberlist
          protocol: TCP
        - port: 7946
          protocol: UDP
  egress:
    # Memberlist entre os pods do Tempo; evita falha de ring-join ao escalar.
    - to:
        - podSelector:
            matchLabels:
              {{- include "uniplus-tempo.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7946
          protocol: TCP
        - port: 7946
          protocol: UDP
    # MinIO (S3 storage backend)
    - to:
        - ipBlock:
            cidr: {{ $np.minioCIDR | quote }}
      ports:
        - port: {{ $np.minioPort }}
          protocol: TCP
    # DNS K8s
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $np.kubeApiCidrs }}
    # kube-apiserver
    - to:
        {{- range $np.kubeApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- end }}
    {{- if $np.egressPrometheusNamespace }}
    # Prometheus (remote_write do metricsGenerator)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.egressPrometheusNamespace | quote }}
      ports:
        - port: 9090
          protocol: TCP
    {{- end }}
{{- end }}
