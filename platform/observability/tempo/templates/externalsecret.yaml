{{- if and .Values.tempo.enabled .Values.tempoWrapper.externalSecrets.enabled -}}
{{- $eso := .Values.tempoWrapper.externalSecrets -}}
# Sintese do Secret K8s com credenciais MinIO escopadas (user tempo-svc).
# Consumido pelo StatefulSet do Tempo via tempo.tempo.extraEnvFrom abaixo;
# o env-expansion na config do Tempo (-config.expand-env=true) substitui os
# placeholders ${TEMPO_S3_*} pelos valores reais no startup do binário.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "uniplus-tempo.s3SecretName" . }}
  labels:
    {{- include "uniplus-tempo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $eso.secretStoreRef.kind }}
    name: {{ $eso.secretStoreRef.name }}
  target:
    name: {{ include "uniplus-tempo.s3SecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        TEMPO_S3_ACCESS_KEY_ID: "{{ "{{" }} .accesskey {{ "}}" }}"
        TEMPO_S3_SECRET_ACCESS_KEY: "{{ "{{" }} .secretkey {{ "}}" }}"
        TEMPO_S3_ENDPOINT: "{{ "{{" }} .endpoint {{ "}}" }}"
        TEMPO_S3_REGION: "{{ "{{" }} .region {{ "}}" }}"
  data:
    - secretKey: accesskey
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.accessKeyIdKey }}
    - secretKey: secretkey
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.secretAccessKeyKey }}
    - secretKey: endpoint
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.endpointKey }}
    - secretKey: region
      remoteRef:
        key: {{ $eso.s3.vaultPath }}
        property: {{ $eso.s3.regionKey }}
{{- end }}
