apiVersion: v2
name: tempo
description: |
  Tempo, armazenamento de traces. Wrapper sobre grafana/tempo
  (single-binary) com receivers OTLP e armazenamento S3 no MinIO (ADR-012).
type: application

# Versão do chart wrapper Uni+.
version: 0.1.0

# Versão do Tempo upstream empacotado.
appVersion: "2.9.0"

home: https://github.com/unifesspa-edu-br/uniplus-infra
sources:
  - https://github.com/unifesspa-edu-br/uniplus-infra
  - https://github.com/grafana/helm-charts

maintainers:
  - name: CTIC Unifesspa
    url: https://github.com/unifesspa-edu-br

keywords:
  - tempo
  - observability
  - tracing
  - opentelemetry
  - uniplus

# Sem alias: os valores do subchart ficam em .Values.tempo.
dependencies:
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
