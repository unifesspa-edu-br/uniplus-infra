# Defaults do Tempo. Os valores de cada ambiente vivem no repositório de
# implantação; aqui ficam só os defaults seguros.
#
# Topologia (ADR-012): single-binary, 1 réplica (chart `grafana/tempo`).
# O armazenamento é o MinIO do host de dados, por TLS e com o usuário
# `tempo-svc` (política restrita ao bucket `tempo-traces`), cujas
# credenciais ficam no Vault em `minio/tempo` e chegam ao pod por
# ExternalSecret + envFrom + `-config.expand-env=true`.
#
# Receivers: só OTLP (gRPC 4317, HTTP 4318). O OTel Collector envia os
# traces para a porta 4318.
#
# Acesso pelo Grafana: Service ClusterIP na porta 3200.
#
# Retenção: 72h.
#
# Os toggles do subchart ficam dentro do bloco `tempo:`. As configurações do
# wrapper (ExternalSecret, NetworkPolicy) ficam em `tempoWrapper:`, chave
# própria porque o arquivo de values do ambiente é compartilhado entre os
# charts e chaves homônimas colidiriam.

tempo:
  enabled: true

  replicas: 1

  tempo:
    repository: grafana/tempo
    tag: ""                  # vazio = appVersion do Chart.yaml

    # block_retention do compactor.
    retention: 72h

    multitenancyEnabled: false

    # Sem telemetria de uso para a Grafana Labs.
    reportingEnabled: false

    # Gera métricas RED e service graph a partir dos spans e as publica no
    # Prometheus por remote_write (o Prometheus precisa de
    # `enableRemoteWriteReceiver`). O ambiente que ligar define
    # `enabled: true`, `remoteWriteUrl`
    # (http://platform-observability-pro-prometheus.observability-prometheus.svc.cluster.local:9090/api/v1/write),
    # `overrides.defaults.metrics_generator.processors`
    # (service-graphs, span-metrics) e `egressPrometheusNamespace` no wrapper.
    metricsGenerator:
      enabled: false
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
        span_metrics:
          enable_target_info: true
      registry:
        collection_interval: 15s
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces

    # Sem os processors ativos aqui o generator não emite nada.
    overrides:
      defaults: {}

    # Credenciais por variável de ambiente (-config.expand-env em extraArgs).
    storage:
      trace:
        backend: s3
        wal:
          path: /var/tempo/wal
        s3:
          bucket: tempo-traces
          endpoint: "${TEMPO_S3_ENDPOINT}"
          region: "${TEMPO_S3_REGION}"
          access_key: "${TEMPO_S3_ACCESS_KEY_ID}"
          secret_key: "${TEMPO_S3_SECRET_ACCESS_KEY}"
          # O MinIO exige path-style e só aceita TLS.
          forcepathstyle: true
          insecure: false

    server:
      http_listen_port: 3200

    # Só OTLP; Jaeger e OpenCensus ficam desligados.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    # Expande ${TEMPO_S3_*} na configuração. O subchart espera mapa, não lista.
    extraArgs:
      config.expand-env: "true"

    # O ambiente aponta para o Secret criado pelo ExternalSecret do wrapper
    # (`tempo-s3-creds`, ou tempoWrapper.externalSecrets.s3SecretName).
    extraEnvFrom: []

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001

  # WAL antes do flush para o S3. Este subchart usa `storageClassName`
  # (o do Loki usa `storageClass`); a chave errada é ignorada em silêncio e
  # o PVC cai na classe padrão do cluster.
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # storageClassName vem do ambiente.

  service:
    type: ClusterIP
    annotations: {}

  # A NetworkPolicy é a do wrapper (tempoWrapper.networkPolicy).
  networkPolicy:
    enabled: false

  # Os traces são consultados pelo Grafana.
  tempoQuery:
    enabled: false

  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001

  serviceAccount:
    create: true

# ============================================================================
# Wrapper Uni+: ExternalSecret e NetworkPolicy
# ============================================================================

tempoWrapper:
  externalSecrets:
    enabled: false
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore
      name: plataforma
    # Vazio = `tempo-s3-creds`. O nome é fixo porque extraEnvFrom do
    # subchart não aceita template.
    s3SecretName: ""
    s3:
      vaultPath: "minio/tempo"
      accessKeyIdKey: "accesskey"
      secretAccessKeyKey: "secretkey"
      endpointKey: "endpoint"
      regionKey: "region"

  networkPolicy:
    enabled: false
    ingressNamespaces:
      - observability-grafana
      - observability-otelcol
    # IP do host de dados (/32). Obrigatório com a política ligada.
    minioCIDR: ""
    minioPort: 9000
    # Com metricsGenerator ligado, namespace do Prometheus para liberar o
    # egress 9090 do remote_write.
    egressPrometheusNamespace: ""
    # IPs do kube-apiserver, avaliados depois do DNAT (no K3s é o IP do
    # host da aplicação). Vazio = sem regra de egress para o apiserver.
    kubeApiCidrs: []
