{{- if not .Values.alertasEmail.enabled -}}
# Com `alertasEmail.enabled=false` o `configSecret` do Alertmanager continua
# apontando para este Secret, que descarta os alertas (receptor "null") em vez
# de apontar para um Secret inexistente.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kubePrometheusStack.alertmanager.alertmanagerSpec.configSecret }}
  labels:
    app.kubernetes.io/name: alertmanager-config
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: uniplus
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: "null"
    receivers:
      - name: "null"
{{- end }}
