{{- $am := .Values.alertasEmail -}}
{{- if $am.enabled -}}
# Configuração do Alertmanager com o relay SMTP institucional (host, usuário e
# senha do Vault, o mesmo segredo `smtp` do envio de e-mail da API). O ESO
# renderiza o alertmanager.yaml inteiro no Secret lido pelo Operator em
# `alertmanagerSpec.configSecret`; nenhum segredo vai ao Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kubePrometheusStack.alertmanager.alertmanagerSpec.configSecret }}
  labels:
    app.kubernetes.io/name: alertmanager-config
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: uniplus
spec:
  refreshInterval: {{ $am.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $am.secretStoreRef.kind }}
    name: {{ $am.secretStoreRef.name }}
  target:
    name: {{ .Values.kubePrometheusStack.alertmanager.alertmanagerSpec.configSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: {{ `{{ printf "%s:%s" .host "` }}{{ $am.porta }}{{ `" | toJson }}` }}
            smtp_from: {{ $am.remetente | quote }}
            smtp_auth_username: {{ `{{ .username | toJson }}` }}
            smtp_auth_password: {{ `{{ .password | toJson }}` }}
            smtp_require_tls: {{ $am.exigirTls }}
          route:
            group_by: [alertname, cluster]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: "null"
            routes:
              # Alertas de infraestrutura do próprio stack (heartbeat e inibidor).
              - matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
                receiver: "null"
              - matchers: ['severity = "critical"']
                receiver: email-critico
                repeat_interval: {{ $am.repeticaoCritico }}
              - matchers: ['severity = "warning"']
                receiver: email-aviso
                repeat_interval: {{ $am.repeticaoAviso }}
          receivers:
            - name: "null"
            - name: email-critico
              email_configs:
                - to: {{ $am.destinatario | quote }}
                  send_resolved: true
            - name: email-aviso
              email_configs:
                - to: {{ $am.destinatario | quote }}
                  send_resolved: true
          inhibit_rules: []
  data:
    - secretKey: host
      remoteRef:
        key: {{ $am.vaultPath | quote }}
        property: {{ $am.hostKey | quote }}
    - secretKey: username
      remoteRef:
        key: {{ $am.vaultPath | quote }}
        property: {{ $am.usernameKey | quote }}
    - secretKey: password
      remoteRef:
        key: {{ $am.vaultPath | quote }}
        property: {{ $am.passwordKey | quote }}
{{- end }}
