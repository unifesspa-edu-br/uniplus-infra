# Defaults do stack Prometheus. Os valores de cada ambiente vivem no
# repositório de implantação; aqui ficam só os defaults seguros.
#
# Topologia (ADR-013 define o fluxo de métricas): um Prometheus com retenção de 7 dias,
# uma réplica. O Grafana tem chart próprio (platform/observability/grafana/);
# o do subchart fica desligado.
#
# O ambiente define: StorageClass do Prometheus e do Alertmanager,
# `externalLabels.cluster` e, se preciso, tamanho do PVC e retenção.

kubePrometheusStack:
  enabled: true

  # Mantém o Chart.Name em kebab-case nos labels (o alias
  # `kubePrometheusStack` apareceria em camelCase).
  nameOverride: kube-prometheus-stack

  # O subchart já define `app.kubernetes.io/part-of`; repeti-lo aqui geraria
  # chave duplicada no YAML. O rastreio Uni+ usa um label de domínio próprio.
  commonLabels:
    uniplus.io/managed: "true"

  # CRDs (ServiceMonitor, PodMonitor, PrometheusRule); o subchart as marca
  # com `helm.sh/resource-policy: keep`.
  crds:
    enabled: true
    upgradeJob:
      enabled: false  # o ArgoCD gerencia as atualizações

  # Grafana tem chart próprio.
  grafana:
    enabled: false

  prometheusOperator:
    enabled: true
    # Sem webhook de admissão: os Jobs de hook que geram o certificado dele
    # ficam presos no finalizer do ArgoCD e travam todo sync. As regras vêm do
    # Git e são validadas no render do CI.
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  prometheus:
    enabled: true
    # UI do Prometheus sem exposição.
    ingress:
      enabled: false
    prometheusSpec:
      replicas: 1

      retention: 7d
      retentionSize: 8GiB  # PVC de 10Gi, com folga para o WAL

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            # storageClassName vem do ambiente
            resources:
              requests:
                storage: 10Gi

      # Seleciona todos os ServiceMonitors, PodMonitors, Probes e regras do
      # cluster, sem exigir o label da release.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      externalLabels:
        institution: unifesspa
        platform: uniplus
        # cluster vem do ambiente

      # Aceita POST /api/v1/write do OTel Collector (exporter
      # `prometheusremotewrite`, ADR-013). Os labels do payload (service_name,
      # service_namespace, http_route) entram no TSDB sem relabeling.
      enableRemoteWriteReceiver: true

  # A configuração vem sempre do Secret `configSecret`, com o mesmo nome de
  # `alertasEmail.secretName`: com `alertasEmail.enabled=true`, o ExternalSecret
  # monta o e-mail por severidade; desligado, o chart cria um Secret que
  # descarta os alertas (receptor "null").
  alertmanager:
    enabled: true
    alertmanagerSpec:
      configSecret: alertmanager-uniplus-config
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      retention: 120h
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: [alertname, cluster, service]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: "null"
      receivers:
        - name: "null"
      inhibit_rules: []

  nodeExporter:
    enabled: true

  kube-state-metrics:
    enabled: true

  # No K3s os componentes do control-plane rodam dentro do processo do K3s,
  # sem endpoint próprio para os ServiceMonitors padrão; esses ficam desligados.
  kubeApiServer:
    enabled: true
  kubelet:
    enabled: true
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false  # métricas só em 127.0.0.1
  kubeEtcd:
    enabled: false

# Destino dos alertas: e-mail do grupo de operação do Uni+ pelo relay SMTP
# institucional. Host, usuário e senha vêm do segredo `smtp` do Vault (o mesmo
# da API), via ExternalSecret que monta o alertmanager.yaml. Alertas
# `critical` e `warning` seguem para receptores distintos, com repetição
# própria. `secretName` deve coincidir com
# `kubePrometheusStack.alertmanager.alertmanagerSpec.configSecret`.
alertasEmail:
  enabled: true
  secretName: alertmanager-uniplus-config
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: plataforma
  vaultPath: smtp
  hostKey: host
  usernameKey: username
  passwordKey: password
  porta: 25
  exigirTls: true             # STARTTLS, como o Keycloak
  remetente: nao-responda@unifesspa.edu.br
  destinatario: sistema-uniplus@unifesspa.edu.br
  repeticaoCritico: 4h
  repeticaoAviso: 12h

networkPolicy:
  # As NetworkPolicies são as do subchart
  # (`kubePrometheusStack.prometheus.networkPolicy.enabled`).
  enabled: false
