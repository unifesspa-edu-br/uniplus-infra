{{- if .Values.kes.enabled }}
{{- $es := .Values.kes.externalSecret -}}
# Certificado do servidor KES (gerado por provision-verificacao-prerequisites.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kes.tlsSecretName" . }}
  labels:
    {{- include "kes.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreKind }}
    name: {{ $es.secretStoreName }}
  target:
    name: {{ include "kes.tlsSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ $es.tls.vaultPath }}
        property: {{ $es.tls.certProperty }}
    - secretKey: tls.key
      remoteRef:
        key: {{ $es.tls.vaultPath }}
        property: {{ $es.tls.keyProperty }}
---
# Identidades que a política do KES reconhece (hash, não a chave de API).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kes.identitiesSecretName" . }}
  labels:
    {{- include "kes.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreKind }}
    name: {{ $es.secretStoreName }}
  target:
    name: {{ include "kes.identitiesSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: KES_MINIO_IDENTITY
      remoteRef:
        key: {{ $es.identities.vaultPath }}
        property: {{ $es.identities.minioProperty }}
    - secretKey: KES_PROVISIONER_IDENTITY
      remoteRef:
        key: {{ $es.identities.vaultPath }}
        property: {{ $es.identities.provisionerProperty }}
{{- end }}
