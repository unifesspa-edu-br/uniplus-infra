{{- if and .Values.kes.enabled .Values.kes.networkPolicy.enabled }}
{{- $np := .Values.kes.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kes.name" . }}
  labels:
    {{- include "kes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if $np.hostCidrs }}
  ingress:
    # MinIO (rede do host) e o script de provisionamento, via hostPort.
    - from:
        {{- range $cidr := $np.hostCidrs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 7373
  {{- else }}
  # Sem hostCidrs não há quem chame o KES: nenhum ingress é aberto.
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.vaultNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: {{ $np.vaultPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
