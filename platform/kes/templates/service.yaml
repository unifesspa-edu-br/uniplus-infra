{{- if .Values.kes.enabled }}
# ClusterIP só para descoberta e diagnóstico dentro do cluster; o MinIO usa o
# hostPort do pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kes.name" . }}
  labels:
    {{- include "kes.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kes.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 7373
      targetPort: https
      protocol: TCP
{{- end }}
