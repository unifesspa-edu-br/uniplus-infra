{{- if .Values.kes.enabled }}
# O token desta ServiceAccount é o que o KES apresenta ao Vault (Kubernetes
# auth, role `kes`, vinculada a kes/kes). Por isso o automount fica ligado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kes.name" . }}
  labels:
    {{- include "kes.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
