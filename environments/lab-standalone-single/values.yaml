# Ambiente: lab-standalone-single
#
# Topologia de laboratório de host único — K3s + Docker no mesmo host (ver
# scripts/lab-standalone-single/), diferente do standalone-compact real
# (2 VMs: k8s-host + data-host). Complementar, não substitui: valida a
# mecânica dos charts/plataforma antes de replicar num servidor real da
# Unifesspa. Contexto completo na issue #395.
#
# Este arquivo NÃO é consumido pelo ApplicationSet real (não há cluster
# registrado no ArgoCD com esse nome) — é um values overlay de referência,
# aplicado manualmente via `helm install/upgrade -f` durante a implementação
# das Tasks da issue #395. Cresce incrementalmente conforme cada
# componente/Task é validado no lab.
#
# Sem peer PA1 nem OCI KMS — mesmo bug documentado em standalone-compact
# (go-kms-wrapping@v2.0.9 nil pointer no auto-unseal OCI KMS) se aplicaria
# aqui também, e não há nem sequer um provider de nuvem no lab. Shamir
# manual, single-node.

vault:
  enabled: true

  global:
    tlsDisable: true

  server:
    ha:
      enabled: true
      replicas: 1

      # replicas=1 não precisa de PDB — não há outro Pod para preservar
      # durante drain (mesmo racional do standalone-compact).
      disruptionBudget:
        enabled: false

      raft:
        enabled: true
        setNodeId: true
        # service_registration "kubernetes" REMOVIDO — mesmo bug documentado
        # em standalone-compact: K3s/flannel + service-account auth gera nil
        # response no GET do Pod, bloqueando requests síncronos do Vault.
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 1
            address         = "0.0.0.0:8200"
            cluster_address = "0.0.0.0:8201"
          }

          storage "raft" {
            path = "/vault/data"
          }

    dataStorage:
      size: 2Gi
    auditStorage:
      size: 2Gi

# NetworkPolicy: HABILITADA (chave raiz compartilhada pelos wrappers
# platform/vault/ e platform/external-secrets/, cada um instalado via
# `helm install <chart> -f` deste mesmo arquivo).
#
# Suposição anterior "k3s lab usa flannel, não enforça NetworkPolicy" era
# FALSA — k3s embute kube-router como NetworkPolicy controller mesmo com
# flannel como dataplane de pods, e ele ESTAVA bloqueando egress do ESO
# (Task #410). kubeApiCidrs precisa incluir o CIDR do host, não só o
# service CIDR: em K3s o apiserver roda como processo no host (não Pod),
# e kube-router avalia egress *após* o DNAT do kube-proxy — o pacote já
# reescrito para <node-ip>:6443 não bate em 10.43.0.0/16 sozinho (mesmo
# bug documentado em environments/standalone-compact/values.yaml linha
# ~600, ali com o CIDR da VCN OCI; aqui é o IP da VM de lab).
networkPolicy:
  enabled: true
  kubeApiCidrs:
    - 10.43.0.0/16
    - 192.168.1.65/32

ingress:
  enabled: false # acesso via kubectl port-forward

serviceMonitor:
  enabled: false # sem Prometheus Operator no lab

# ============================================================================
# External Secrets Operator — lê defaults de platform/external-secrets/values.yaml
# (replicaCount=1, NetworkPolicy on). Aqui só liga o ClusterSecretStore,
# que fica desligado por default até o Vault estar init+unsealed com a
# policy/role external-secrets configuradas (feito manualmente na Task #410,
# mesmo procedimento documentado em platform/external-secrets/README.md).
# ============================================================================
clusterSecretStore:
  enabled: true

  # Release `vault` instalado sem fullnameOverride no namespace `vault`
  # (Task #409 — `helm install vault platform/vault/ ...`), então o Service
  # do Vault é literalmente `vault`, não `platform-vault-<cluster>` (esse
  # padrão vale só para ambientes reconciliados pelo ApplicationSet).
  vaultServer: "http://vault.vault.svc.cluster.local:8200"

# ============================================================================
# uniplus-api-portal — deployable autônomo (ADR-0097 do uniplus-api).
# Sem Traefik/TLS no lab — Keycloak in-cluster é servido só via HTTP
# (Service ClusterIP, sem terminação TLS de edge). A API valida no boot
# que Auth:Authority use HTTPS fora de Development (StartupValidator),
# então Production rejeitaria o issuerUri http:// abaixo. Development
# também relaxa a obrigatoriedade de Cors:AllowedOrigins.
#
# LIMITAÇÃO CONHECIDA (issue #423): com Kafka desligado, o pod fica
# `Running` mas nunca `Ready` (0/1) — o SDK Confluent.Kafka da aplicação
# registra um producer ativo mesmo sem `Kafka:BootstrapServers` configurado
# (cai no default `localhost:9092`, loop de reconexão eterno), e isso
# mantém o Kafka health check dentro de `/health` (readiness, agregado)
# permanentemente Unhealthy — mesmo com todas as outras dependências reais
# (Postgres, Redis, MinIO, Keycloak) saudáveis. Confirmado via
# `/health/live` (dependency-free) respondendo Healthy e teste direto de
# conectividade. `readinessProbe` usa `/health` hardcoded no
# deployment.yaml do chart (não configurável via values sem alterar o
# contrato usado em produção, onde esse comportamento é desejado). Resolve
# quando a issue #423 (Apicurio Registry no lab) permitir religar Kafka
# com Schema Registry real.
# ============================================================================
uniplusApiPortal:
  enabled: true

  aspnet:
    environment: Development

  database:
    host: 192.168.1.65
  redis:
    host: 192.168.1.65
  kafka:
    enabled: false
  storage:
    endpoint: 192.168.1.65:9000

  oidc:
    issuerUri: http://keycloak-replica.uniplus.svc.cluster.local:8080/auth/realms/uniplus

  cors:
    allowedOrigins:
      - http://192.168.1.65:4200

  encryption:
    provider: local

  extraEnv:
    - name: UniPlus__Encryption__LocalKey
      valueFrom:
        secretKeyRef:
          name: uniplus-api-portal-encryption-local
          key: LOCAL_KEY

  ingress:
    enabled: false

  networkPolicy:
    enabled: false

  otel:
    enabled: false
