# Ambiente: lab-sp2
# Máquina: Core i7 12ª gen (Ubuntu Server 24.04 LTS)
# Papel: simulação do EVEO SP2 (Osasco)
# IP: 192.168.0.20
# Hostname: uniplus-sp2

ingress:
  host: uniplus-lab.shop
  tls:
    enabled: true
    issuer: cloudflare

# Distribuição de primaries Postgres em SP2:
# - Portal: REPLICA
# - Seleção: PRIMARY
# - Ingresso: REPLICA
postgres:
  portal:
    role: replica
  selecao:
    role: primary
  ingresso:
    role: replica

# Recursos para máquina menor (32 GB RAM)
# i7 12ª: 12C/16-20T, 32GB RAM, 1TB NVMe
# K8s tem disponível: ~16 threads, ~26GB RAM
resources:
  api:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  clamav:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1500Mi

replicas:
  apis: 1
  frontends: 1
  clamav: 1
  keycloak: 1
  redis: 1

# Observabilidade reduzida (i7 tem menos RAM).
#
# NOTA: bloco `observability:` é DOCUMENTAÇÃO; charts consomem suas
# próprias values. Wiring real abaixo.
observability:
  prometheus:
    retention: 3d  # menor que SP1
    storage: 10Gi
  loki:
    retention: 3d
    storage: 15Gi

# Wiring real do chart platform/observability/prometheus/ — retenção 3d
# (i7 com menos RAM/disco) e storage 10Gi.
kubePrometheusStack:
  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: 8GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: lab-local-nvme
            resources:
              requests:
                storage: 10Gi
      externalLabels:
        cluster: lab-sp2
  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: lab-local-nvme
  tempo:
    retention: 1d
    storage: 5Gi

cluster:
  name: lab-sp2
  region: lab
  dc: sp2

# ============================================================================
# StorageClass do tier de laboratório (ADR-007 + #31).
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: lab-local-nvme
    isDefault: false
    provisioner: rancher.io/local-path
    reclaimPolicy: Delete  # lab descartável; prod mantém Retain

# ============================================================================
# Topologia do laboratório — fonte única de verdade para IP/porta do Transit.
# Simétrico a lab-sp1: mesmo endpoint PA1, mesmas chaves topology.*.
# Embora lab-sp2 e lab-pa1 compartilhem o host i7 fisicamente,
# do ponto de vista de K8s são clusters K3s distintos (cross-cluster real).
# ============================================================================
topology:
  pa1HostIP: "192.168.0.20"   # host i7 (lab-pa1)
  transitNodePort: 30200       # NodePort exposto pelo K3s de lab-pa1
  transitScheme: https         # obrigatório após achado #37

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra lab-pa1 (ADR-007).
# ============================================================================
vault:
  enabled: true

  global:
    tlsDisable: true

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "${VAULT_TRANSIT_ADDRESS}"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "true"
          }

          service_registration "kubernetes" {}

    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token
      - envName: VAULT_TRANSIT_ADDRESS
        secretName: vault-transit-endpoint
        secretKey: address

    dataStorage:
      size: 5Gi
      storageClass: lab-local-nvme
    auditStorage:
      size: 5Gi
      storageClass: lab-local-nvme

vaultTransit:
  enabled: false

# NetworkPolicy do chart vault/ — egress Transit derivado de topology.* acima.
networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik
