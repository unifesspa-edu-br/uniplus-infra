# Ambiente: prod-sp1
# Servidor: EVEO SP1 (Cotia) — Tier III
# Especificação: Intel Xeon Gold 6138 (40C/80T), 96GB DDR4, 2TB NVMe RAID 1

ingress:
  host: uniplus.unifesspa.edu.br
  tls:
    enabled: true
    issuer: cloudflare  # ou letsencrypt-prod (decisão da Divisão de Redes)

postgres:
  portal:
    role: primary
  selecao:
    role: replica
  ingresso:
    role: primary

# Recursos plenos para produção
resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  clamav:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi

replicas:
  apis: 2
  frontends: 2
  clamav: 2
  keycloak: 2
  redis: 2

observability:
  prometheus:
    retention: 15d
    storage: 50Gi
  loki:
    retention: 30d
    storage: 100Gi
  tempo:
    retention: 7d
    storage: 50Gi

cluster:
  name: prod-sp1
  region: prod
  dc: sp1
