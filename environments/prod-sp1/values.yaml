# Ambiente: prod-sp1
# Servidor: EVEO SP1 (Cotia) — Tier III
# Especificação: Intel Xeon Gold 6138 (40C/80T), 96GB DDR4, 2TB NVMe RAID 1

ingress:
  host: uniplus.unifesspa.edu.br
  tls:
    enabled: true
    issuer: cloudflare  # ou letsencrypt-prod (decisão da Divisão de Redes)

postgres:
  portal:
    role: primary
  selecao:
    role: replica
  ingresso:
    role: primary

# Recursos plenos para produção
resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  clamav:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi

replicas:
  apis: 2
  frontends: 2
  clamav: 2
  keycloak: 2
  redis: 2

observability:
  prometheus:
    retention: 15d
    storage: 50Gi
  loki:
    retention: 30d
    storage: 100Gi
  tempo:
    retention: 7d
    storage: 50Gi

# NOTA: bloco `observability:` acima é DOCUMENTAÇÃO de intenção; os charts
# wrapper consomem suas próprias values. Wiring real abaixo.
#
# Prometheus em prod-sp1: retenção 15d (Tabela 10.1), storage 50Gi. Stack
# elevado para 2 réplicas para HA; pesquisa cross-cluster fica via Thanos
# em PA1 (chart separado, fora deste wrapper).
kubePrometheusStack:
  prometheus:
    prometheusSpec:
      replicas: 2
      retention: 15d
      retentionSize: 40GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: prod-local-nvme
            resources:
              requests:
                storage: 50Gi
      externalLabels:
        cluster: prod-sp1
  alertmanager:
    alertmanagerSpec:
      replicas: 2
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: prod-local-nvme

# Wiring real do chart platform/observability/grafana/ — tier prod-local-nvme,
# 2 réplicas para HA, datasource Prometheus do release deste cluster.
grafana:
  replicas: 2
  persistence:
    storageClassName: prod-local-nvme
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://platform-observability-prometheus-prod-sp1-prometheus.observability-prometheus.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

cluster:
  name: prod-sp1
  region: prod
  dc: sp1

# ============================================================================
# StorageClass do tier de produção (#31).
# Provisioner final (local-path vs CSI dedicado) é decisão da DIRSI durante
# a fase de promoção a HML/prod. Nome estável (prod-local-nvme) minimiza
# churn nos values dos demais charts independentemente do provisioner.
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: prod-local-nvme
    # Default mantém isDefault=false — em prod o cluster K3s pode ou não vir
    # com SC default pré-existente. DIRSI deve confirmar antes da promoção.
    isDefault: false
    # TODO DIRSI: confirmar provisioner antes da promoção a HML.
    # Default mantém local-path para facilitar bootstrap inicial.
    provisioner: rancher.io/local-path
    # Prod mantém Retain (default do chart) — dados Vault/Postgres não devem
    # ser perdidos por reclaim automático.

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra prod-pa1 (ADR-007).
# ----------------------------------------------------------------------------
# CONFIGURAÇÃO COMPLETA, MAS DESLIGADA POR DEFAULT ATÉ AS DEPENDÊNCIAS DE
# INFRAESTRUTURA REAL ESTAREM PRONTAS:
#   - cert-manager (#15) precisa entregar certificados via Secret vault-tls.
#   - Traefik (#14) precisa rotear tráfego para o IngressRoute do Vault.
#   - StorageClass nomeada precisa estar definida (sub-issue StorageClass).
#   - DNS público vault-transit.uniplus.unifesspa.edu.br precisa apontar
#     para o Traefik em prod-pa1, com regra de firewall liberando 8200/tcp
#     SP1 → PA1 (validada pela DIRSI conforme docs/network-matrix.md).
#   - Cluster K3s prod-sp1 precisa estar provisionado e registrado no ArgoCD
#     com label uniplus.io/managed=true.
#   - Vault Transit em prod-pa1 precisa ter sido bootstrapped (Shamir 5/3,
#     engine Transit, token criado) — ver docs/RUNBOOKS.md §1.4.A.
#   - Secret vault-transit-token precisa existir no namespace vault.
# Quando todos os pré-requisitos estiverem prontos, trocar `enabled: false`
# para `true` e abrir PR (toca prod-* → exige 2 aprovações conforme política).
# ============================================================================
vault:
  enabled: false

  global:
    tlsDisable: false

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 0
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "https://vault-transit.uniplus.unifesspa.edu.br"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "false"
          }

          service_registration "kubernetes" {}

    # Apenas VAULT_TRANSIT_TOKEN: em prod o seal address usa FQDN para TLS
    # (vault-transit.uniplus.unifesspa.edu.br) — sem ${VAULT_TRANSIT_ADDRESS}.
    # O FQDN está hardcoded no raft.config acima; topology.pa1HostIP serve
    # exclusivamente para a regra de egress da NetworkPolicy.
    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    # TLS cert montado a partir de Secret entregue pelo cert-manager.
    extraVolumes:
      - type: secret
        name: vault-tls

    dataStorage:
      size: 50Gi
      storageClass: prod-local-nvme

    auditStorage:
      size: 50Gi
      storageClass: prod-local-nvme

    # Recursos prod — folga acima da Tabela 10.1 (200m→500m / 256Mi→512Mi)
    # para suportar carga de produção. Limits ~2× requests.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

vaultTransit:
  enabled: false

# Topologia de prod-pa1 — preencher com IPs reais antes de habilitar Vault.
# pa1HostIP é o IP do LoadBalancer/VIP do Transit em PA1 (para ipBlock.cidr na
# NetworkPolicy). O endereço usado pelo seal "transit" é o FQDN no raft.config
# acima — os dois diferem porque TLS requer o hostname, NetworkPolicy requer IP.
# Confirmar IPs com a DIRSI antes da promoção para prod.
topology:
  pa1HostIP: ""          # TODO: IP do endpoint Transit em prod-pa1 (ex.: IP do LB EVEO PA1)
  transitNodePort: 443   # HTTPS via IngressRoute Traefik
  transitScheme: https

networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik

serviceMonitor:
  enabled: false
  port: https
  scheme: https
  tlsConfig:
    insecureSkipVerify: true
