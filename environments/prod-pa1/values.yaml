# Ambiente: prod-pa1
# Cluster K3s no DC institucional UNIFESSPA (Marabá-PA).
# Papel: 3º DC lógico — hospeda Vault Transit (auto-unseal cross-cluster
# para Vaults SP1 e SP2), Keycloak source institucional, MinIO replica,
# backup target e funções de quorum.
#
# Criado em 2026-05-03 (issue #13). Counterpart de produção do environment
# lab-pa1, seguindo a topologia do ADR-007.
#
# ============================================================================
# CONFIGURAÇÃO COMPLETA, MAS DESLIGADA POR DEFAULT — mesmas dependências
# de prod-sp1/sp2 (cert-manager, Traefik, StorageClass, DNS público,
# cluster K3s prod-pa1 provisionado e registrado no ArgoCD).
# Adicionalmente, prod-pa1 exige bootstrap manual do Vault Transit antes
# de habilitar prod-sp1/sp2 — ver docs/RUNBOOKS.md §1.4.A.
# ============================================================================

cluster:
  name: prod-pa1
  region: prod
  dc: pa1

# Vault de aplicação NÃO roda em PA1 — apenas Vault Transit.
vault:
  enabled: false

# Vault Transit em HA Raft (3 réplicas) em prod.
vaultTransit:
  enabled: false  # ligar quando dependências estiverem prontas

  global:
    tlsDisable: false

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 0
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/userconfig/vault-transit-tls/tls.crt"
            tls_key_file    = "/vault/userconfig/vault-transit-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"
          }

          # PA1 é o nó-raiz da cadeia de auto-unseal — selado por Shamir 5/3,
          # SEM seal upstream. Bootstrap manual conforme RUNBOOKS §1.4.A.

          service_registration "kubernetes" {}

    extraVolumes:
      - type: secret
        name: vault-transit-tls

    dataStorage:
      size: 20Gi
      # storageClass: <pendente sub-issue StorageClass — bloqueante para prod>

    auditStorage:
      size: 20Gi

    # Recursos prod — folga acima da Tabela 10.1 para HA Raft em produção.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Service em ClusterIP — exposição cross-DC via IngressRoute do Traefik
    # (vault-transit.uniplus.unifesspa.edu.br) com TLS terminado.
    service:
      type: ClusterIP
      port: 8200
      targetPort: 8200

# NetworkPolicy do vault-transit — libera 8200/tcp dos CIDRs SP1/SP2 reais.
networkPolicy:
  enabled: true
  # CIDRs dos racks EVEO Cotia (SP1) e Osasco (SP2) — confirmar com a DIRSI
  # antes da promoção. Evitar 0.0.0.0/0.
  allowedSourceCidrs: []  # TODO: preencher com CIDRs reais SP1/SP2
  traefikNamespace: traefik

# ----------------------------------------------------------------------------
# Componentes hospedados em prod-pa1 fora do K8s — entram em PRs futuros
# (Postgres backup, MinIO replica, etcd/quorum, OIDC source institucional).
# Estrutura placeholder para cada componente preencher quando entregue.
# ----------------------------------------------------------------------------

consensusWitness:
  enabled: false  # configurar com #10 (Postgres + Patroni)

keycloakMaster:
  enabled: false  # configurar com integração OIDC institucional

minioMaster:
  enabled: false  # configurar com #12 (MinIO bucket replication)

backupTarget:
  enabled: false  # configurar com automação de backup (sub-issue #13)
