# Ambiente: lab-witness
# Container isolado na máquina i7 simulando UNIFESSPA
# Papel: 3º nó do quórum etcd + Keycloak Master + MinIO Master + Backup target
# Rede: 172.30.0.0/16 (Docker bridge isolada)

# Componentes simulados
witness:
  enabled: true

  etcd:
    image: quay.io/coreos/etcd:v3.5
    name: witness
    listenClientUrls: http://0.0.0.0:2379
    listenPeerUrls: http://0.0.0.0:2380
    advertiseClientUrls: http://172.30.0.10:2379
    initialAdvertisePeerUrls: http://172.30.0.10:2380
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

keycloak_master:
  enabled: true
  image: quay.io/keycloak/keycloak:25.0
  mode: start-dev  # apenas em laboratório
  realm: unifesspa
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

minio_master:
  enabled: true
  image: minio/minio:latest
  consoleAddress: ":9001"
  buckets:
    - aprovado-mirror
    - bloqueado-mirror
    - postgres-backup
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

backup_target:
  enabled: true
  storage: 50Gi  # volume Docker para receber backups
  retention:
    full: 4 weeks
    incremental: 7 days

cluster:
  name: lab-witness
  region: lab
  dc: unifesspa-sim
