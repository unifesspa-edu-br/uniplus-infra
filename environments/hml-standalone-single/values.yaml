# Ambiente: hml-standalone-single
#
# Topologia de host único (mesmo modelo do `lab-standalone-single`, ADR-008),
# mas na VM REAL dedicada da UNIFESSPA (`192.168.21.134`, Ubuntu 24.04.4,
# 6 vCPU/31GB RAM, rede interna VPN-only, sem IP público). Diferente do lab
# (VirtualBox, aplicado manualmente via `helm install/upgrade -f`), este
# ambiente é **gerenciado continuamente pelo ArgoCD**
# (`argocd/applicationset.yaml`, label `uniplus.io/managed=true`,
# `environment: hml-standalone-single`) — o generator combina o cluster
# registrado com os 9 apps sempre-ligados + os apps habilitados só neste
# ambiente via o mecanismo de habilitação por-ambiente (`uniplus-api-host` e
# `unifesspa-geo-api`, ver `argocd/README.md` — story #457) + 14 componentes
# de platform, aplicando este arquivo como overlay em TODOS eles, não só nos
# referenciados abaixo.
#
# Isso muda a regra do jogo em relação ao lab: qualquer chart cujo default
# seja `enabled: true` e que não pertença ao escopo desta fase PRECISA de
# override explícito para `false` aqui — omitir a chave não é seguro (ao
# contrário do lab, que só instala manualmente o que é explicitamente
# comandado). Ver "Escopo desta fase" abaixo.
#
# Contexto completo: Epic #434, Feature #435, Story #439. Planejamento em
# `docs/RUNBOOKS.md §21`. Decisão de custódia do Vault em
# [ADR-014](../../docs/adrs/ADR-014-vault-shamir-hml-standalone-single.md).

# ============================================================================
# Escopo desta fase (Feature 1 do Epic #434 — "Bootstrap da fundação real")
# ============================================================================
#
# Habilitados: Vault, External Secrets Operator, Traefik+TLS (autoassinado,
# provisório — ADR/RUNBOOKS §21.2 item 2), Keycloak, Apicurio Registry,
# StorageClass, uniplusApiHost, uniplusWeb (portal + selecao + ingresso +
# configuracao, issues #488/#491) — os 4 sob PathPrefix real (`/portal`,
# `/selecao`, `/ingresso`, `/configuracao`) no mesmo host — e unifesspaGeoApi
# (issue #492: hostname `geo-api-hml.unifesspa.edu.br` já registrado pela
# CTIC, database `uniplus_geo` com PostGIS restaurado de dump real, secrets
# em Vault via custódia Shamir manual — ADR-014). Kafka roda fora do K8s
# (systemd no data-host, escopo do script de bootstrap #442), mas permanece
# desativado no Host nesta primeira publicação.
#
# Deliberadamente FORA de escopo:
#   - uniplusApiPortal — já registrado, imagem publicada, mas TLS real desta
#     VM depende do certificado autoassinado gerado no bootstrap
#     (#442/#445) — os apps .NET precisariam de `customCA.certPEM`,
#     acompanhar quando o app for de fato ligado neste ambiente.
#   - (removido — uniplusWeb saiu do "fora de escopo"; os 4 apps estão
#     habilitados, ver bloco `uniplusWeb` abaixo e issues #488/#491)
#   - cert-manager, Vault Transit (auto-unseal), Vault Transit Bootstrap
#     (engine transit local p/ idempotência do uniplus-api — sem consumidor
#     enquanto uniplusApiHost não roda aqui), observabilidade completa
#     (Prometheus/Grafana/Loki/Tempo/OTel Collector) — nenhum mencionado no
#     escopo da Feature 1; RUNBOOKS §21.4 documenta requisitos adicionais
#     (hostPort do OTel Collector, NetworkPolicy do Prometheus) que exigem
#     tratamento próprio antes de ligar, fora do escopo desta Story.
#
# Provisionamento de DB/roles (Postgres do Keycloak) e do client secret do
# Apicurio é responsabilidade do script de bootstrap (#442/#445) — mesma
# sequência já operada em `lab-standalone-single` (ver seu README.md).

cluster:
  name: hml-standalone-single
  region: unifesspa-interna
  dc: hml-standalone-single

# ============================================================================
# Vault (chart platform/vault/) — custódia Shamir manual, ver ADR-014.
# Mesma configuração de `lab-standalone-single`/`standalone-compact`: HA
# Raft com 1 réplica (host único), sem PDB (nada a preservar durante drain),
# `service_registration "kubernetes"` removido (K3s/flannel + auth por
# service-account gera nil response no GET do Pod, bloqueando requests
# síncronos do Vault — mesmo bug documentado em standalone-compact/lab).
# ============================================================================
vault:
  enabled: true

  global:
    tlsDisable: true # TLS terminado no Traefik, mesmo padrão do lab/standalone-compact

  server:
    ha:
      enabled: true
      replicas: 1

      disruptionBudget:
        enabled: false

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 1
            address         = "0.0.0.0:8200"
            cluster_address = "0.0.0.0:8201"
          }

          storage "raft" {
            path = "/vault/data"
          }

    dataStorage:
      size: 2Gi
      storageClass: hml-local-nvme
    auditStorage:
      size: 2Gi
      storageClass: hml-local-nvme

# Vault Transit (auto-unseal centralizado) e o bootstrap da engine Transit
# LOCAL (usada pela feature de idempotência do uniplus-api) — ambos
# desligados. O primeiro por decisão da ADR-014 (Shamir manual, sem Transit
# alcançável em rede). O segundo por falta de consumidor: uniplusApiHost
# não roda nesta fase (ver "Escopo desta fase" acima).
vaultTransit:
  enabled: false

vaultTransitBootstrap:
  enabled: false

# NetworkPolicy compartilhada pelos wrappers platform/vault/,
# platform/external-secrets/ e platform/traefik/ — cada chart lê só as
# sub-chaves que reconhece do MESMO bloco (convenção deste repo: 1 única
# chave `networkPolicy:` de topo por environment, nunca uma por chart —
# ver platform/vault/values.yaml, platform/external-secrets/values.yaml e
# platform/traefik/values.yaml, os 3 default esse mesmo formato). Duas
# chaves `networkPolicy:` de topo no MESMO arquivo colidem silenciosamente
# no parse YAML (a última sobrescreve a primeira, sem erro) — achado do
# Codex AI (uniplus-infra#492) que quase reproduziu esse bug ao acrescentar
# appNamespaces num segundo bloco separado.
#
# kubeApiCidrs precisa do CIDR do host, não só do service CIDR (K3s:
# apiserver roda como processo no host, não Pod; o kube-router avalia
# egress DEPOIS do DNAT do kube-proxy — mesmo bug documentado em
# lab-standalone-single/standalone-compact).
#
# appNamespaces (consumida só pelo platform/traefik/) é override total —
# Helm não faz merge de listas — por isso repete o default do chart
# (uniplus, vault, keycloak) e acrescenta `geo`: unifesspa-geo-api roda em
# namespace próprio (bounded context dedicado, argocd/applicationset.yaml),
# fora do `uniplus` compartilhado pelas demais apps. Sem `geo` aqui, a
# NetworkPolicy do Traefik bloqueia egress pro Service da geo-api mesmo com
# o pod Healthy — 502/503 silencioso.
networkPolicy:
  enabled: true
  kubeApiCidrs:
    - 10.43.0.0/16
    - 192.168.21.134/32
  appNamespaces:
    - uniplus
    - vault
    - keycloak
    - geo

ingress:
  enabled: false # acesso administrativo via kubectl port-forward / túnel VPN

serviceMonitor:
  enabled: false # sem Prometheus Operator habilitado nesta fase

# ============================================================================
# External Secrets Operator — o chart tem `enabled: true` como default
# (mantido). ClusterSecretStore fica `enabled: true` aqui — é o estado FINAL
# desejado, mesmo padrão de `environments/standalone-compact/values.yaml`
# (que também commita `true` direto).
#
# vaultServer: release do Vault, gerado pelo ApplicationSet como
# `platform-vault-<cluster>` (o chart não usa fullnameOverride), onde
# `<cluster>` é o `.name` do cluster ArgoCD — reflete o valor passado em
# `--name` no `argocd cluster add` (ou o contexto kubeconfig, se `--name`
# for omitido); `--in-cluster` sozinho NÃO força esse nome para `in-cluster`
# (a doc do `argocd cluster add` documenta `--name` como parâmetro que
# sobrescreve o nome do cluster, independente de `--in-cluster`).
#
# Em `standalone-compact` o resultado observado é o literal `in-cluster`
# (`platform-vault-in-cluster`, ver comentário em
# `environments/standalone-compact/values.yaml` linha ~674) — presumivelmente
# porque `--name in-cluster` foi passado explicitamente no registro original.
# A Story #442 instala ArgoCD na própria VM HML seguindo o mesmo padrão
# self-hosted, então este arquivo já assume `platform-vault-in-cluster` —
# mas isso só fica correto se a Story #445 passar `--name in-cluster`
# EXPLICITAMENTE ao registrar o cluster (contrato documentado em
# `docs/RUNBOOKS.md §21.7` e no resumo de
# `scripts/hml-standalone-single/bootstrap.sh`). Registrar com qualquer
# outro nome (ou sem `--name`, herdando o contexto kubeconfig) quebra este
# endereço — o Vault seria liberado como `platform-vault-<outro-nome>`.
#
# CONTRATO para a Story #445 (ordem = mesma de `standalone-compact`, ver
# `docs/RUNBOOKS.md §8.3`→`§8.4`): registrar o cluster no ArgoCD (que já
# provisiona Vault/ESO sealed/sem role, via ApplicationSet) ANTES de
# `vault operator init`. O primeiro sync do ClusterSecretStore fica
# OutOfSync/Degraded até o Vault ser inicializado e a role
# `external-secrets` configurada manualmente — esperado, não é erro; ArgoCD
# reconcilia automaticamente (self-heal) assim que a role existir, sem
# precisar recriar o cluster nem re-registrar nada.
# ============================================================================
clusterSecretStore:
  enabled: true
  vaultServer: "http://platform-vault-in-cluster.vault.svc.cluster.local:8200"

# ============================================================================
# StorageClass (chart platform/storage/) — nome obrigatório por tier
# (convenção do chart: lab-local-nvme, hml-local-nvme, prod-local-nvme...).
# provisioner (rancher.io/local-path) e reclaimPolicy (Retain) mantêm os
# defaults do chart — VM real não é descartável como o standalone-compact
# PAYG, então preservar dados em delete de PVC é o comportamento certo.
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: hml-local-nvme

# cert-manager fica desligado até a Feature 6 (pedido CTIC) resolver a
# estratégia de TLS real (docs/RUNBOOKS.md §21.2, item 2) — os únicos
# ClusterIssuer hoje implementados usam desafio HTTP-01, que não serve para
# esta VM (VPN-only, sem IP público alcançável pela Let's Encrypt). Manter
# ligado sem nenhum Certificate que ele consiga emitir só gera Applications
# Degraded sem propósito.
cert-manager:
  enabled: false

# ============================================================================
# Traefik (chart platform/traefik/) — hostPort 80+443 bindam direto na VM
# real (mesmo padrão do lab/standalone-compact). TLS autoassinado
# provisório (secret `uniplus-hml-unifesspa-tls`, criado manualmente via
# `kubectl create secret tls` durante o bootstrap #442/#445 e regenerado
# com SANs reais na issue #486 — não é gerenciado pelo cert-manager nem
# versionado no Git, mesmo padrão do lab).
# redirections: null mantém :80 servindo em paralelo, útil para smoke tests
# via curl sem exigir secure context.
# ============================================================================
traefik:
  service:
    type: NodePort
  ports:
    web:
      hostPort: 80
      http:
        redirections: null
    websecure:
      hostPort: 443

# ============================================================================
# Keycloak (chart apps/keycloak-replica/, default enabled=false).
#
# database.host e hostname.strict eram aplicados via `--set` ad-hoc no lab
# (nunca persistidos no values.yaml dele, ver environments/lab-standalone-single/README.md)
# — como este ambiente é GitOps (sem `--set` manual possível), precisam
# estar aqui explicitamente.
#
# hostname.url precisa bater com o host do IngressRoute abaixo — o `iss`
# claim dos tokens e os endpoints do discovery document derivam de
# KC_HOSTNAME; divergência quebra o fluxo de login OIDC (redirect_uri
# mismatch / iss inesperado).
#
# realmImport.portalClient e realmImport.apicurioClient são sobrescritos
# abaixo (issue #486, uniplusWeb.apps.portal ligado) — sem o override,
# ambos os clients OIDC herdariam os defaults do chart (redirectUris vazio
# no portal; hostname do standalone-compact no Apicurio), rejeitando o
# login pela UI/callback deste ambiente.
# ============================================================================
keycloak:
  enabled: true

  database:
    host: 192.168.21.134

  hostname:
    url: https://uniplus-oidc-hml.unifesspa.edu.br/auth
    strict: false

  ingress:
    enabled: true
    entryPoint: websecure
    host: uniplus-oidc-hml.unifesspa.edu.br
    tls:
      enabled: true
      secretName: uniplus-hml-unifesspa-tls

  networkPolicy:
    enabled: true
    dataHostCIDR: 192.168.21.134/32

  # Precisa estar ligado: o realm-reconcile-job aplica mudanças de config
  # (ex. portalClient, quando Feature 2/4 ligar) num Keycloak cujo realm já
  # foi importado antes — `--import-realm` só roda no primeiro boot (gotcha
  # documentado em feedback_keycloak_realm_reconcile_gated).
  realmReconcile:
    enabled: true

  realmImport:
    # Alinha com o nome de realm já usado localmente (uniplus-web e
    # uniplus-api têm realm-export.json com "realm": "unifesspa") e com o
    # Keycloak institucional de produção que este ambiente vai eventualmente
    # substituir. O realm anterior ("uniplus") fica órfão no Postgres do
    # Keycloak após esta troca — `--import-realm` só roda no primeiro boot
    # por realm (gotcha documentado em feedback_keycloak_realm_reconcile_gated),
    # então o realm novo é importado no próximo restart do pod (o checksum
    # do ConfigMap muda com esta edição), sem afetar o realm antigo, que
    # segue existindo até uma limpeza manual futura.
    realmName: unifesspa
    # Portal está ligado nesta fase (issue #486) — sem isso o client
    # uniplus-portal herda o default do chart (redirectUris vazio) e o
    # Keycloak rejeita o callback OIDC com invalid redirect_uri.
    portalClient:
      clientId: uniplus-portal
      rootUrl: https://uniplus-hml.unifesspa.edu.br
      redirectUris:
        - https://uniplus-hml.unifesspa.edu.br/*
      webOrigins:
        - https://uniplus-hml.unifesspa.edu.br
    # Sem isso, o client apicurio-registry herdaria o default do chart
    # (hostname do standalone-compact) — login pela UI do Apicurio neste
    # HML seria rejeitado pelo Keycloak (redirect_uri/origin não batem).
    apicurioClient:
      clientId: apicurio-registry
      redirectUris:
        - https://apicurio-hml.unifesspa.edu.br/*
        - https://apicurio-hml.unifesspa.edu.br/ui/*
      webOrigins:
        - https://apicurio-hml.unifesspa.edu.br

# ============================================================================
# uniplus-api-host — Host dos módulos internos Seleção, Ingresso,
# Configuração, Organização Institucional e Publicações (ADR-0097).
# Redis/MinIO/Postgres e os paths Vault são provisionados pela rotina
# scripts/hml-standalone-single/provision-api-host-prerequisites.sh.
# Kafka permanece desligado nesta primeira ativação: o chart define
# Kafka__BootstrapServers como espaço em branco, desligando Wolverine de forma
# explícita sem cair no default localhost:9092.
# ============================================================================
uniplusApiHost:
  enabled: true

  image:
    tag: v0.14.0

  # A migration passa a ser aplicada pelo Job `pre-upgrade` (ADR-0127 do
  # uniplus-api) antes do rollout, e não mais no boot do pod.
  #
  # O que isso resolve: migration quebrada aborta o sync com os pods anteriores
  # intactos, em vez de ser descoberta com o pod já removido — que foi o que
  # derrubou a api na promoção da v0.7.0, em 25/08.
  #
  # O que NÃO resolve: migration que passa mas é incompatível com a versão
  # anterior. O hook roda antes de o Deployment ser atualizado, então entre o
  # fim do Job e a morte do último pod anterior existe código velho servindo
  # sobre schema novo. Trocar a estratégia de rollout não fecha essa janela —
  # ver o comentário de `deploymentStrategy` no chart. O que fecha é a migration
  # ser compatível com as duas versões: expandir numa promoção, contrair na
  # seguinte.
  #
  # Exige imagem que conheça `UniPlus__Migrations__Mode`, o que a v0.8.0 fixada
  # acima é a primeira a fazer.
  migrationJob:
    enabled: true


  # Override de memória: o default do chart (512Mi/1Gi) fica abaixo do consumo
  # real deste ambiente — o processo assenta em ~861Mi, 84% do teto de 1Gi, e o
  # pico de inicialização (migrations EF no StartAsync + warmup de criptografia
  # + subida do Wolverine) estoura a margem restante e causa OOMKill. Fica aqui,
  # e não no default do chart, para não arrastar standalone-compact nem
  # lab-standalone-single, que não têm a mesma medição. Ver issue #512.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  database:
    host: 192.168.21.134

  redis:
    host: 192.168.21.134

  storage:
    endpoint: 192.168.21.134:9000

  oidc:
    issuerUri: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa

  customCA:
    enabled: true
    # Lê o mesmo certificado público usado pelo Traefik. Assim, recriar ou
    # rotacionar o Secret TLS não deixa uma cópia PEM obsoleta no Git.
    existingSecretName: uniplus-hml-unifesspa-tls
    existingSecretKey: tls.crt

  cors:
    allowedOrigins:
      # As 4 SPAs (portal/selecao/ingresso/configuracao) vivem sob o MESMO
      # host com PathPrefix (/portal, /selecao, /ingresso, /configuracao —
      # RUNBOOKS §21.2/§21.3), não em subdomínios próprios. CORS compara só
      # esquema+host+porta, nunca o path, então esta é a única origem
      # efetiva das quatro — `portal.*`/`selecao.*`/`ingresso.*` do valor
      # anterior eram subdomínios que nunca existiram nesta topologia (nem
      # em nip.io, nem nos 9 hostnames registrados pela CTIC — RUNBOOKS
      # §21.2).
      - https://uniplus-hml.unifesspa.edu.br

  encryption:
    provider: local

  extraEnv:
    - name: UniPlus__Encryption__LocalKey
      valueFrom:
        secretKeyRef:
          name: uniplus-api-host-encryption-local
          key: LOCAL_KEY

  ingress:
    enabled: true
    entryPoint: websecure
    host: uniplus-api-hml.unifesspa.edu.br
    pathPrefixes:
      - /api/ingresso
      - /api/selecao
      - /api/configuracao
      - /api/organizacao
      - /api/publicacoes
      - /api/auth
      - /api/profile
      - /openapi
    tls:
      enabled: true
      secretName: uniplus-hml-unifesspa-tls

  networkPolicy:
    enabled: true
    dataHostCIDR: 192.168.21.134/32
    oidcIssuerCIDR: 10.42.0.0/16
    oidcIssuerPort: 8443

  otel:
    enabled: false

# ============================================================================
# unifesspa-geo-api (chart apps/unifesspa-geo-api/) — localidades/CEP/
# georreferenciamento institucional. Habilitado após uniplus-infra#492:
# hostname já registrado pela CTIC, DB `uniplus_geo` (role `uniplus_geo_app`,
# PostGIS via TEMPLATE=template_postgis) provisionado e restaurado a partir
# de dump real no Postgres compartilhado da VM, secrets gravados no Vault
# (postgres/geo, geo/encryption — redis/default reaproveitado).
# ============================================================================
unifesspaGeoApi:
  enabled: true

  database:
    host: 192.168.21.134

  redis:
    host: 192.168.21.134

  oidc:
    issuerUri: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa

  # customCA via Secret existente (não PEM versionado — CLAUDE.md "nunca
  # commitar certificados"), mesmo padrão de uniplusApiHost acima: o mesmo
  # certificado autoassinado que o Traefik já serve, referenciado pelo
  # Secret que o bootstrap criou (não uma cópia estática que ficaria
  # desatualizada quando o certificado real da CTIC substituir o
  # autoassinado — Feature 6).
  customCA:
    enabled: true
    existingSecretName: uniplus-hml-unifesspa-tls
    existingSecretKey: tls.crt

  cors:
    allowedOrigins:
      - https://uniplus-hml.unifesspa.edu.br

  networkPolicy:
    dataHostCIDR: 192.168.21.134/32
    oidcIssuerCIDR: 10.42.0.0/16
    oidcIssuerPort: 8443

  ingress:
    enabled: true
    host: geo-api-hml.unifesspa.edu.br
    tls:
      enabled: true
      secretName: uniplus-hml-unifesspa-tls

# ============================================================================
# Apicurio Registry (chart apps/apicurio-registry/) — Schema Registry.
# Referência direta: lab-standalone-single (já validado, inclusive pelo
# spike de PathPrefix na própria VM real — ver
# docs/validacao/spike-pathprefix-hml-2026-07-12.md).
# ============================================================================
apicurioRegistry:
  enabled: true

  storage:
    host: 192.168.21.134

  oidc:
    issuerUri: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa

  # Quarkus rejeita o certificado autoassinado do Keycloak ao buscar o JWKS
  # sem isso ("OIDC Server is not available"). trust-all é aceitável só
  # porque o TLS é autoassinado nesta fase (nunca em produção real com
  # Let's Encrypt via cert-manager).
  extraEnv:
    - name: QUARKUS_TLS_TRUST_ALL
      value: "true"

  ingress:
    enabled: true
    entryPoint: websecure
    host: apicurio-hml.unifesspa.edu.br
    tls:
      enabled: true
      secretName: uniplus-hml-unifesspa-tls

  networkPolicy:
    enabled: true
    dataHostCIDR: 192.168.21.134/32
    keycloakService: keycloak-replica
    keycloakNamespace: uniplus
    keycloakPort: 8080
    # NÃO aponta pro IP da VM — o hostPort do Traefik é implementado via
    # DNAT (CNI portmap), e o kube-router avalia egress DEPOIS do DNAT: o
    # destino real pós-DNAT é o IP do Pod do Traefik (10.42.0.x), não o IP
    # da VM (mesmo gotcha documentado em kubeApiCidrs acima, aqui via
    # hostPort em vez de kube-proxy). Usa o pod CIDR do cluster + a porta
    # real do container (8443, entryPoint websecure).
    oidcIssuerCIDR: 10.42.0.0/16
    oidcIssuerPort: 8443

  serviceMonitor:
    enabled: false # sem Prometheus Operator habilitado nesta fase

# ============================================================================
# uniplus-web (chart apps/uniplus-web/) — os 3 apps (portal/selecao/ingresso)
# ligados, cada um sob seu PathPrefix real (/portal, /selecao, /ingresso) no
# mesmo host, sem StripPrefix (RUNBOOKS §21.3). uniplus-web#448 (nginx.conf
# parametrizado por subpath) fechou via PR uniplus-web#556 — o base href
# autofechado do build do Angular 21 não casava no sub_filter original,
# corrigido e validado com docker build+run+curl. Imagem v0.2.2 (issue #488).
# #447 (logout redireciona pro subpath) e #449 (validação E2E) da Feature
# #444 seguem abertas, não bloqueiam este deploy.
# ============================================================================
uniplusWeb:
  enabled: true

  # Tag override: uniplus-web#448 (nginx.conf parametrizado por subpath)
  # fechou via PR uniplus-web#556, publicado em v0.2.2 — mais recente que o
  # default do chart (v0.2.1). Pin explícito aqui, não no chart, pra não
  # afetar standalone-compact (segue no default até bump deliberado
  # próprio). Ver issue #488.
  apps:
    portal:
      enabled: true
      host: uniplus-hml.unifesspa.edu.br
      # PathPrefix real — migrado do smoke provisório na raiz (issue #486)
      # agora que uniplus-web#448 corrigiu o base href sob subpath (issue #488).
      pathPrefix: /portal
      tag: v0.13.1
      runtimeConfig:
        # apiUrl é só a origem — os apps já montam o path com o prefixo do
        # módulo (/api/portal/...) no cliente; concatenar aqui duplicaria
        # (/api/portal/api/portal/...). Mesmo padrão de
        # environments/lab-standalone-single/values.yaml. uniplus-api-portal
        # ainda não está ligado nesta fase (TLS real depende do customCA do
        # certificado autoassinado — ver "Escopo desta fase" no topo do
        # arquivo) — chamadas à API vão falhar em runtime até lá. apiUrl
        # vazio não é aceito pelo chart (ADR-0021 assertNaoEhPlaceholder).
        apiUrl: https://uniplus-api-hml.unifesspa.edu.br
        oidc:
          issuerUrl: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa
          clientId: uniplus-portal
        keycloak:
          url: https://uniplus-oidc-hml.unifesspa.edu.br/auth
          realm: unifesspa

    selecao:
      enabled: true
      host: uniplus-hml.unifesspa.edu.br
      pathPrefix: /selecao
      tag: v0.13.1
      runtimeConfig:
        # apiUrl é só a origem (ver comentário do portal acima) — o app já
        # monta /api/selecao/... no cliente. Backend real: já roteado no
        # uniplus-api-host (pathPrefixes acima).
        apiUrl: https://uniplus-api-hml.unifesspa.edu.br
        # geo-api é deployable separado (issue #508) — próprio host, não
        # atrás do uniplus-api-host. Sem isso, GET /api/cidades (wizard de
        # processo seletivo) caía no apiUrl errado.
        geoApiUrl: https://geo-api-hml.unifesspa.edu.br
        oidc:
          issuerUrl: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa
          clientId: uniplus-portal
        keycloak:
          url: https://uniplus-oidc-hml.unifesspa.edu.br/auth
          realm: unifesspa

    ingresso:
      enabled: true
      host: uniplus-hml.unifesspa.edu.br
      pathPrefix: /ingresso
      tag: v0.13.1
      runtimeConfig:
        # apiUrl é só a origem (ver comentário do portal acima) — o app já
        # monta /api/ingresso/... no cliente. Rota existe no uniplus-api-host,
        # mas o módulo Ingresso ainda não tem controller HTTP implementado
        # (RUNBOOKS §21.3) — chamadas à API vão 404 até lá.
        apiUrl: https://uniplus-api-hml.unifesspa.edu.br
        oidc:
          issuerUrl: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa
          clientId: uniplus-portal
        keycloak:
          url: https://uniplus-oidc-hml.unifesspa.edu.br/auth
          realm: unifesspa

    configuracao:
      enabled: true
      host: uniplus-hml.unifesspa.edu.br
      pathPrefix: /configuracao
      tag: v0.13.1
      runtimeConfig:
        # apiUrl é só a origem (ver comentário do portal acima) — o app já
        # monta /api/configuracao/... no cliente. Módulo Configuração já
        # tem controllers HTTP reais no uniplus-api-host (Campi, Cursos,
        # Modalidades, TiposBanca, FasesCanonicas etc. — bem mais completo
        # que Ingresso) e /api/configuracao entrou no pathPrefixes acima —
        # ao contrário do portal/ingresso, este módulo deve responder de
        # verdade, não só servir o shell estático.
        apiUrl: https://uniplus-api-hml.unifesspa.edu.br
        # geo-api é deployable separado (issue #508) — usado no formulário
        # de endereço (busca de CEP/cidade). Ver comentário do selecao acima.
        geoApiUrl: https://geo-api-hml.unifesspa.edu.br
        oidc:
          issuerUrl: https://uniplus-oidc-hml.unifesspa.edu.br/auth/realms/unifesspa
          clientId: uniplus-portal
        keycloak:
          url: https://uniplus-oidc-hml.unifesspa.edu.br/auth
          realm: unifesspa

  ingress:
    enabled: true
    entryPoint: websecure
    tls:
      enabled: true
      secretName: uniplus-hml-unifesspa-tls
      certManager:
        enabled: false
    # Raiz nua (https://uniplus-hml.unifesspa.edu.br/) não tem app próprio —
    # redireciona pro portal, o app padrão dos 4 sob subpath. Sem isso, cai
    # no 404 do Traefik (RUNBOOKS §21.3).
    rootRedirect:
      enabled: true
      to: /portal/

kubePrometheusStack:
  enabled: false

grafana:
  enabled: false

loki:
  enabled: false

tempo:
  enabled: false

otelCollector:
  enabled: false
