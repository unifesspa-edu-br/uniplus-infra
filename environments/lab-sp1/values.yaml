# Ambiente: lab-sp1
# Máquina: Ryzen 9 9950X (Arch Linux)
# Papel: simulação do EVEO SP1 (Cotia)
# IP: 192.168.0.10
# Hostname: uniplus-sp1

# Hostnames públicos (via Cloudflare Tunnel)
ingress:
  host: uniplus-lab.shop
  tls:
    enabled: true
    issuer: cloudflare  # TLS gerenciado pelo Cloudflare

# Distribuição de primaries Postgres em SP1:
# - Portal: PRIMARY
# - Seleção: REPLICA
# - Ingresso: PRIMARY
postgres:
  portal:
    role: primary
  selecao:
    role: replica
  ingresso:
    role: primary

# Recursos reduzidos para hardware do laboratório
# Ryzen 9950X: 16C/32T, 64GB RAM, 2TB NVMe
# K8s tem disponível: ~24 threads, ~50GB RAM
resources:
  api:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  clamav:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi

# Réplicas reduzidas
replicas:
  apis: 1        # 1 réplica de cada API
  frontends: 1   # 1 réplica de cada frontend
  clamav: 1
  keycloak: 1
  redis: 1

# Observabilidade com retenção curta
observability:
  prometheus:
    retention: 7d  # vs 15d em prod
    storage: 20Gi
  loki:
    retention: 7d
    storage: 30Gi
  tempo:
    retention: 3d
    storage: 10Gi

# Cluster identification
cluster:
  name: lab-sp1
  region: lab
  dc: sp1

# ============================================================================
# StorageClass do tier de laboratório (ADR-007 + #31).
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: lab-local-nvme
    isDefault: true
    provisioner: rancher.io/local-path

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra lab-pa1 (ADR-007).
# ============================================================================
vault:
  enabled: true

  global:
    tlsDisable: true  # cert-manager (#15) ainda placeholder

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        # Substitui a config default do chart `platform/vault/` para incluir
        # o bloco `seal "transit"` apontando para o Vault Transit em lab-pa1.
        # O endpoint NodePort 192.168.0.20:30200 é exposto pelo cluster K3s
        # de lab-pa1 (rede plana 192.168.0.0/16 do laboratório).
        # tls_skip_verify=true aceita cert self-signed enquanto cert-manager
        # (#15) ainda é placeholder.
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "http://192.168.0.20:30200"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "true"
          }

          service_registration "kubernetes" {}

    # Token do Transit é injetado via env var (Secret criado manualmente
    # após bootstrap do Transit em lab-pa1 — ver RUNBOOKS §1.4.B).
    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    dataStorage:
      size: 5Gi
      storageClass: lab-local-nvme
    auditStorage:
      size: 5Gi
      storageClass: lab-local-nvme

# Vault Transit não roda em SP — apenas em PA1.
vaultTransit:
  enabled: false

# NetworkPolicy do chart vault/ libera egress para o endpoint Transit.
networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik
  # CIDR do host i7 (lab-pa1) para egress do Vault rumo ao Transit.
  transitEndpointCidrs:
    - 192.168.0.20/32
  # NodePort exposto pelo Vault Transit em lab-pa1.
  transitEndpointPorts:
    - 30200
