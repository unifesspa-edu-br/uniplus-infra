# Ambiente: lab-sp1
# Máquina: Ryzen 9 9950X (Arch Linux)
# Papel: simulação do EVEO SP1 (Cotia)
# IP: 192.168.0.10
# Hostname: uniplus-sp1

# Hostnames públicos (via Cloudflare Tunnel)
ingress:
  host: uniplus-lab.shop
  tls:
    enabled: true
    issuer: cloudflare  # TLS gerenciado pelo Cloudflare

# Distribuição de primaries Postgres em SP1:
# - Portal: PRIMARY
# - Seleção: REPLICA
# - Ingresso: PRIMARY
postgres:
  portal:
    role: primary
  selecao:
    role: replica
  ingresso:
    role: primary

# Recursos reduzidos para hardware do laboratório
# Ryzen 9950X: 16C/32T, 64GB RAM, 2TB NVMe
# K8s tem disponível: ~24 threads, ~50GB RAM
resources:
  api:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  clamav:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi

# Réplicas reduzidas
replicas:
  apis: 1        # 1 réplica de cada API
  frontends: 1   # 1 réplica de cada frontend
  clamav: 1
  keycloak: 1
  redis: 1

# Observabilidade com retenção curta.
#
# NOTA: o bloco `observability:` é DOCUMENTAÇÃO de intenção (alinha com a
# Tabela 10.1 do ARCHITECTURE.md) e NÃO é consumido por nenhum chart. Os
# wrappers (`platform/observability/{prometheus,loki,...}`) consomem suas
# próprias values (ex.: `kubePrometheusStack.*`). Wiring real abaixo.
observability:
  prometheus:
    retention: 7d  # vs 15d em prod
    storage: 20Gi
  loki:
    retention: 7d
    storage: 30Gi
  tempo:
    retention: 3d
    storage: 10Gi

# Wiring real do chart platform/observability/prometheus/ — força StorageClass
# `lab-local-nvme` (default-class do K3s seria `local-path`), retenção 7d
# (alinhada com observability.prometheus.retention) e storage 20Gi.
kubePrometheusStack:
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 16GiB  # storage 20Gi com folga pra WAL
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: lab-local-nvme
            resources:
              requests:
                storage: 20Gi
      externalLabels:
        cluster: lab-sp1
  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: lab-local-nvme

# Wiring real do chart platform/observability/grafana/ — força tier
# `lab-local-nvme` no PVC e datasource Prometheus apontando para o
# Service real do release deste cluster.
grafana:
  persistence:
    storageClassName: lab-local-nvme
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://platform-observability-prometheus-lab-sp1-prometheus.observability-prometheus.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

# Cluster identification
cluster:
  name: lab-sp1
  region: lab
  dc: sp1

# ============================================================================
# StorageClass do tier de laboratório (ADR-007 + #31).
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: lab-local-nvme
    # K3s ships com 'local-path' já default — não duplicar (ver values default).
    isDefault: false
    provisioner: rancher.io/local-path
    # Lab é descartável — Delete evita acúmulo de PVs órfãos quando devs
    # sobem/derrubam Vault repetidamente. Prod mantém Retain (data sensível).
    reclaimPolicy: Delete

# ============================================================================
# Topologia do laboratório — fonte única de verdade para IP/porta do Transit.
# O chart platform/vault/ usa estes valores para gerar o Secret
# vault-transit-endpoint (VAULT_TRANSIT_ADDRESS) e a NetworkPolicy de egress.
# ============================================================================
topology:
  pa1HostIP: "192.168.0.20"   # host i7 (lab-pa1); SP1 e SP2 compartilham o mesmo PA1
  transitNodePort: 30200       # NodePort exposto pelo K3s de lab-pa1
  transitScheme: https         # obrigatório após achado #37 (cert self-signed no bootstrap)

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra lab-pa1 (ADR-007).
# ============================================================================
vault:
  enabled: true

  global:
    tlsDisable: true  # cert-manager (#15) ainda placeholder

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        # Substitui a config default do chart `platform/vault/` para incluir
        # o bloco `seal "transit"` apontando para o Vault Transit em lab-pa1.
        # O endereço é lido do env var VAULT_TRANSIT_ADDRESS, injetado via
        # Secret vault-transit-endpoint gerado pelo chart a partir de topology.*
        # (achado #37 — Transit serve HTTPS com cert self-signed do bootstrap).
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "${VAULT_TRANSIT_ADDRESS}"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "true"
          }

          service_registration "kubernetes" {}

    # Env vars injetados via Secrets:
    # - vault-transit-token: criado manualmente após bootstrap (RUNBOOKS §1.4.B)
    # - vault-transit-endpoint: gerado pelo chart a partir de topology.*
    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token
      - envName: VAULT_TRANSIT_ADDRESS
        secretName: vault-transit-endpoint
        secretKey: address

    dataStorage:
      size: 5Gi
      storageClass: lab-local-nvme
    auditStorage:
      size: 5Gi
      storageClass: lab-local-nvme

# Vault Transit não roda em SP — apenas em PA1.
vaultTransit:
  enabled: false

# NetworkPolicy do chart vault/ — egress Transit derivado de topology.* acima.
networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik
