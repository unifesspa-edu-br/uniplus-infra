# Valores de produção do chart infra/helm/verificador (uniplus-api).
#
# Estes values validam os charts no CI; os values que o ArgoCD aplica em produção
# vivem no repositório de implantação (GitLab institucional).
#
# Contrato de integração:
#   RabbitMQ   Secret `rabbitmq-verificador` (namespace uniplus), criado pela
#              API host (verificacao.rabbitMqExterno): URI AMQPS do broker na
#              VM de dados, vhost `verificacao`.
#   MinIO      uniplus-prod-infra.unifesspa.edu.br:9000 por HTTPS; credencial no
#              KV uniplus-prd, em minio/arquivos-candidato-verificador.
#   Rede       NetworkPolicy do chart apps/verificador-rede, pelo label
#              app.kubernetes.io/name=uniplus-verificador.
#   Espelho    http://clamav-espelho.uniplus.svc.cluster.local
replicaCount: 2

externalSecrets:
  secretStoreRef:
    name: uniplus
  minio:
    vaultPath: minio/arquivos-candidato-verificador

minio:
  endpoint: uniplus-prod-infra.unifesspa.edu.br:9000
  usarSsl: true

image:
  tag: v0.48.0

clamd:
  image:
    tag: v0.48.0
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 3584Mi
