# Ambiente: prod-sp2
# Servidor: EVEO SP2 (Osasco) — Tier III
# Especificação: Intel Xeon Gold 6138 (40C/80T), 96GB DDR4, 2TB NVMe RAID 1

ingress:
  host: uniplus.unifesspa.edu.br
  tls:
    enabled: true
    issuer: cloudflare

postgres:
  portal:
    role: replica
  selecao:
    role: primary
  ingresso:
    role: replica

resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  clamav:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi

replicas:
  apis: 2
  frontends: 2
  clamav: 2
  keycloak: 2
  redis: 2

observability:
  prometheus:
    retention: 15d
    storage: 50Gi
  loki:
    retention: 30d
    storage: 100Gi
  tempo:
    retention: 7d
    storage: 50Gi

cluster:
  name: prod-sp2
  region: prod
  dc: sp2

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra prod-pa1 (ADR-007).
# Configuração simétrica a prod-sp1 — mesmas dependências bloqueantes.
# Veja prod-sp1/values.yaml para a lista completa do que precisa estar
# pronto antes de habilitar (cert-manager, Traefik, StorageClass, DNS,
# bootstrap do Transit em prod-pa1, Secret vault-transit-token).
# ============================================================================
vault:
  enabled: false

  global:
    tlsDisable: false

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 0
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "https://vault-transit.uniplus.unifesspa.edu.br"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "false"
          }

          service_registration "kubernetes" {}

    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    extraVolumes:
      - type: secret
        name: vault-tls

    dataStorage:
      size: 50Gi
      # storageClass: <pendente sub-issue StorageClass — bloqueante para prod>

    auditStorage:
      size: 50Gi

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

vaultTransit:
  enabled: false

networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik
  transitEndpointCidrs: []  # TODO: preencher com CIDR do PA1 antes de habilitar Vault em prod
  transitEndpointPorts:
    - 443
