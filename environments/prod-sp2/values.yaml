# Ambiente: prod-sp2
# Servidor: EVEO SP2 (Osasco) — Tier III
# Especificação: Intel Xeon Gold 6138 (40C/80T), 96GB DDR4, 2TB NVMe RAID 1

ingress:
  host: uniplus.unifesspa.edu.br
  tls:
    enabled: true
    issuer: cloudflare

postgres:
  portal:
    role: replica
  selecao:
    role: primary
  ingresso:
    role: replica

resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  clamav:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi

replicas:
  apis: 2
  frontends: 2
  clamav: 2
  keycloak: 2
  redis: 2

observability:
  prometheus:
    retention: 15d
    storage: 50Gi
  loki:
    retention: 30d
    storage: 100Gi
  tempo:
    retention: 7d
    storage: 50Gi

# NOTA: bloco `observability:` acima é DOCUMENTAÇÃO; charts consomem
# suas próprias values. Wiring real abaixo (espelha prod-sp1).
kubePrometheusStack:
  prometheus:
    prometheusSpec:
      replicas: 2
      retention: 15d
      retentionSize: 40GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: prod-local-nvme
            resources:
              requests:
                storage: 50Gi
      externalLabels:
        cluster: prod-sp2
  alertmanager:
    alertmanagerSpec:
      replicas: 2
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: prod-local-nvme

# Wiring real do chart platform/observability/grafana/ — tier prod-local-nvme,
# 2 réplicas para HA, datasource Prometheus do release deste cluster
# (espelha prod-sp1).
grafana:
  replicas: 2
  persistence:
    storageClassName: prod-local-nvme
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://platform-observability-prometheus-prod-sp2-prometheus.observability-prometheus.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

cluster:
  name: prod-sp2
  region: prod
  dc: sp2

# ============================================================================
# StorageClass do tier de produção (#31).
# Espelha prod-sp1 — a decisão final de provisioner é da DIRSI.
# ============================================================================
storage:
  enabled: true
  storageClass:
    name: prod-local-nvme
    isDefault: false  # ver prod-sp1 para detalhes
    provisioner: rancher.io/local-path
    # reclaimPolicy: Retain (default — prod preserva dados)

# ============================================================================
# Vault HA Raft com auto-unseal Transit contra prod-pa1 (ADR-007).
# Configuração simétrica a prod-sp1 — mesmas dependências bloqueantes.
# Veja prod-sp1/values.yaml para a lista completa do que precisa estar
# pronto antes de habilitar (cert-manager, Traefik, StorageClass, DNS,
# bootstrap do Transit em prod-pa1, Secret vault-transit-token).
# ============================================================================
vault:
  enabled: false

  global:
    tlsDisable: false

  server:
    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 0
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"
          }

          seal "transit" {
            address         = "https://vault-transit.uniplus.unifesspa.edu.br"
            token           = "${VAULT_TRANSIT_TOKEN}"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "false"
          }

          service_registration "kubernetes" {}

    # Apenas VAULT_TRANSIT_TOKEN: mesmo padrão de prod-sp1 (seal via FQDN).
    extraSecretEnvironmentVars:
      - envName: VAULT_TRANSIT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    extraVolumes:
      - type: secret
        name: vault-tls

    dataStorage:
      size: 50Gi
      storageClass: prod-local-nvme

    auditStorage:
      size: 50Gi
      storageClass: prod-local-nvme

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

vaultTransit:
  enabled: false

# Mesmo padrão de prod-sp1 — preencher pa1HostIP antes de habilitar Vault.
topology:
  pa1HostIP: ""          # TODO: IP do endpoint Transit em prod-pa1 (confirmar com DIRSI)
  transitNodePort: 443
  transitScheme: https

networkPolicy:
  enabled: true
  externalSecretsNamespace: external-secrets
  traefikNamespace: traefik

serviceMonitor:
  enabled: false
  port: https
  scheme: https
  tlsConfig:
    insecureSkipVerify: true
